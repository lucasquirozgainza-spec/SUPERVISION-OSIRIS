<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Cobranza">
<meta name="theme-color" content="#0f1720">
<title>Osiris · Notas de cobranza</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --ink:#111827; --mute:#6b7280; --line:#e5e7eb;
  --acc:#2563eb; --acc-ink:#fff; --chip:#eef2f7; --ok:#16a34a; --bad:#dc2626;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0b1118; --card:#151d27; --ink:#e8edf3; --mute:#8b97a6; --line:#243042; --acc:#3b82f6; --chip:#1c2633; }
}
:root[data-theme="dark"]{ --bg:#0b1118; --card:#151d27; --ink:#e8edf3; --mute:#8b97a6; --line:#243042; --acc:#3b82f6; --chip:#1c2633; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overflow-x:hidden;overflow-x:clip}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}
.brand{font-weight:800;font-size:19px;flex:1;min-width:0}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--mute)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.tabs button{border:0;border-radius:10px;padding:9px 4px;background:var(--chip);color:var(--ink);font:inherit;font-size:13px;font-weight:600}
.tabs button.on{background:var(--acc);color:var(--acc-ink)}
main{padding:12px 16px calc(env(safe-area-inset-bottom) + 30px);max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);margin:18px 2px 8px;font-weight:700}
.h2:first-child{margin-top:6px}
.field{display:block;margin:0 0 10px}
.field span{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
input,select,textarea{box-sizing:border-box;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:0 12px;font:inherit;font-size:max(16px,1em);margin:0}
input,select{height:46px}
textarea{padding:10px 12px;min-height:70px;resize:vertical}
select{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;min-width:0;text-align:left;line-height:44px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dos .field{margin-bottom:10px}
.btn{border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:700;background:var(--chip);color:var(--ink);cursor:pointer}
.prim{background:var(--acc);color:var(--acc-ink);width:100%}
.danger{background:var(--bad);color:#fff}
.acts{display:flex;gap:8px;margin-top:6px}
.acts .btn{flex:1}
.msg{padding:10px 12px;border-radius:10px;background:var(--chip);font-size:14px;margin:10px 0}
.msg.bad{background:rgba(220,38,38,.12);color:var(--bad)}
.msg.ok{background:rgba(22,163,74,.12);color:var(--ok)}
.empty{text-align:center;color:var(--mute);padding:28px 10px}
.item{display:grid;grid-template-columns:1fr 1fr 44px;gap:6px;align-items:start;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.item [data-k=detalle]{grid-column:1 / -1}
.item input{height:42px;padding:0 10px}
.item .x{height:42px;padding:0;border-radius:10px}
.item label{font-size:12px;color:var(--mute)}
.item label input{margin-top:3px}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:18px;margin-top:8px}
.lit{color:var(--mute);font-size:13px;margin-top:2px}
.fila{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.fila:first-child{border-top:0;padding-top:0}
.fila .t{flex:1;min-width:0}
.fila .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila .t small{color:var(--mute)}
.fila .btn{padding:9px 12px;font-size:14px}
/* vista previa de la nota (hoja) */
.hoja{background:#fff;color:#111;border-radius:6px;padding:22px 20px;box-shadow:0 2px 10px rgba(0,0,0,.15);font-size:12px;line-height:1.35}
.hoja .hc{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.hoja img{height:52px}
.hoja .emp{font-size:10.5px;color:#444;margin-top:4px}
.hoja .num{text-align:right}
.hoja .num b{display:block;font-size:15px;letter-spacing:.5px}
.hoja .num .n{font-size:18px;color:#b2181e;font-weight:800}
.hoja .cli{border:1px solid #d6dbe3;border-radius:6px;padding:8px 10px;margin:14px 0 10px}
.hoja table{width:100%;border-collapse:collapse}
.hoja th{background:#b2181e;color:#fff;font-weight:600;padding:6px;text-align:left;font-size:11px}
.hoja td{border-bottom:1px solid #e3e7ee;padding:6px;vertical-align:top}
.hoja .r{text-align:right;white-space:nowrap}
.hoja .tot td{border:0;font-weight:800;font-size:13px}
.hoja .son{margin-top:6px}
.hoja .pie{margin-top:10px;color:#333}
.hoja .firmas{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:40px;text-align:center}
.hoja .firmas div{border-top:1px solid #666;padding-top:4px;font-size:11px}
.lock{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px;text-align:center}
.lock .card{width:100%;max-width:360px}
.lock input{text-align:center;letter-spacing:8px;font-size:24px}
[hidden]{display:none !important}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">Notas de cobranza<small>Osiris Security</small></div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-v="nota" class="on">Nueva nota</button>
    <button data-v="cli">Edificios</button>
    <button data-v="his">Historial</button>
    <button data-v="emp">Empresa</button>
  </nav>
</header>
<main id="main"><div class="empty">Cargando…</div></main>
<div class="lock" id="lock" hidden><div class="card" id="lockBox"></div></div>

async function sha256(txt){
  const data = new TextEncoder().encode(txt);
  if(window.crypto && crypto.subtle){
    try{ const b = await crypto.subtle.digest('SHA-256', data); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join(''); }catch(_){}
  }
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l = data.length, n = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(n); m.set(data); m[l] = 0x80;
  const dv = new DataView(m.buffer); dv.setUint32(n - 4, l * 8); dv.setUint32(n - 8, Math.floor(l / 0x20000000));
  const w = new Uint32Array(64), r = (x, k) => (x >>> k) | (x << (32 - k));
  for(let o = 0; o < n; o += 64){
    for(let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
    for(let i = 16; i < 64; i++){ const a = w[i-15], b = w[i-2]; w[i] = (w[i-16] + (r(a,7) ^ r(a,18) ^ (a >>> 3)) + w[i-7] + (r(b,17) ^ r(b,19) ^ (b >>> 10))) | 0; }
    let [a,b,c,d,e,f,g,h] = H;
    for(let i = 0; i < 64; i++){
      const t1 = (h + (r(e,6) ^ r(e,11) ^ r(e,25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((r(a,2) ^ r(a,13) ^ r(a,22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0; H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}

async function api(path){
  const c = new AbortController(), t = setTimeout(() => c.abort(), 20000);
  try{
    const r = await fetch(SB_URL + '/rest/v1/' + path, {headers:{apikey:SB_KEY, Accept:'application/json'}, cache:'no-store', signal:c.signal});

async function escribir(metodo, path, body){
  const h = {apikey:SB_KEY, Accept:'application/json'};
  if(body !== undefined){ h['Content-Type'] = 'application/json'; h.Prefer = 'return=minimal'; }
  const r = await fetch(SB_URL + '/rest/v1/' + path, {method:metodo, headers:h, body: body === undefined ? undefined : JSON.stringify(body)});
  if(!r.ok){ let t = ''; try{ t = await r.text(); }catch(_){} throw new Error('HTTP ' + r.status + (t ? ': ' + t.slice(0, 120) : '')); }
}

    if(d.clase === 'cob_empresa') S.empresa = {...EMPRESA_DEF, ...d};
    else if(d.clase === 'cob_cliente' && d.cid){ if(d.borrado) S.clientes.delete(d.cid); else S.clientes.set(d.cid, d); }
    else if(d.clase === 'cob_nota' && d.numero) notas.set(String(d.numero), d);   // el último con ese número manda
  }
  S.notas = [...notas.values()].sort((a, b) => b.numero - a.numero);
  /* nombres de edificios del monitor, para sugerir al registrar */
  try{
    const r = await api('eventos?select=edificio&tipo=eq.Config&order=created_at.desc&limit=2000');
    S.edificios = [...new Set(r.map(x => x.edificio).filter(x => x && x !== '*' && !x.startsWith('__')))].sort((a, b) => a.localeCompare(b, 'es'));
  }catch(_){ S.edificios = []; }
}
const clientesOrden = () => [...S.clientes.values()].sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
const siguienteNumero = () => (S.notas.reduce((m, n) => Math.max(m, +n.numero || 0), 0) + 1);

/* ---------- Formatos ---------- */
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const num4 = n => String(n).padStart(4, '0');
const bs = n => (Math.round((+n || 0) * 100) / 100).toLocaleString('es-BO', {minimumFractionDigits:2, maximumFractionDigits:2});
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
function fechaLarga(s){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? `${+m[3]} de ${MESES[+m[2] - 1]} de ${m[1]}` : (s || ''); }
function periodoTxt(s){ const m = /^(\d{4})-(\d{2})$/.exec(s || ''); return m ? MESES[+m[2] - 1].replace(/^./, c => c.toUpperCase()) + ' ' + m[1] : (s || ''); }

/* Número en letras (Bolivia): "TRES MIL QUINIENTOS 50/100 BOLIVIANOS" */
function letras(n){
  const U = ['','UNO','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE','DIEZ','ONCE','DOCE','TRECE','CATORCE','QUINCE',
    'DIECISÉIS','DIECISIETE','DIECIOCHO','DIECINUEVE','VEINTE','VEINTIUNO','VEINTIDÓS','VEINTITRÉS','VEINTICUATRO','VEINTICINCO',
    'VEINTISÉIS','VEINTISIETE','VEINTIOCHO','VEINTINUEVE'];
  const D = ['','','','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'];
  const C = ['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];
  const cien = x => {
    if(x === 100) return 'CIEN';
    const c = Math.floor(x / 100), r = x % 100;
    let t = C[c];
    if(r){ t += (t ? ' ' : '') + (r < 30 ? U[r] : D[Math.floor(r / 10)] + (r % 10 ? ' Y ' + U[r % 10] : '')); }
    return t;
  };
  const apocope = t => t.replace(/VEINTIUNO$/, 'VEINTIÚN').replace(/UNO$/, 'UN');
  const ent = Math.floor(Math.round(n * 100) / 100), cts = Math.round((n - ent) * 100);
  let t = '';
  const mill = Math.floor(ent / 1e6), miles = Math.floor((ent % 1e6) / 1000), resto = ent % 1000;
  if(mill) t += (mill === 1 ? 'UN MILLÓN' : apocope(cien(mill)) + ' MILLONES') + ' ';
  if(miles) t += (miles === 1 ? 'MIL' : apocope(cien(miles)) + ' MIL') + ' ';
  if(resto) t += cien(resto);
  t = t.trim() || 'CERO';
  return `${t} ${String(cts).padStart(2, '0')}/100 BOLIVIANOS`;
}

/* ---------- Acceso (mismo PIN de supervisión del monitor) ---------- */
async function acceso(){
  let pin = null;
  try{
    const r = await api('eventos?select=detalle&tipo=eq.Config&edificio=eq.' + MON + '&detalle->>clase=eq.pin&order=created_at.desc&limit=1');
    pin = r.length ? r[0].detalle : null;
  }catch(e){ $('#main').innerHTML = `<div class="msg bad">No se pudo conectar con la nube (${esc(e.message)}).</div>`; return false; }
  if(!pin || leer('sup') === pin.hash) return true;
  return new Promise(listo => {
    $('#lock').hidden = false;
    $('#lockBox').innerHTML = `<h2 style="margin-top:0">Notas de cobranza</h2><p style="color:var(--mute)">Ingresa tu PIN de supervisión</p>
      <label class="field"><input id="pPin" type="password" inputmode="numeric" maxlength="8" autocomplete="current-password"></label>
      <div id="pMsg"></div><button class="btn prim" id="pOk">Entrar</button>`;
    const ok = async () => {
      if(await sha256(pin.salt + ':' + $('#pPin').value.trim()) === pin.hash){ guardar('sup', pin.hash); $('#lock').hidden = true; listo(true); }
      else $('#pMsg').innerHTML = '<div class="msg bad">PIN incorrecto.</div>';
    };
    $('#pOk').onclick = ok;
    $('#pPin').addEventListener('keydown', e => { if(e.key === 'Enter') ok(); });
  });
}

/* --- Nueva nota --- */
function periodos(){
  const d = new Date(), out = [];
  for(let i = -9; i <= 2; i++){ const x = new Date(d.getFullYear(), d.getMonth() + i, 1); out.push(x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0')); }
  return out.reverse();
}
function nuevaNota(cid){
  const c = S.clientes.get(cid), hoy = new Date();
  const per = hoy.getFullYear() + '-' + String(hoy.getMonth() + 1).padStart(2, '0');
  return {cid, numero: siguienteNumero(), fecha: ymd(hoy), periodo: per, obs: '',
    items: [{detalle: c ? `${c.concepto || CONCEPTO_DEF} - ${periodoTxt(per)}` : '', cant: 1, precio: c && c.monto !== '' ? +c.monto : ''}]};
}
function totalDe(n){ return n.items.reduce((a, i) => a + (+i.cant || 0) * (+i.precio || 0), 0); }

  };
  const refrescar = () => { const t = totalDe(n); $('#nTot').textContent = 'Bs ' + bs(t); $('#nLit').textContent = 'Son: ' + letras(t); $('#nHoja').innerHTML = hojaHtml(n); };

    pintarItems(); refrescar();
  };
  $('#nNum').oninput = () => { n.numero = $('#nNum').value.replace(/\D/g, ''); refrescar(); };
  $('#nFec').oninput = () => { n.fecha = $('#nFec').value; refrescar(); };
  $('#nObs').oninput = () => { n.obs = $('#nObs').value; refrescar(); };
  $('#nItems').addEventListener('input', e => {
    const f = e.target.closest('.item'); if(!f || !e.target.dataset.k) return;

  $('#nMas').onclick = () => { n.items.push({detalle:'', cant:1, precio:''}); pintarItems(); refrescar(); };
  $('#nPdf').onclick = () => emitir(n, true);
}

/* Snapshot completo: la nota se puede volver a imprimir igual aunque cambien los datos */
function snapshot(n){
  return {numero:+n.numero, cid:n.cid, cliente:{...S.clientes.get(n.cid)}, empresa:{...S.empresa}, fecha:n.fecha, periodo:n.periodo,
    items:n.items.filter(i => String(i.detalle).trim() || +i.precio).map(i => ({detalle:String(i.detalle).trim(), cant:+i.cant || 0, precio:+i.precio || 0})),
    obs:String(n.obs || '').trim(), total:totalDe(n)};
}

function hojaHtml(n){

    <table><thead><tr><th>N°</th><th>Detalle</th><th class="r">Cant.</th><th class="r">P. unit. (Bs)</th><th class="r">Subtotal (Bs)</th></tr></thead>
    <tbody>${filas}<tr class="tot"><td></td><td></td><td></td><td class="r">TOTAL Bs</td><td class="r">${bs(s.total)}</td></tr></tbody></table>
    <div class="son"><b>Son:</b> ${esc(letras(s.total))}</div>

    <div class="firmas"><div>Recibí conforme</div><div>${esc(e.nombre)}</div></div>`;
}

/* ---------- PDF (dibujado, nítido; tamaño carta) ---------- */
function pdfDe(s){
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'letter'});
  const W = 215.9, M = 18, R = W - M, e = s.empresa, c = s.cliente || {};
  const AZUL = [178, 24, 30] /* rojo Osiris */, GRIS = [90, 98, 110];
  doc.setFont('helvetica', 'normal');
  try{ doc.addImage(LOGO_OSCURO, 'PNG', M, 14, 40, 40 * 226 / 480); }catch(_){}
  let y = 34.5;   /* el logo ya dice OSIRIS SECURITY */
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...GRIS);
  for(const l of [e.nit ? 'NIT ' + e.nit : '', e.direccion, [e.telefono, e.correo].filter(Boolean).join(' · '), e.web].filter(Boolean)){ y += 4.2; doc.text(l, M, y); }
  doc.setTextColor(...AZUL); doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.text('NOTA DE COBRANZA', R, 21, {align:'right'});
  doc.setFontSize(18); doc.text('N° ' + num4(s.numero), R, 30, {align:'right'});
  doc.setTextColor(40); doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  doc.text(fechaLarga(s.fecha), R, 37, {align:'right'}); doc.text('Mes: ' + periodoTxt(s.periodo), R, 42.5, {align:'right'});
  /* cliente */
  y = Math.max(y, 44) + 8;
  const lineas = [['Señores:', c.razon || c.nombre || '']];
  if(c.razon) lineas.push(['Edificio:', c.nombre]);
  if(c.nit) lineas.push(['NIT/CI:', c.nit]);
  if(c.direccion) lineas.push(['Dirección:', c.direccion + (c.ciudad ? ', ' + c.ciudad : '')]);
  if(c.contacto) lineas.push(['Atención:', c.contacto + (c.telefono ? ' · ' + c.telefono : '')]);
  const cajaH = 6 + lineas.length * 5.5;
  doc.setDrawColor(214, 219, 227); doc.roundedRect(M, y, R - M, cajaH, 2, 2);
  let yy = y + 6.5;
  for(const [k, v] of lineas){ doc.setFont('helvetica', 'bold'); doc.text(k, M + 4, yy); doc.setFont('helvetica', 'normal'); doc.text(doc.splitTextToSize(v, R - M - 34)[0] || '', M + 26, yy); yy += 5.5; }
  y += cajaH + 7;
  /* tabla */
  const X = {n:M + 2, det:M + 12, cant:R - 62, pu:R - 32, sub:R - 2};
  doc.setFillColor(...AZUL); doc.rect(M, y, R - M, 8, 'F');
  doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
  doc.text('N°', X.n, y + 5.4); doc.text('Detalle', X.det, y + 5.4); doc.text('Cant.', X.cant, y + 5.4, {align:'right'});
  doc.text('P. unit. (Bs)', X.pu, y + 5.4, {align:'right'}); doc.text('Subtotal (Bs)', X.sub, y + 5.4, {align:'right'});
  y += 8; doc.setTextColor(17); doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  s.items.forEach((i, k) => {
    const det = doc.splitTextToSize(i.detalle || '', X.cant - X.det - 16);
    const h = Math.max(8, det.length * 4.6 + 3.4);
    doc.text(String(k + 1), X.n, y + 5.4); doc.text(det, X.det, y + 5.4);
    doc.text(String(i.cant), X.cant, y + 5.4, {align:'right'}); doc.text(bs(i.precio), X.pu, y + 5.4, {align:'right'}); doc.text(bs(i.cant * i.precio), X.sub, y + 5.4, {align:'right'});
    y += h; doc.setDrawColor(227, 231, 238); doc.line(M, y, R, y);
  });
  y += 7; doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
  doc.text('TOTAL Bs', X.pu, y, {align:'right'}); doc.text(bs(s.total), X.sub, y, {align:'right'});
  y += 9; doc.setFontSize(10); doc.text('Son:', M, y); doc.setFont('helvetica', 'normal');
  const son = doc.splitTextToSize(letras(s.total), R - M - 12); doc.text(son, M + 11, y); y += son.length * 4.8 + 4;
  const parrafo = (titulo, txt) => {
    if(!txt) return;
    if(titulo){ doc.setFont('helvetica', 'bold'); doc.text(titulo, M, y); y += 5; }
    doc.setFont('helvetica', 'normal'); const l = doc.splitTextToSize(txt, R - M); doc.text(l, M, y); y += l.length * 4.8 + 3;
  };
  parrafo('Observaciones:', s.obs);
  if(e.banco && e.cuenta) parrafo('', `Pago por depósito o transferencia: ${e.banco}, cuenta N° ${e.cuenta}${e.titular ? ', a nombre de ' + e.titular : ''}.`);
  parrafo('', e.pie);
  /* firmas */
  const yf = Math.max(y + 28, 232);
  doc.setDrawColor(100); doc.line(M + 6, yf, M + 76, yf); doc.line(R - 76, yf, R - 6, yf);
  doc.setFontSize(9); doc.setTextColor(...GRIS);
  doc.text('Recibí conforme', M + 41, yf + 5, {align:'center'}); doc.text(e.nombre || '', R - 41, yf + 5, {align:'center'});
  doc.setFontSize(8); doc.text([e.web, e.correo].filter(Boolean).join(' · '), W / 2, 271, {align:'center'});
  return doc;
}

/* Generar: el PDF se arma y se comparte AL TOQUE (iPhone exige que sea en el mismo toque);
   después se guarda en el historial. */
async function emitir(n, nueva){
  const msg = (t, tipo = 'bad') => { const m = $('#nMsg') || $('#hMsg'); if(m) m.innerHTML = t ? `<div class="msg ${tipo}">${esc(t)}</div>` : ''; };
  if(!window.jspdf){ msg('No se pudo cargar el generador de PDF. Revisa tu conexión y vuelve a abrir la página.'); return; }
  const s = n.cliente ? n : snapshot(n);
  if(nueva){
    if(!(s.numero > 0)) return msg('Escribe el número de la nota.');
    if(!s.items.length || !(s.total > 0)) return msg('Pon al menos un concepto con su precio.');
    const usada = S.notas.find(x => +x.numero === s.numero);
    if(usada && usada.cid !== s.cid) return msg(`El N° ${num4(s.numero)} ya se usó para ${usada.cliente ? usada.cliente.nombre : 'otra nota'}. Usa otro número.`);
  }
  const nombre = `Nota de cobranza ${num4(s.numero)} - ${(s.cliente && s.cliente.nombre) || ''} - ${periodoTxt(s.periodo)}.pdf`.replace(/[\\/:*?"<>|]/g, '');
  const blob = pdfDe(s).output('blob');
  const archivo = new File([blob], nombre, {type:'application/pdf'});
  let compartido = null;
  if(navigator.canShare && navigator.canShare({files:[archivo]})) compartido = navigator.share({files:[archivo], title:nombre}).catch(() => {});
  else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); }
  if(nueva){
    try{
      await escribir('DELETE', 'eventos?tipo=eq.Config&edificio=eq.' + MON + '&detalle->>clase=eq.cob_nota&detalle->>numero=eq.' + s.numero);
      await escribir('POST', 'eventos', evento('cob_nota', s));
      S.notas = [s, ...S.notas.filter(x => +x.numero !== s.numero)].sort((a, b) => b.numero - a.numero);
      msg(`Nota N° ${num4(s.numero)} generada y guardada en el historial.`, 'ok');
      /* la siguiente nota ya queda con el número que sigue */
      n.numero = siguienteNumero();
      if($('#nNum')){ $('#nNum').value = n.numero; $('#nHoja').innerHTML = hojaHtml(n); }
    }catch(e){ msg('El PDF se generó, pero no se pudo guardar en el historial: ' + e.message); }
  }
  if(compartido) await compartido;
}

/* --- Historial --- */
function vHistorial(){
  const lista = S.notas;
  const filtro = leer('cob_filtro') || '';
  const nombres = [...new Set(lista.map(x => x.cliente && x.cliente.nombre).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));
  const ver = filtro ? lista.filter(x => x.cliente && x.cliente.nombre === filtro) : lista;
  const total = ver.reduce((a, x) => a + (+x.total || 0), 0);
  $('#main').innerHTML = `
    <label class="field"><span>Edificio</span><select id="hFil"><option value="">Todos</option>${nombres.map(x => `<option ${x === filtro ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></label>
    <div id="hMsg"></div>
    <div class="h2">${ver.length} nota${ver.length === 1 ? '' : 's'} · Bs ${bs(total)}</div>
    <div class="card">${ver.length ? ver.map(x => `<div class="fila"><div class="t"><b>N° ${num4(x.numero)} · ${esc(x.cliente ? x.cliente.nombre : '')}</b>
      <small>${esc(periodoTxt(x.periodo))} · ${esc(fechaLarga(x.fecha))} · Bs ${bs(x.total)}</small></div>
      <button class="btn" data-pdf="${x.numero}">PDF</button></div>`).join('') : '<div class="empty">Todavía no hay notas.</div>'}</div>`;
  $('#hFil').onchange = () => { guardar('cob_filtro', $('#hFil').value); vHistorial(); };
  $('#main').querySelectorAll('[data-pdf]').forEach(b => b.onclick = () => emitir(S.notas.find(x => +x.numero === +b.dataset.pdf), false));
}

/* ---------- Arranque ---------- */
(async function(){
  if(!(await acceso())) return;
  try{ await cargar(); }
  catch(e){ $('#main').innerHTML = `<div class="msg bad">No se pudo leer la nube (${esc(e.message)}).</div><button class="btn prim" onclick="location.reload()">Reintentar</button>`; return; }
  ir(S.clientes.size ? 'nota' : 'cli');
})();
