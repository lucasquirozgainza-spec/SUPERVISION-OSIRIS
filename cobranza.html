<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Cobranza">
<meta name="theme-color" content="#0f1720">
<title>Osiris · Notas de cobranza</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --ink:#111827; --mute:#6b7280; --line:#e5e7eb;
  --acc:#2563eb; --acc-ink:#fff; --chip:#eef2f7; --ok:#16a34a; --bad:#dc2626;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0b1118; --card:#151d27; --ink:#e8edf3; --mute:#8b97a6; --line:#243042; --acc:#3b82f6; --chip:#1c2633; }
}
:root[data-theme="dark"]{ --bg:#0b1118; --card:#151d27; --ink:#e8edf3; --mute:#8b97a6; --line:#243042; --acc:#3b82f6; --chip:#1c2633; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overflow-x:hidden;overflow-x:clip}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}
.brand{font-weight:800;font-size:19px;flex:1;min-width:0}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--mute)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.tabs button{border:0;border-radius:10px;padding:9px 4px;background:var(--chip);color:var(--ink);font:inherit;font-size:13px;font-weight:600}
.tabs button.on{background:var(--acc);color:var(--acc-ink)}
main{padding:12px 16px calc(env(safe-area-inset-bottom) + 30px);max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);margin:18px 2px 8px;font-weight:700}
.h2:first-child{margin-top:6px}
.field{display:block;margin:0 0 10px}
.field span{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
input,select,textarea{box-sizing:border-box;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:0 12px;font:inherit;font-size:max(16px,1em);margin:0}
input,select{height:46px}
textarea{padding:10px 12px;min-height:70px;resize:vertical}
select{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;min-width:0;text-align:left;line-height:44px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dos .field{margin-bottom:10px}
.btn{border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:700;background:var(--chip);color:var(--ink);cursor:pointer}
.prim{background:var(--acc);color:var(--acc-ink);width:100%}
.danger{background:var(--bad);color:#fff}
.acts{display:flex;gap:8px;margin-top:6px}
.acts .btn{flex:1}
.msg{padding:10px 12px;border-radius:10px;background:var(--chip);font-size:14px;margin:10px 0}
.msg.bad{background:rgba(220,38,38,.12);color:var(--bad)}
.msg.ok{background:rgba(22,163,74,.12);color:var(--ok)}
.empty{text-align:center;color:var(--mute);padding:28px 10px}
.item{display:grid;grid-template-columns:1fr 1fr 44px;gap:6px;align-items:start;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.item [data-k=detalle]{grid-column:1 / -1}
.item input{height:42px;padding:0 10px}
.item .x{height:42px;padding:0;border-radius:10px}
.item label{font-size:12px;color:var(--mute)}
.item label input{margin-top:3px}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:18px;margin-top:8px}
.lit{color:var(--mute);font-size:13px;margin-top:2px}
.fila{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.fila:first-child{border-top:0;padding-top:0}
.fila .t{flex:1;min-width:0}
.fila .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila .t small{color:var(--mute)}
.fila .btn{padding:9px 12px;font-size:14px}
/* vista previa: el mismo PDF que se entrega */
.prevCaja{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.18);min-height:120px}
.prev{display:block;width:100%;border:0;background:#fff}
.chk{display:flex;align-items:center;gap:10px;margin:4px 0 10px;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--acc)}
.fila a{color:var(--acc);font-weight:700}
.lock{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px;text-align:center}
.lock .card{width:100%;max-width:360px}
.lock input{text-align:center;letter-spacing:8px;font-size:24px}
[hidden]{display:none !important}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">Notas de cobranza<small>Osiris Security</small></div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-v="nota" class="on">Nueva nota</button>
    <button data-v="cli">Edificios</button>
    <button data-v="his">Historial</button>
    <button data-v="emp">Empresa</button>
  </nav>
</header>
<main id="main"><div class="empty">Cargando…</div></main>
<div class="lock" id="lock" hidden><div class="card" id="lockBox"></div></div>

async function sha256(txt){
  const data = new TextEncoder().encode(txt);
  if(window.crypto && crypto.subtle){
    try{ const b = await crypto.subtle.digest('SHA-256', data); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join(''); }catch(_){}
  }
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l = data.length, n = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(n); m.set(data); m[l] = 0x80;
  const dv = new DataView(m.buffer); dv.setUint32(n - 4, l * 8); dv.setUint32(n - 8, Math.floor(l / 0x20000000));
  const w = new Uint32Array(64), r = (x, k) => (x >>> k) | (x << (32 - k));
  for(let o = 0; o < n; o += 64){
    for(let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
    for(let i = 16; i < 64; i++){ const a = w[i-15], b = w[i-2]; w[i] = (w[i-16] + (r(a,7) ^ r(a,18) ^ (a >>> 3)) + w[i-7] + (r(b,17) ^ r(b,19) ^ (b >>> 10))) | 0; }
    let [a,b,c,d,e,f,g,h] = H;
    for(let i = 0; i < 64; i++){
      const t1 = (h + (r(e,6) ^ r(e,11) ^ r(e,25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((r(a,2) ^ r(a,13) ^ r(a,22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0; H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}

async function api(path){
  const c = new AbortController(), t = setTimeout(() => c.abort(), 20000);
  try{
    const r = await fetch(SB_URL + '/rest/v1/' + path, {headers:{apikey:SB_KEY, Accept:'application/json'}, cache:'no-store', signal:c.signal});

async function escribir(metodo, path, body){
  const h = {apikey:SB_KEY, Accept:'application/json'};
  if(body !== undefined){ h['Content-Type'] = 'application/json'; h.Prefer = 'return=minimal'; }
  const r = await fetch(SB_URL + '/rest/v1/' + path, {method:metodo, headers:h, body: body === undefined ? undefined : JSON.stringify(body)});
  if(!r.ok){ let t = ''; try{ t = await r.text(); }catch(_){} throw new Error('HTTP ' + r.status + (t ? ': ' + t.slice(0, 120) : '')); }
}

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function periodoTxt(s){ const m = /^(\d{4})-(\d{2})$/.exec(s || ''); return m ? MESES[+m[2] - 1].replace(/^./, c => c.toUpperCase()) + ' ' + m[1] : (s || ''); }

/* Número en letras (Bolivia): "TRES MIL QUINIENTOS 50/100 BOLIVIANOS" */
function letras(n){
  const U = ['','UNO','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE','DIEZ','ONCE','DOCE','TRECE','CATORCE','QUINCE',
    'DIECISÉIS','DIECISIETE','DIECIOCHO','DIECINUEVE','VEINTE','VEINTIUNO','VEINTIDÓS','VEINTITRÉS','VEINTICUATRO','VEINTICINCO',
    'VEINTISÉIS','VEINTISIETE','VEINTIOCHO','VEINTINUEVE'];
  const D = ['','','','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'];
  const C = ['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];
  const cien = x => {
    if(x === 100) return 'CIEN';
    const c = Math.floor(x / 100), r = x % 100;
    let t = C[c];
    if(r){ t += (t ? ' ' : '') + (r < 30 ? U[r] : D[Math.floor(r / 10)] + (r % 10 ? ' Y ' + U[r % 10] : '')); }
    return t;
  };
  const apocope = t => t.replace(/VEINTIUNO$/, 'VEINTIÚN').replace(/UNO$/, 'UN');
  const ent = Math.floor(Math.round(n * 100) / 100), cts = Math.round((n - ent) * 100);
  let t = '';
  const mill = Math.floor(ent / 1e6), miles = Math.floor((ent % 1e6) / 1000), resto = ent % 1000;
  if(mill) t += (mill === 1 ? 'UN MILLÓN' : apocope(cien(mill)) + ' MILLONES') + ' ';
  if(miles) t += (miles === 1 ? 'MIL' : apocope(cien(miles)) + ' MIL') + ' ';
  if(resto) t += cien(resto);
  t = t.trim() || 'CERO';
  return `${t} ${String(cts).padStart(2, '0')}/100 BOLIVIANOS`;
}

  const refrescar = () => { const t = totalDe(n); $('#nTot').textContent = 'Bs ' + bs(t); $('#nLit').textContent = 'Son: ' + letras(t); vistaPrevia($('#nHoja'), () => pdfNota(snapshot(n))); };
  pintarItems(); refrescar();
  $('#nCli').onchange = () => { S.nota = nuevaNota($('#nCli').value); S.nota.numero = n.numero; S.nota.fecha = n.fecha; vNota(); };
  $('#nPer').onchange = () => {
    const viejo = periodoTxt(n.periodo); n.periodo = $('#nPer').value;
    n.items.forEach(it => { if(it.detalle.endsWith(viejo)) it.detalle = it.detalle.slice(0, -viejo.length) + periodoTxt(n.periodo); });
    pintarItems(); refrescar();
  };
  $('#nNum').oninput = () => { n.numero = $('#nNum').value.replace(/\D/g, ''); refrescar(); };
  $('#nFec').oninput = () => { n.fecha = $('#nFec').value; refrescar(); };
  $('#nObs').oninput = () => { n.obs = $('#nObs').value; refrescar(); };
  $('#nFir').onchange = () => { n.firma = $('#nFir').checked; refrescar(); };
  $('#nItems').addEventListener('input', e => {
    const f = e.target.closest('.item'); if(!f || !e.target.dataset.k) return;
    const it = n.items[+f.dataset.i], k = e.target.dataset.k;
    it[k] = k === 'detalle' ? e.target.value : e.target.value.replace(',', '.');
    refrescar();
  });
  $('#nItems').addEventListener('click', e => { const b = e.target.closest('[data-quitar]'); if(b){ n.items.splice(+b.dataset.quitar, 1); pintarItems(); refrescar(); } });
  $('#nMas').onclick = () => { n.items.push({detalle:'', cant:1, precio:''}); pintarItems(); refrescar(); };
  $('#nPdf').onclick = () => emitir(n, true);
}

/* Snapshot completo: la nota se puede volver a imprimir igual aunque cambien los datos */
function snapshot(n){
  return {numero:+n.numero, cid:n.cid, cliente:{...S.clientes.get(n.cid)}, empresa:{...S.empresa}, fecha:n.fecha, periodo:n.periodo,
    items:n.items.filter(i => String(i.detalle).trim() || +i.precio).map(i => ({detalle:String(i.detalle).trim(), cant:+i.cant || 0, precio:+i.precio || 0})),
    obs:String(n.obs || '').trim(), total:totalDe(n), firma:n.firma !== false};
}

/* ---------- PDF (dibujado, nítido) ---------- */
const ROJO = [178, 24, 30], TINTA = [24, 28, 36], GRIS = [104, 112, 124], LINEA = [222, 226, 232], SUAVE = [247, 248, 250];
function nuevoDoc(formato, orientation = 'portrait'){ const {jsPDF} = window.jspdf; const d = new jsPDF({unit:'mm', format:formato, orientation}); d.setFont('helvetica', 'normal'); return d; }

/* Encabezado común: franja roja, logo, datos de Osiris (una sola vez) y el título con su recuadro de datos */
function encabezado(doc, W, e, titulo, filas){
  const M = 16, R = W - M;
  doc.setFillColor(...ROJO); doc.rect(0, 0, W, 3.2, 'F');
  try{ doc.addImage(LOGO_OSCURO, 'PNG', M, 9, 38, 38 * 226 / 480); }catch(_){}
  doc.setFontSize(8.5); doc.setTextColor(...GRIS);
  let y = 12;
  for(const l of [e.nit ? 'NIT ' + e.nit : '', e.direccion, e.telefono ? 'Tel. ' + e.telefono : '', e.correo, e.web].filter(Boolean)){ doc.text(l, R, y, {align:'right'}); y += 4.1; }
  y = Math.max(y, 9 + 38 * 226 / 480) + 4;
  doc.setDrawColor(...LINEA); doc.setLineWidth(0.3); doc.line(M, y, R, y);
  y += 10;
  doc.setTextColor(...ROJO); doc.setFont('helvetica', 'bold'); doc.setFontSize(19); doc.text(titulo, M, y);
  /* recuadro con número / fecha */
  const bw = 66, bx = R - bw, bh = 6 + filas.length * 5.6, by = y - 8.5;
  doc.setFillColor(...SUAVE); doc.setDrawColor(...LINEA); doc.roundedRect(bx, by, bw, bh, 1.8, 1.8, 'FD');
  let yy = by + 6.3;
  for(const [k, v, fuerte] of filas){
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...GRIS); doc.text(k, bx + 4, yy);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(fuerte ? 11 : 9.5); doc.setTextColor(...(fuerte ? ROJO : TINTA)); doc.text(v, R - 4, yy, {align:'right'});
    yy += 5.6;
  }
  doc.setFont('helvetica', 'normal'); doc.setTextColor(...TINTA);
  return Math.max(y + 6, by + bh + 6);
}
/* Bloque de datos con etiqueta pequeña arriba (SEÑORES, RECIBÍ DE…) */
function etiqueta(doc, txt, x, y){ doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.setTextColor(...GRIS); doc.text(txt.toUpperCase(), x, y, {charSpace:0.4}); doc.setTextColor(...TINTA); }
/* Firma y sello de Osiris sobre la línea; a la izquierda, la línea del cliente */
function firmas(doc, W, y, e, conFirma, textoCliente){
  const M = 16, R = W - M, ancho = 66, xo = R - ancho, xc = M;
  if(conFirma){
    try{ doc.addImage(SELLO, 'PNG', xo + 26, y - 34, 40, 40 * 370 / 420); }catch(_){}
    try{ doc.addImage(FIRMA, 'PNG', xo + 2, y - 18, 54, 54 * 180 / 604); }catch(_){}
  }
  doc.setDrawColor(120); doc.setLineWidth(0.3); doc.line(xo, y, R, y); doc.line(xc, y, xc + ancho, y);
  doc.setFontSize(8.5); doc.setTextColor(...TINTA); doc.setFont('helvetica', 'bold');
  doc.text(e.nombre || '', xo + ancho / 2, y + 4.6, {align:'center'}); doc.text(textoCliente, xc + ancho / 2, y + 4.6, {align:'center'});
  doc.setFont('helvetica', 'normal'); doc.setTextColor(...GRIS); doc.setFontSize(7.5);
  doc.text('Firma y sello', xo + ancho / 2, y + 8.4, {align:'center'}); doc.text('Firma y aclaración', xc + ancho / 2, y + 8.4, {align:'center'});
}

function pdfNota(s){
  const W = 215.9, M = 16, R = W - M, e = s.empresa, c = s.cliente || {};
  const doc = nuevoDoc('letter');
  let y = encabezado(doc, W, e, 'NOTA DE COBRANZA', [['N°', num4(s.numero), true], ['Fecha', fechaLarga(s.fecha)], ['Mes', periodoTxt(s.periodo)]]);
  /* cliente */
  etiqueta(doc, 'Señores', M, y); y += 5.5;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.text(c.razon || c.nombre || '', M, y); y += 5.4;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...GRIS);
  for(const l of [c.razon ? 'Edificio ' + c.nombre : '', c.nit ? 'NIT/CI ' + c.nit : '', c.direccion ? c.direccion + (c.ciudad ? ', ' + c.ciudad : '') : '',
    c.contacto ? 'Atención: ' + c.contacto + (c.telefono ? ' · ' + c.telefono : '') : ''].filter(Boolean)){ doc.text(l, M, y); y += 4.6; }
  doc.setTextColor(...TINTA); y += 5;
  /* tabla */
  const X = {n:M + 3, det:M + 13, cant:R - 66, pu:R - 34, sub:R - 3};
  doc.setFillColor(...ROJO); doc.rect(M, y, R - M, 8.5, 'F');
  doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5);
  doc.text('N°', X.n, y + 5.6); doc.text('DESCRIPCIÓN', X.det, y + 5.6); doc.text('CANT.', X.cant, y + 5.6, {align:'right'});
  doc.text('P. UNIT. (Bs)', X.pu, y + 5.6, {align:'right'}); doc.text('IMPORTE (Bs)', X.sub, y + 5.6, {align:'right'});
  y += 8.5; doc.setTextColor(...TINTA); doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  s.items.forEach((i, k) => {
    const det = doc.splitTextToSize(i.detalle || '', X.cant - X.det - 18);
    const h = Math.max(9, det.length * 4.6 + 4.4);
    if(k % 2){ doc.setFillColor(...SUAVE); doc.rect(M, y, R - M, h, 'F'); }
    doc.text(String(k + 1), X.n, y + 6); doc.text(det, X.det, y + 6);
    doc.text(String(i.cant), X.cant, y + 6, {align:'right'}); doc.text(bs(i.precio), X.pu, y + 6, {align:'right'}); doc.text(bs(i.cant * i.precio), X.sub, y + 6, {align:'right'});
    y += h;
  });
  doc.setDrawColor(...LINEA); doc.line(M, y, R, y);
  /* total */
  y += 4;
  doc.setFillColor(...ROJO); doc.roundedRect(R - 74, y, 74, 11, 1.5, 1.5, 'F');
  doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.text('TOTAL Bs', R - 70, y + 7.2);
  doc.setFontSize(12.5); doc.text(bs(s.total), R - 4, y + 7.4, {align:'right'});
  doc.setTextColor(...TINTA);
  y += 18;
  etiqueta(doc, 'Son', M, y); y += 5;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  const son = doc.splitTextToSize(letras(s.total), R - M); doc.text(son, M, y); y += son.length * 4.8 + 5;
  const bloque = (tit, txt) => { if(!txt) return; etiqueta(doc, tit, M, y); y += 5; doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
    const l = doc.splitTextToSize(txt, R - M); doc.text(l, M, y); y += l.length * 4.6 + 5; };
  bloque('Observaciones', s.obs);
  if(e.banco && e.cuenta) bloque('Datos para el pago', `${e.banco} · Cuenta N° ${e.cuenta}${e.titular ? ' · A nombre de ' + e.titular : ''}`);
  bloque('', e.pie);
  firmas(doc, W, Math.max(y + 34, 236), e, s.firma !== false, 'Recibí conforme');
  return doc;
}

function pdfRecibo(r){
  const W = 215.9, M = 16, R = W - M, e = r.empresa;
  const doc = nuevoDoc([139.7, 215.9], 'landscape');   // media carta, horizontal
  let y = encabezado(doc, W, e, 'RECIBO', [['N°', num4(r.numero), true], ['Fecha', fechaLarga(r.fecha)], ['Monto', 'Bs ' + bs(r.monto), true]]);
  const fila = (tit, txt, grande) => {
    etiqueta(doc, tit, M, y); y += 5;
    doc.setFont('helvetica', grande ? 'bold' : 'normal'); doc.setFontSize(grande ? 11.5 : 10);
    const l = doc.splitTextToSize(txt, R - M - (y > 88 ? 70 : 0)); doc.text(l, M, y); y += l.length * 4.9 + 2.4;
  };
  fila('Recibí de', r.de, true);
  fila('La suma de', letras(r.monto));
  fila('Por concepto de', r.concepto);
  fila('Forma de pago', r.forma + (r.ref ? ' · Ref. ' + r.ref : ''));
  firmas(doc, W, Math.min(Math.max(y + 24, 112), 126), e, r.firma !== false, 'Entregué conforme');
  return doc;
}

/* El PDF se arma y se comparte AL TOQUE (iPhone exige que sea en el mismo toque) */
function compartirPdf(doc, nombre){
  nombre = nombre.replace(/[\\/:*?"<>|]/g, '');
  const blob = doc.output('blob');
  const archivo = new File([blob], nombre, {type:'application/pdf'});
  if(navigator.canShare && navigator.canShare({files:[archivo]})) return navigator.share({files:[archivo], title:nombre}).catch(() => {});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  return null;
}
/* Vista previa: el mismo PDF que se va a entregar */
let PREV_URL = null, PREV_T = null;
function vistaPrevia(caja, doc){
  clearTimeout(PREV_T);
  PREV_T = setTimeout(() => {
    if(!window.jspdf || !caja.isConnected) return;
    try{
      const d = doc(), ps = d.internal.pageSize;
      const url = URL.createObjectURL(d.output('blob'));
      if(PREV_URL) URL.revokeObjectURL(PREV_URL); PREV_URL = url;
      caja.innerHTML = `<iframe class="prev" style="aspect-ratio:${ps.getWidth()} / ${ps.getHeight()}" src="${url}#toolbar=0&navpanes=0&view=FitH" title="Vista previa"></iframe>`;
    }catch(_){}
  }, 450);
}

async function emitir(n, nueva){
  const msg = (t, tipo = 'bad') => { const m = $('#nMsg') || $('#hMsg'); if(m) m.innerHTML = t ? `<div class="msg ${tipo}">${esc(t)}</div>` : ''; };
  if(!window.jspdf){ msg('No se pudo cargar el generador de PDF. Revisa tu conexión y vuelve a abrir la página.'); return; }
  const s = n.cliente ? n : snapshot(n);
  if(nueva){
    if(!(s.numero > 0)) return msg('Escribe el número de la nota.');
    if(!s.items.length || !(s.total > 0)) return msg('Pon al menos un concepto con su precio.');
    const usada = S.notas.find(x => +x.numero === s.numero);
    if(usada && usada.cid !== s.cid) return msg(`El N° ${num4(s.numero)} ya se usó para ${usada.cliente ? usada.cliente.nombre : 'otra nota'}. Usa otro número.`);
  }
  const compartido = compartirPdf(pdfNota(s), `Nota de cobranza ${num4(s.numero)} - ${(s.cliente && s.cliente.nombre) || ''} - ${periodoTxt(s.periodo)}.pdf`);
  if(nueva){
    try{
      await escribir('DELETE', 'eventos?tipo=eq.Config&edificio=eq.' + MON + '&detalle->>clase=eq.cob_nota&detalle->>numero=eq.' + s.numero);
      await escribir('POST', 'eventos', evento('cob_nota', s));
      S.notas = [s, ...S.notas.filter(x => +x.numero !== s.numero)].sort((a, b) => b.numero - a.numero);
      msg(`Nota N° ${num4(s.numero)} generada y guardada en el historial.`, 'ok');
      n.numero = siguienteNumero();
      if($('#nNum')){ $('#nNum').value = n.numero; vistaPrevia($('#nHoja'), () => pdfNota(snapshot(n))); }
    }catch(e){ msg('El PDF se generó, pero no se pudo guardar en el historial: ' + e.message); }
  }
  if(compartido) await compartido;
}

/* ---------- Recibos ---------- */
const FORMAS = ['Efectivo', 'Transferencia bancaria', 'Depósito bancario', 'Pago QR', 'Cheque'];
const siguienteRecibo = () => (S.recibos.reduce((m, r) => Math.max(m, +r.numero || 0), 0) + 1);
const recibosDe = num => S.recibos.filter(r => +r.nota === +num);
const pagado = nota => recibosDe(nota.numero).reduce((a, r) => a + (+r.monto || 0), 0);

function formRecibo(nota){
  const c = nota.cliente || {}, saldo = Math.max(0, Math.round((nota.total - pagado(nota)) * 100) / 100);
  const r = S.recibo = {numero: siguienteRecibo(), nota: nota.numero, cid: nota.cid, fecha: ymd(new Date()), monto: saldo || nota.total,
    forma: FORMAS[0], ref: '', de: c.razon || c.nombre || '', firma: true,
    concepto: `Pago de la nota de cobranza N° ${num4(nota.numero)} - ${nota.items.map(i => i.detalle).join('; ')}`};
  $('#hForm').innerHTML = `<div class="card">
    <div class="h2" style="margin-top:0">Recibo de la nota N° ${num4(nota.numero)} · ${esc(c.nombre || '')}</div>
    <div class="dos"><label class="field"><span>N° de recibo</span><input id="rNum" inputmode="numeric" value="${r.numero}"></label>
      <label class="field"><span>Fecha de pago</span><input id="rFec" type="date" value="${r.fecha}"></label></div>
    <div class="dos"><label class="field"><span>Monto (Bs)</span><input id="rMon" inputmode="decimal" value="${r.monto}"></label>
      <label class="field"><span>Forma de pago</span><select id="rFor">${FORMAS.map(f => `<option>${f}</option>`).join('')}</select></label></div>
    <label class="field"><span>N° de operación o referencia (opcional)</span><input id="rRef"></label>
    <label class="field"><span>Recibí de</span><input id="rDe" value="${esc(r.de)}"></label>
    <label class="field"><span>Por concepto de</span><textarea id="rCon">${esc(r.concepto)}</textarea></label>
    <label class="chk"><input type="checkbox" id="rFir" checked> Con firma y sello</label>
    <div id="rMsg"></div>
    <div class="acts"><button class="btn" id="rCan">Cancelar</button><button class="btn prim" id="rOk">Generar recibo</button></div>
    <div class="h2">Vista previa</div><div id="rPrev" class="prevCaja"></div></div>`;
  const leerForm = () => { r.numero = +$('#rNum').value.replace(/\D/g, ''); r.fecha = $('#rFec').value; r.monto = +String($('#rMon').value).replace(',', '.') || 0;
    r.forma = $('#rFor').value; r.ref = $('#rRef').value.trim(); r.de = $('#rDe').value.trim(); r.concepto = $('#rCon').value.trim(); r.firma = $('#rFir').checked; };
  const prev = () => { leerForm(); vistaPrevia($('#rPrev'), () => pdfRecibo({...r, empresa:{...S.empresa}})); };
  $('#hForm').addEventListener('input', prev); $('#hForm').addEventListener('change', prev); prev();
  $('#hForm').scrollIntoView({block:'start'});
  $('#rCan').onclick = () => { S.recibo = null; $('#hForm').innerHTML = ''; };
  $('#rOk').onclick = async () => {
    leerForm();
    const m = t => $('#rMsg').innerHTML = `<div class="msg bad">${esc(t)}</div>`;
    if(!window.jspdf) return m('No se pudo cargar el generador de PDF. Revisa tu conexión.');
    if(!(r.numero > 0)) return m('Escribe el número del recibo.');
    if(!(r.monto > 0)) return m('Escribe el monto recibido.');
    if(!r.de) return m('Escribe de quién recibiste el pago.');
    const usado = S.recibos.find(x => +x.numero === r.numero);
    if(usado && +usado.nota !== +r.nota) return m(`El recibo N° ${num4(r.numero)} ya se usó. Usa otro número.`);
    const rec = {...r, empresa:{...S.empresa}, cliente:{...c}};
    const compartido = compartirPdf(pdfRecibo(rec), `Recibo ${num4(rec.numero)} - ${c.nombre || ''}.pdf`);
    try{
      await escribir('DELETE', 'eventos?tipo=eq.Config&edificio=eq.' + MON + '&detalle->>clase=eq.cob_recibo&detalle->>numero=eq.' + rec.numero);
      await escribir('POST', 'eventos', evento('cob_recibo', rec));
      S.recibos = [rec, ...S.recibos.filter(x => +x.numero !== rec.numero)];
      S.recibo = null; vHistorial(); $('#hMsg').innerHTML = `<div class="msg ok">Recibo N° ${num4(rec.numero)} generado y guardado.</div>`;
    }catch(e){ m('El PDF se generó, pero no se pudo guardar: ' + e.message); }
    if(compartido) await compartido;
  };
}

/* --- Historial (notas y sus recibos) --- */
function vHistorial(){
  const lista = S.notas;
  const filtro = leer('cob_filtro') || '';
  const nombres = [...new Set(lista.map(x => x.cliente && x.cliente.nombre).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));
  const ver = filtro ? lista.filter(x => x.cliente && x.cliente.nombre === filtro) : lista;
  const total = ver.reduce((a, x) => a + (+x.total || 0), 0), cobrado = ver.reduce((a, x) => a + Math.min(pagado(x), +x.total || 0), 0);
  const estado = x => { const p = pagado(x); return p >= x.total - 0.005 ? ['Pagada', 'var(--ok)'] : p > 0 ? ['Pago parcial', '#d97706'] : ['Pendiente', 'var(--mute)']; };
  $('#main').innerHTML = `
    <label class="field"><span>Edificio</span><select id="hFil"><option value="">Todos</option>${nombres.map(x => `<option ${x === filtro ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></label>
    <div id="hMsg"></div><div id="hForm"></div>
    <div class="h2">${ver.length} nota${ver.length === 1 ? '' : 's'} · Bs ${bs(total)} · cobrado Bs ${bs(cobrado)}</div>
    <div class="card">${ver.length ? ver.map(x => { const [et, col] = estado(x); const recs = recibosDe(x.numero);
      return `<div class="fila"><div class="t"><b>N° ${num4(x.numero)} · ${esc(x.cliente ? x.cliente.nombre : '')}</b>
        <small>${esc(periodoTxt(x.periodo))} · Bs ${bs(x.total)} · <span style="color:${col};font-weight:700">${et}</span></small>
        ${recs.map(r => `<small style="display:block">Recibo N° ${num4(r.numero)} · ${esc(fechaLarga(r.fecha))} · Bs ${bs(r.monto)} · <a href="#" data-rpdf="${r.numero}">PDF</a></small>`).join('')}</div>
        <div style="display:flex;flex-direction:column;gap:6px"><button class="btn" data-pdf="${x.numero}">Nota</button><button class="btn" data-rec="${x.numero}">Recibo</button></div></div>`; }).join('')
      : '<div class="empty">Todavía no hay notas.</div>'}</div>`;
  $('#hFil').onchange = () => { guardar('cob_filtro', $('#hFil').value); vHistorial(); };
  $('#main').querySelectorAll('[data-pdf]').forEach(b => b.onclick = () => emitir(S.notas.find(x => +x.numero === +b.dataset.pdf), false));
  $('#main').querySelectorAll('[data-rec]').forEach(b => b.onclick = () => formRecibo(S.notas.find(x => +x.numero === +b.dataset.rec)));
  $('#main').querySelectorAll('[data-rpdf]').forEach(a => a.onclick = ev => { ev.preventDefault();
    if(!window.jspdf) return; const r = S.recibos.find(x => +x.numero === +a.dataset.rpdf); if(r) compartirPdf(pdfRecibo(r), `Recibo ${num4(r.numero)} - ${(r.cliente && r.cliente.nombre) || ''}.pdf`); });
}

/* ---------- Arranque ---------- */
(async function(){
  if(!(await acceso())) return;
  try{ await cargar(); }
  catch(e){ $('#main').innerHTML = `<div class="msg bad">No se pudo leer la nube (${esc(e.message)}).</div><button class="btn prim" onclick="location.reload()">Reintentar</button>`; return; }
  ir(S.clientes.size ? 'nota' : 'cli');
})();
