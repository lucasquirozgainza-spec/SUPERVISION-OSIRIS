name: Avisos Osiris
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node alertas/alertas.mjs
