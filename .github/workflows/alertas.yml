name: Avisos Osiris
# Los avisos ahora los manda Google Apps Script (alertas/osiris_avisos.gs) cada 10 minutos:
# GitHub corria esto cada 4 a 6 horas y el servicio de correo rechazaba sus envios (403).
on:
  workflow_dispatch:
jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node alertas/alertas.mjs
