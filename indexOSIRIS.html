<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Osiris">
<meta name="theme-color" content="#0f1720">
<meta property="og:title" content="Osiris · Monitor en línea">
<meta property="og:description" content="Ingresos, salidas, rondas y novedades por edificio">
<title>Osiris Monitor</title>
<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --ink:#111827; --mute:#6b7280; --line:#e5e7eb;
  --acc:#2563eb; --acc-ink:#fff; --chip:#eef2f7;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#0891b2; --violet:#7c3aed;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1118; --card:#151d27; --ink:#e8edf3; --mute:#8b97a6; --line:#243042;
    --acc:#3b82f6; --chip:#1c2633;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1118; --card:#151d27; --ink:#e8edf3; --mute:#8b97a6; --line:#243042;
  --acc:#3b82f6; --chip:#1c2633;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overflow-x:hidden}
header{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}
.brand{font-weight:800;font-size:19px;letter-spacing:.3px;flex:1;min-width:0}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--mute)}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(22,163,74,.6);animation:p 2s infinite}
.dot.off{background:var(--bad);animation:none}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(22,163,74,.55)}70%{box-shadow:0 0 0 8px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
.btn{border:0;background:var(--chip);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px}
.row{display:flex;gap:8px;margin-top:10px}
select{flex:1;min-width:0;appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:12px;padding:10px 34px 10px 12px;font:inherit;font-weight:600;
  background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.periodo{flex:0 0 auto;max-width:42%}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;border-radius:999px;padding:7px 12px;background:var(--chip);color:var(--ink);font:inherit;font-size:14px;font-weight:600}
.tab b{font-weight:700;margin-left:4px;color:var(--mute)}
.tab.on{background:var(--acc);color:var(--acc-ink)}
.tab.on b{color:var(--acc-ink);opacity:.85}
main{padding:12px 16px calc(env(safe-area-inset-bottom) + 24px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.online h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute)}
.pres{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.pres:first-of-type{border-top:0}
.pres .n{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pres .t{font-size:12px;color:var(--mute);white-space:nowrap}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;color:#fff;white-space:nowrap}
.day{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.6px;margin:16px 2px 8px}
.ev{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.ic{flex:0 0 38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:18px}
.bd{flex:1;min-width:0}
.l1{display:flex;gap:8px;align-items:baseline}
.ti{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hr{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;white-space:nowrap}
.l2{color:var(--mute);font-size:13px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l3{font-size:14px;margin-top:4px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.thumbs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:9px;background:var(--chip);flex:0 0 auto}
.empty,.err{text-align:center;color:var(--mute);padding:40px 10px}
.err{color:var(--bad)}
.more{display:block;width:100%;margin:6px 0 0;padding:12px}
/* hoja de detalle */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
.sheet.on{display:flex}
.panel{background:var(--card);width:100%;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:16px 16px calc(env(safe-area-inset-bottom) + 20px)}
.panel h2{margin:0 0 2px;font-size:19px}
.panel .sub{color:var(--mute);font-size:13px;margin-bottom:12px}
.kv{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.kv span:first-child{flex:0 0 38%;color:var(--mute);font-size:13px}
.kv span:last-child{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:12px}
.fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--chip)}
.close{float:right}
.lb{position:fixed;inset:0;z-index:30;background:#000;display:none;align-items:center;justify-content:center}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb .x{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:16px;background:rgba(255,255,255,.18);color:#fff}
.lb .dl{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 14px);left:50%;transform:translateX(-50%);background:rgba(255,255,255,.18);color:#fff;text-decoration:none}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">Osiris Monitor<small id="upd">Conectando…</small></div>
    <div class="live"><span class="dot" id="dot"></span><span id="liveTxt">En vivo</span></div>
    <button class="btn" id="refresh" aria-label="Actualizar">↻</button>
  </div>
  <div class="row">
    <select id="edif" aria-label="Edificio"><option>Cargando edificios…</option></select>
    <select id="periodo" class="periodo" aria-label="Periodo">
      <option value="hoy">Hoy</option>
      <option value="24">Últimas 24 h</option>
      <option value="ayer">Ayer</option>
      <option value="7">7 días</option>
      <option value="30">30 días</option>
    </select>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<main>
  <div class="card online" id="online" hidden></div>
  <div id="list"></div>
</main>

<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div class="lb" id="lb"><button class="btn x" id="lbx">Cerrar</button><img id="lbimg" alt=""><a class="btn dl" id="lbdl" target="_blank" rel="noopener">Abrir original</a></div>

<script>
const SB_URL = 'https://idwsbukgtogiwvfrurlc.supabase.co';
const SB_KEY = 'sb_publishable_-uuIV9H6rYYWjhyGNNtQww_0oww_OyF';
const REFRESCO_MS = 30000;
const PAGINA = 150;

/* Secciones del monitor */
const SECCIONES = [
  {k:'todo',     t:'Todo',        tipos:null},
  {k:'ingresos', t:'Ingresos',    tipos:['Ingreso de turno','Doblar turno']},
  {k:'salidas',  t:'Salidas',     tipos:['Salida de turno']},
  {k:'rondas',   t:'Rondas',      tipos:['Ronda']},
  {k:'noved',    t:'Novedades',   tipos:['Incidente','Advertencia','Guardia sin uniforme']},
  {k:'visitas',  t:'Visitas',     tipos:['Visita']},
  {k:'encom',    t:'Encomiendas', tipos:['Encomienda']},
  {k:'hosp',     t:'Hospedajes',  tipos:['Hospedaje']},
];
const OPERATIVOS = ['Ingreso de turno','Salida de turno','Doblar turno','Visita','Ronda','Incidente',
  'Encomienda','Hospedaje','Advertencia','Guardia sin uniforme'];
const ESTILO = {
  'Ingreso de turno':     {c:'var(--ok)',     i:'⏵', t:'Ingreso de turno'},
  'Doblar turno':         {c:'var(--violet)', i:'⇆', t:'Dobla turno'},
  'Salida de turno':      {c:'#64748b',       i:'⏹', t:'Salida de turno'},
  'Ronda':                {c:'var(--info)',   i:'⌖', t:'Ronda'},
  'Incidente':            {c:'var(--bad)',    i:'!', t:'Incidente'},
  'Advertencia':          {c:'var(--warn)',   i:'⚠', t:'Advertencia'},
  'Guardia sin uniforme': {c:'var(--warn)',   i:'⚠', t:'Guardia sin uniforme'},
  'Visita':               {c:'var(--acc)',    i:'☺', t:'Visita'},
  'Encomienda':           {c:'#a16207',       i:'▣', t:'Encomienda'},
  'Hospedaje':            {c:'#0d9488',       i:'⌂', t:'Hospedaje'},
};
/* Campos internos que no se muestran */
const OCULTOS = new Set(['uid','ts','guard_ci','guard_id','guard_uuid','turno_ref','device_id','foto_url','fotos_url',
  'foto','fotos','foto_local','fotos_local','building_id','unit_id','id','edificio','guardia','eliminado','version','app']);
const ETIQUETAS = {
  bloque:'Bloque', torre:'Torre', observaciones:'Observaciones', ubicacion:'Ubicación', nivel:'Nivel',
  nombre:'Nombre', depto:'Depto.', departamento:'Departamento', tipo:'Tipo', motivo:'Motivo', ci:'CI',
  placa:'Placa', vehiculo:'Vehículo', empresa:'Empresa', destinatario:'Destinatario', remitente:'Remitente',
  descripcion:'Descripción', punto:'Punto', relevos:'Relevo de', turno:'Turno', personas:'Personas',
  desde:'Desde', hasta:'Hasta', noches:'Noches', estado:'Estado', recibe:'Recibe', entregado:'Entregado',
  telefono:'Teléfono', autoriza:'Autoriza', salida:'Salida', ingreso:'Ingreso', lat:'Latitud', lng:'Longitud',
};
/* Orden de preferencia para la línea de resumen */
const RESUMEN = ['observaciones','descripcion','motivo','nombre','destinatario','ubicacion','punto','depto','placa','nivel'];

const $ = s => document.querySelector(s);
const st = {edif:null, sec:'todo', periodo:'hoy', datos:[], conteos:{}, hayMas:false, timer:null, cargando:false};

function guardar(k,v){ try{ localStorage.setItem('osiris_'+k, v); }catch(e){} }
function leer(k){ try{ return localStorage.getItem('osiris_'+k); }catch(e){ return null; } }

async function api(path){
  const r = await fetch(SB_URL + '/rest/v1/' + path, {headers:{apikey:SB_KEY, Accept:'application/json'}, cache:'no-store'});
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
const enc = encodeURIComponent;
const inList = arr => 'in.(' + arr.map(t => '"' + t.replace(/"/g,'\\"') + '"').join(',') + ')';

function detalleDe(e){
  let d = e.detalle;
  if(typeof d === 'string'){ try{ d = JSON.parse(d); }catch(_){ d = {texto:d}; } }
  return d && typeof d === 'object' ? d : {};
}
function horaReal(e){
  const d = detalleDe(e);
  const s = d.ts || e.created_at;
  let t = new Date(s);
  if(isNaN(t)) t = new Date(e.created_at);
  return t;
}
function rango(){
  const ahora = new Date();
  const ini = new Date(ahora); ini.setHours(0,0,0,0);
  switch(st.periodo){
    case 'hoy': return {desde:ini, hasta:null};
    case '24':  return {desde:new Date(ahora - 864e5), hasta:null};
    case 'ayer':{ const a = new Date(ini - 864e5); return {desde:a, hasta:ini}; }
    case '7':   return {desde:new Date(ini - 6*864e5), hasta:null};
    case '30':  return {desde:new Date(ini - 29*864e5), hasta:null};
  }
  return {desde:ini, hasta:null};
}
function filtrosBase(){
  const r = rango();
  /* margen de 12 h en created_at: eventos sin conexión suben tarde; se filtra luego por hora real */
  let f = 'edificio=eq.' + enc(st.edif) + '&created_at=gte.' + enc(new Date(r.desde - 0).toISOString());
  if(r.hasta) f += '&created_at=lt.' + enc(new Date(+r.hasta + 12*36e5).toISOString());
  return f;
}
function enRango(e){
  const r = rango(), t = horaReal(e);
  return t >= r.desde && (!r.hasta || t < r.hasta);
}

async function cargarEdificios(){
  const rows = await api('eventos?select=edificio&order=created_at.desc&limit=2000');
  const set = [...new Set(rows.map(r => (r.edificio||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
  const sel = $('#edif');
  sel.innerHTML = set.map(e => `<option value="${esc(e)}">${esc(e)}</option>`).join('') || '<option value="">Sin edificios</option>';
  const pedido = new URLSearchParams(location.search).get('e');
  const previo = leer('edif');
  st.edif = (pedido && set.find(x => x.toLowerCase() === pedido.toLowerCase())) || (previo && set.includes(previo) && previo) || set[0] || null;
  if(st.edif) sel.value = st.edif;
}

async function cargarConteos(){
  const rows = await api('eventos?select=tipo,detalle->>ts,created_at&' + filtrosBase() + '&tipo=' + enc(inList(OPERATIVOS)) + '&limit=5000');
  const r = rango();
  const c = {}; let total = 0;
  for(const x of rows){
    const t = new Date(x.ts || x.created_at);
    if(!(t >= r.desde && (!r.hasta || t < r.hasta))) continue;
    c[x.tipo] = (c[x.tipo]||0) + 1; total++;
  }
  st.conteos = {todo: total};
  for(const s of SECCIONES) if(s.tipos) st.conteos[s.k] = s.tipos.reduce((a,t)=>a+(c[t]||0),0);
}

async function cargarEventos(limite){
  const sec = SECCIONES.find(s => s.k === st.sec);
  const tipos = sec.tipos || OPERATIVOS;
  const rows = await api('eventos?select=id,created_at,tipo,edificio,guardia,detalle&' + filtrosBase()
    + '&tipo=' + enc(inList(tipos)) + '&order=created_at.desc&limit=' + limite);
  st.hayMas = rows.length >= limite;
  st.datos = rows.filter(enRango).sort((a,b) => horaReal(b) - horaReal(a));
}

async function cargarPresencia(){
  try{
    const rows = await api('presencia?select=guardia,edificio,en_turno,last_seen&edificio=eq.' + enc(st.edif) + '&order=last_seen.desc&limit=30');
    pintarPresencia(rows);
  }catch(e){ $('#online').hidden = true; }
}

let limite = PAGINA;
async function refrescar(manual){
  if(!st.edif || st.cargando) return;
  st.cargando = true;
  if(manual) $('#refresh').textContent = '…';
  try{
    await Promise.all([cargarEventos(limite), cargarConteos(), cargarPresencia()]);
    pintarTabs(); pintarLista();
    $('#dot').classList.remove('off'); $('#liveTxt').textContent = 'En vivo';
    $('#upd').textContent = st.edif + ' · actualizado ' + new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }catch(e){
    $('#dot').classList.add('off'); $('#liveTxt').textContent = 'Sin conexión';
    if(!st.datos.length) $('#list').innerHTML = `<div class="err">No se pudo leer la nube (${esc(e.message)}).<br>Revisa tu conexión y toca ↻</div>`;
  }finally{
    st.cargando = false; $('#refresh').textContent = '↻';
  }
}

/* ---------- Pintado ---------- */
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hm(t){ return t.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',hour12:false}); }
function diaTxt(t){
  const h = new Date(); h.setHours(0,0,0,0);
  const d = new Date(t); d.setHours(0,0,0,0);
  const dif = Math.round((h - d)/864e5);
  if(dif === 0) return 'Hoy';
  if(dif === 1) return 'Ayer';
  return t.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
}
function hace(t){
  const s = Math.max(0, (Date.now() - t)/1000);
  if(s < 60) return 'ahora';
  if(s < 3600) return 'hace ' + Math.floor(s/60) + ' min';
  if(s < 86400) return 'hace ' + Math.floor(s/3600) + ' h';
  return 'hace ' + Math.floor(s/86400) + ' d';
}
function fotosDe(d){
  const out = [];
  const add = v => { if(typeof v === 'string' && /^https?:\/\//.test(v)) out.push(v); };
  add(d.foto_url);
  if(Array.isArray(d.fotos_url)) d.fotos_url.forEach(add);
  else if(typeof d.fotos_url === 'string') d.fotos_url.split(/[,\s]+/).forEach(add);
  return [...new Set(out)];
}
function valorTxt(v){
  if(v === null || v === undefined || v === '') return '';
  if(typeof v === 'boolean') return v ? 'Sí' : 'No';
  if(Array.isArray(v)) return v.map(valorTxt).filter(Boolean).join(', ');
  if(typeof v === 'object') return Object.entries(v).map(([k,x]) => (ETIQUETAS[k]||k) + ': ' + valorTxt(x)).join(' · ');
  if(typeof v === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(v)){ const t = new Date(v); if(!isNaN(t)) return t.toLocaleString('es',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }
  return String(v);
}
function camposVisibles(d){
  return Object.entries(d).filter(([k,v]) => !OCULTOS.has(k) && !k.startsWith('_') && valorTxt(v) !== '');
}
function resumen(e, d){
  for(const k of RESUMEN) if(d[k] && !OCULTOS.has(k)) return valorTxt(d[k]);
  const c = camposVisibles(d).filter(([k]) => !['bloque','torre','relevos','nivel'].includes(k));
  return c.length ? c.slice(0,2).map(([k,v]) => (ETIQUETAS[k]||k) + ': ' + valorTxt(v)).join(' · ') : '';
}
function subtitulo(e, d){
  const p = [];
  if(e.guardia) p.push(e.guardia);
  const b = d.bloque || d.torre; if(b) p.push(valorTxt(b));
  if(e.tipo === 'Ingreso de turno' && d.relevos) p.push('releva a ' + valorTxt(d.relevos));
  if(d.nivel) p.push('Nivel ' + valorTxt(d.nivel));
  return p.join(' · ');
}

function pintarTabs(){
  $('#tabs').innerHTML = SECCIONES.map(s =>
    `<button class="tab${s.k===st.sec?' on':''}" data-k="${s.k}">${s.t}<b>${st.conteos[s.k] ?? ''}</b></button>`).join('');
}
function pintarPresencia(rows){
  const box = $('#online');
  const vivos = rows.filter(r => r.en_turno !== false && r.last_seen && (Date.now() - new Date(r.last_seen)) < 15*60e3);
  if(!rows.length){ box.hidden = true; return; }
  box.hidden = false;
  const lista = (vivos.length ? vivos : rows.slice(0,3)).map(r => {
    const t = new Date(r.last_seen), on = vivos.includes(r);
    return `<div class="pres"><span class="badge" style="background:${on?'var(--ok)':'#94a3b8'}">${on?'EN LÍNEA':'SIN SEÑAL'}</span>
      <span class="n">${esc(r.guardia || 'Celular sin guardia')}</span><span class="t">${r.last_seen ? hace(t) : ''}</span></div>`;
  }).join('');
  box.innerHTML = `<h3>${vivos.length ? 'Guardias en línea ahora' : 'Última señal de los celulares'}</h3>${lista}`;
}
function pintarLista(){
  const L = $('#list');
  if(!st.datos.length){
    const s = SECCIONES.find(x => x.k === st.sec);
    L.innerHTML = `<div class="empty">Sin ${s.k==='todo' ? 'movimientos' : s.t.toLowerCase()} en este periodo.</div>`;
    return;
  }
  let html = '', dia = '';
  st.datos.forEach((e, i) => {
    const t = horaReal(e), d = detalleDe(e);
    const dd = diaTxt(t);
    if(dd !== dia){ dia = dd; html += `<div class="day">${esc(dd)}</div>`; }
    const es = ESTILO[e.tipo] || {c:'#64748b', i:'•', t:e.tipo};
    const fotos = fotosDe(d);
    const r = resumen(e, d);
    html += `<div class="card ev" data-i="${i}">
      <div class="ic" style="background:${es.c}">${es.i}</div>
      <div class="bd">
        <div class="l1"><span class="ti">${esc(es.t)}</span><span class="hr">${hm(t)}</span></div>
        <div class="l2">${esc(subtitulo(e, d)) || '&nbsp;'}</div>
        ${r ? `<div class="l3">${esc(r)}</div>` : ''}
        ${fotos.length ? `<div class="thumbs">${fotos.slice(0,4).map(u => `<img loading="lazy" src="${esc(u)}" alt="">`).join('')}${fotos.length>4?`<span class="badge" style="background:#64748b;align-self:center">+${fotos.length-4}</span>`:''}</div>` : ''}
      </div></div>`;
  });
  if(st.hayMas) html += `<button class="btn more" id="mas">Ver más movimientos</button>`;
  L.innerHTML = html;
}

function abrirDetalle(e){
  const d = detalleDe(e), t = horaReal(e), es = ESTILO[e.tipo] || {t:e.tipo};
  const filas = [['Guardia', e.guardia], ['Hora', t.toLocaleString('es',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})]];
  if(d.ts && Math.abs(new Date(e.created_at) - t) > 5*60e3)
    filas.push(['Subido a la nube', new Date(e.created_at).toLocaleString('es',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:false})]);
  for(const [k,v] of camposVisibles(d)) filas.push([ETIQUETAS[k] || (k.charAt(0).toUpperCase() + k.slice(1).replace(/_/g,' ')), valorTxt(v)]);
  const g = (d.ubicacion && typeof d.ubicacion === 'object') ? d.ubicacion : d;
  if(g.lat && g.lng) filas.push(['Mapa', `<a href="https://maps.apple.com/?q=${enc(g.lat+','+g.lng)}" target="_blank" rel="noopener">Ver ubicación</a>`]);
  const fotos = fotosDe(d);
  $('#panel').innerHTML = `<button class="btn close" id="cerrar">Cerrar</button>
    <h2>${esc(es.t)}</h2><div class="sub">${esc(e.edificio)}</div>
    ${filas.filter(f => f[1]).map(([k,v]) => `<div class="kv"><span>${esc(k)}</span><span>${k==='Mapa' ? v : esc(v)}</span></div>`).join('')}
    ${fotos.length ? `<div class="fotos">${fotos.map(u => `<img loading="lazy" src="${esc(u)}" data-src="${esc(u)}" alt="Foto">`).join('')}</div>` : ''}`;
  $('#sheet').classList.add('on');
}
function verFoto(u){ $('#lbimg').src = u; $('#lbdl').href = u; $('#lb').classList.add('on'); }

/* ---------- Eventos de interfaz ---------- */
$('#tabs').addEventListener('click', ev => {
  const b = ev.target.closest('.tab'); if(!b) return;
  st.sec = b.dataset.k; limite = PAGINA; st.datos = []; pintarTabs();
  $('#list').innerHTML = '<div class="empty">Cargando…</div>';
  refrescar(); scrollTo({top:0});
});
$('#edif').addEventListener('change', e => {
  st.edif = e.target.value; guardar('edif', st.edif); limite = PAGINA; st.datos = [];
  const u = new URL(location.href); u.searchParams.set('e', st.edif); history.replaceState(null, '', u);
  $('#list').innerHTML = '<div class="empty">Cargando…</div>'; refrescar();
});
$('#periodo').addEventListener('change', e => {
  st.periodo = e.target.value; guardar('periodo', st.periodo); limite = PAGINA; st.datos = [];
  $('#list').innerHTML = '<div class="empty">Cargando…</div>'; refrescar();
});
$('#refresh').addEventListener('click', () => refrescar(true));
$('#list').addEventListener('click', ev => {
  if(ev.target.id === 'mas'){ limite += PAGINA; refrescar(true); return; }
  if(ev.target.tagName === 'IMG'){ ev.stopPropagation(); verFoto(ev.target.src); return; }
  const c = ev.target.closest('.ev'); if(c) abrirDetalle(st.datos[+c.dataset.i]);
});
$('#sheet').addEventListener('click', ev => {
  if(ev.target.id === 'sheet' || ev.target.id === 'cerrar') $('#sheet').classList.remove('on');
  else if(ev.target.dataset.src) verFoto(ev.target.dataset.src);
});
$('#lb').addEventListener('click', ev => { if(ev.target.id !== 'lbdl') $('#lb').classList.remove('on'); });
document.addEventListener('visibilitychange', () => { if(!document.hidden) refrescar(); });

/* ---------- Arranque ---------- */
(async function(){
  const p = leer('periodo'); if(p && [...$('#periodo').options].some(o => o.value === p)){ st.periodo = p; $('#periodo').value = p; }
  pintarTabs();
  $('#list').innerHTML = '<div class="empty">Cargando movimientos…</div>';
  try{ await cargarEdificios(); }
  catch(e){
    $('#dot').classList.add('off'); $('#liveTxt').textContent = 'Sin conexión';
    $('#list').innerHTML = `<div class="err">No se pudo conectar con la nube (${esc(e.message)}).<br>Toca ↻ para reintentar.</div>`;
    $('#refresh').onclick = () => location.reload();
    return;
  }
  await refrescar();
  st.timer = setInterval(() => { if(!document.hidden) refrescar(); }, REFRESCO_MS);
})();
</script>
</body>
</html>
