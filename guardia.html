<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- Barra de estado OPACA: en iPhone la página empieza DEBAJO de la hora y la batería,
     así nada queda bajo el difuminado de iOS (requiere volver a agregar el ícono) -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Osiris Guardia">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="osiris-icono-180.png">
<meta name="theme-color" content="#496d7f">
<title>Osiris Guardia</title>
<style>
:root{
  --bg:#f3f5f8; --card:#fff; --ink:#111827; --mute:#6b7280; --line:#e5e7eb; --chip:#eef2f7;
  --acc:#2563eb; --acc-ink:#fff; --marca:#496d7f; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#0891b2; --violet:#7c3aed;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0b1118; --card:#151d27; --ink:#e8edf3; --mute:#8b97a6; --line:#243042; --chip:#1c2633; --acc:#3b82f6; }
}
:root[data-theme="dark"]{ --bg:#0b1118; --card:#151d27; --ink:#e8edf3; --mute:#8b97a6; --line:#243042; --chip:#1c2633; --acc:#3b82f6; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overflow-x:hidden;overflow-x:clip}
[hidden]{display:none !important}
header{position:sticky;top:0;z-index:5;background:var(--marca);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 12px}

.top{display:flex;align-items:center;gap:10px}
.top img{height:30px;width:auto}
.tit{flex:1;min-width:0}
.tit b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tit small{display:block;font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:12px;background:rgba(255,255,255,.18);border-radius:999px;padding:4px 9px;white-space:nowrap}
.atras{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:10px;height:36px;width:36px;display:grid;place-items:center}
main{padding:14px 16px calc(env(safe-area-inset-bottom) + 30px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.turnoBox{display:flex;align-items:center;gap:12px}
.turnoBox .t{flex:1;min-width:0}
.turnoBox b{display:block;font-size:16px}
.turnoBox span{color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:0;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:16px 12px;text-align:left;font:inherit;display:flex;flex-direction:column;gap:10px;min-height:104px}
.tile .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff}
.tile b{font-size:15px}
.tile small{color:var(--mute);font-size:12.5px;margin-top:-6px}
.h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);margin:16px 2px 8px;font-weight:700}
.field{display:block;margin:12px 0}
.field:first-child{margin-top:0}
.field > span{display:block;font-size:13px;color:var(--mute);margin-bottom:5px}
.inp,.field input,.field select,.field textarea{box-sizing:border-box;width:100%;display:block;min-height:46px;border:1px solid var(--line);background-color:var(--card);color:var(--ink);border-radius:12px;padding:0 12px;font:inherit;font-size:16px;margin:0}
.field textarea{padding:10px 12px;min-height:80px;resize:vertical}
.field select{appearance:none;-webkit-appearance:none;padding-right:34px;font-weight:600;
  background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.inp:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.btn{border:0;background:var(--chip);color:var(--ink);border-radius:12px;padding:0 14px;height:46px;font:inherit;font-size:15px;font-weight:600}
.prim{background:var(--acc);color:var(--acc-ink);width:100%;font-weight:700;height:50px;font-size:16px}
.ok{background:var(--ok);color:#fff}.bad{background:var(--bad);color:#fff}
.btn:disabled{opacity:.55}
.acts{display:flex;gap:8px;flex-wrap:wrap}.acts .btn{flex:1}
.seg{display:flex;gap:6px;background:var(--chip);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;height:38px;font:inherit;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fotos .f{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--chip)}
.fotos .f img{width:100%;height:100%;object-fit:cover;display:block}
.fotos .f button{position:absolute;top:4px;right:4px;border:0;border-radius:999px;width:26px;height:26px;background:rgba(0,0,0,.55);color:#fff;font-size:14px}
.fotos .add{border:2px dashed var(--line);background:none;border-radius:12px;aspect-ratio:1;color:var(--mute);font:inherit;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.foto1{display:flex;gap:10px;align-items:center}
.foto1 .f{width:84px;height:84px;flex:0 0 84px}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0}
.item b{display:block;overflow-wrap:anywhere}
.item span{display:block;color:var(--mute);font-size:13px;overflow-wrap:anywhere}
.item .btn{height:40px;flex:0 0 auto}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;color:#fff;background:var(--mute)}
.msg{padding:10px 12px;border-radius:10px;background:var(--chip);font-size:14px;margin:10px 0}
.msg.bad{background:rgba(220,38,38,.12);color:var(--bad)} .msg.ok{background:rgba(22,163,74,.12);color:var(--ok)}
.empty{text-align:center;color:var(--mute);padding:28px 10px}
.chk{display:flex;align-items:center;gap:10px;font-weight:600;margin:10px 0}
.chk input{width:22px;height:22px;accent-color:var(--acc)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:50;background:#111827;color:#fff;border-radius:14px;padding:13px 16px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:opacity .3s}
.lock{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px;text-align:center}
.lock .card{max-width:380px;width:100%}
a{color:var(--acc)}
/* fotos: botón grande y miniaturas */
.zf .fotos{margin-bottom:8px}
.zf .fotos:empty{display:none}
.camBtn{width:100%;min-height:92px;border:2px dashed #b8c4cf;border-radius:16px;background:var(--chip);color:var(--ink);font:inherit;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px}
.camBtn svg{color:var(--marca)}
.camBtn small{font-weight:500;color:var(--mute);font-size:12.5px}
.ocrst{font-size:13px;color:var(--mute);margin-top:6px}
.ocrst.ok{color:var(--ok)}
.firma{position:relative;height:180px;background:#fff;border:1px solid rgba(0,0,0,.2);border-radius:12px;overflow:hidden;touch-action:none}.firma canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.firma i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(0,0,0,.35);font-style:normal;pointer-events:none}.firma.con i{display:none}
/* cámara dentro de la página: fotos seguidas sin salir */
body.trabado{overflow:hidden;position:fixed;left:0;right:0}
#cam{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
#camV{flex:1;width:100%;min-height:0;object-fit:cover;background:#000}
#cam.selfie #camV{transform:scaleX(-1)}
.camTop{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px;color:#fff;background:linear-gradient(rgba(0,0,0,.55),transparent)}
.camTop b{flex:1;font-size:18px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.camTop .n{font-weight:800;font-size:18px;background:rgba(255,255,255,.18);border-radius:999px;padding:4px 12px}
.camBot{position:absolute;left:0;right:0;bottom:0;padding:12px 18px calc(env(safe-area-inset-bottom) + 22px);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.camBot .lado{width:90px;display:flex;justify-content:center}
.camBot button.txt{border:0;background:rgba(255,255,255,.2);color:#fff;font:inherit;font-weight:700;border-radius:12px;height:44px;padding:0 14px}
#camDisp{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.25);padding:0}
#camDisp:active{background:#fff}
#camTh{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 118px);display:flex;gap:6px;overflow-x:auto}
#camTh img{width:52px;height:52px;object-fit:cover;border-radius:8px;border:2px solid #fff;flex:0 0 auto}
#camGuia{position:absolute;left:6%;right:6%;top:46%;transform:translateY(-50%);aspect-ratio:1.586;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.5);pointer-events:none}
#camGuia span{position:absolute;left:0;right:0;top:calc(100% + 14px);text-align:center;color:#fff;font-weight:700;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.qchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.qchips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;height:40px;padding:0 16px;font:inherit;font-weight:700}
.qchips button.on{background:var(--ok);border-color:var(--ok);color:#fff}
.qchips button.on.otro{background:var(--violet);border-color:var(--violet)}
.cto{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;margin-top:8px}
.cto .t{flex:1;min-width:0}.cto b{display:block}.cto span{display:block;font-size:13px;color:var(--mute)}
.cto i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:0 0 22px}
.cto.on{border-color:var(--ok);background:rgba(22,163,74,.08)}.cto.on i{border:7px solid var(--ok)}
.ocrst details{margin-top:4px}.ocrst pre{white-space:pre-wrap;font-size:11px;background:var(--chip);padding:8px;border-radius:8px;max-height:200px;overflow:auto}
#camFlash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
/* iPhone: con letra menor a 16 px, Safari hace zoom al tocar un campo */
input,select,textarea{font-size:max(16px,1em)}
/* iPhone: iOS difumina y bloquea una franja bajo la barra de estado (más alta
   que la zona segura). Todo lo tocable va debajo y una franja opaca tapa esa zona.
   Se calcula con la zona segura: en una pantalla sin barra (computadora) es 0. */
body::before{content:'';position:fixed;top:0;left:0;right:0;height:calc(env(safe-area-inset-top) * 1.7);background:var(--marca);z-index:9;pointer-events:none}
header{padding-top:calc(env(safe-area-inset-top) * 1.7 + 10px)}
.camTop{padding-top:calc(env(safe-area-inset-top) * 1.7 + 12px)}
/* flecha del gesto "deslizar desde el borde para volver" (app en la pantalla de inicio) */
.volverG{position:fixed;left:0;top:50%;z-index:70;width:44px;height:44px;margin-top:-22px;border-radius:50%;background:#fff;color:#111827;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.3);opacity:0;pointer-events:none;transform:translateX(-50px)}
.volverG.listo{background:var(--marca);color:#fff}
</style>
</head>
<body>
<header>
  <div class="top">
    <button class="atras" id="atras" hidden aria-label="Volver"></button>
    <img id="logo" alt="Osiris">
    <div class="tit"><b id="titulo">Osiris Guardia</b><small id="subt">Conectando…</small></div>
    <span class="sync" id="sync" hidden></span>
  </div>
</header>
<main id="main"></main>
<input type="file" id="camara" accept="image/*" capture="environment" hidden>
<input type="file" id="camaraF" accept="image/*" capture="user" hidden>
<div id="cam" hidden>
  <video id="camV" playsinline autoplay muted></video>
  <div id="camGuia" hidden><span id="camGuiaT"></span></div>
  <div id="camFlash"></div>
  <div class="camTop"><b id="camT">Foto</b><span class="n" id="camN"></span></div>
  <div id="camTh"></div>
  <div class="camBot"><div class="lado"><button class="txt" id="camX">Cerrar</button></div><button id="camDisp" aria-label="Tomar foto"></button><div class="lado"><button class="txt" id="camOk" hidden>Listo</button></div></div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="lock" id="lock" hidden><div class="card" id="lockBox"></div></div>

const CALIDAD = {doc: [1600, 0.8], tarjeta: [1200, 0.78], evidencia: [1280, 0.74], registro: [720, 0.7]};
async function registrar(tipo, detalle, {fotos = [], campoFotos = 'foto_url', guardia, rutas, cals = [], etis = []} = {}){
  if(fotos.length){
    fotos = await Promise.all(fotos.map(async (f, i) => { const c = CALIDAD[cals[i] || 'evidencia']; try{ return await reducir(f, c[0], c[1]); }catch(_){ return f; } }));
    if(etis.length) detalle = {...detalle, fotos_tipo: etis.slice(0, fotos.length)};
  }
  const uid = 'web_' + G.devId + '_' + Date.now() + '_' + azar(4);
  const det = {...detalle, uid, ts: detalle.ts || new Date().toISOString()};
  if(!['Guardia','GuardiaBaja','Config'].includes(tipo)){
    if(G.turno && G.turno.ci && !det.guard_ci) det.guard_ci = G.turno.ci;
    if(G.link.bloque) det.bloque = G.link.bloque;
    det.link = G.token;
  }
  const item = {tipo, edificio:G.ed, guardia: guardia || (G.turno ? G.turno.nombre : 'Sin turno'), detalle:det, fotos, urls:[], campoFotos, intentos:0, ...(rutas ? {rutas} : {})};
  if(DBQ) await tx('readwrite', s => s.add(item)); else MEM.push(item);
  procesarCola();
  return uid;
}
let procesando = false;
async function procesarCola(){
  if(procesando) return; procesando = true;
  try{
    for(;;){
      const items = await colaTodos(); if(!items.length) break;
      const it = items[0];
      try{
        if(it.intentos > 0){
          const ya = await api('eventos?select=id&detalle->>uid=eq.' + enc(it.detalle.uid) + '&limit=1');
          if(ya.length){ await quitar(it); continue; }
        }
        it.intentos++;
        while(it.urls.length < it.fotos.length){
          const i = it.urls.length;
          const ruta = (it.rutas && it.rutas[i]) || (edSeguro() + '/' + Date.now() + '_' + G.devId + '_' + i + '.jpg');
          const r = await fetch(SB_URL + '/storage/v1/object/osiris/' + ruta, {method:'POST', headers:{apikey:SB_KEY, 'Content-Type':'image/jpeg', 'x-upsert':'true'}, body: it.fotos[i]});
          if(!r.ok) throw Object.assign(new Error('foto ' + r.status), {status: r.status});
          it.urls.push(SB_URL + '/storage/v1/object/public/osiris/' + ruta);
          await guardarItem(it);
        }
        const det = {...it.detalle};
        if(it.urls.length){
          if(it.campoFotos === 'fotos_url') det.fotos_url = it.urls;
          else { det.foto_url = it.urls[0]; if(it.urls.length > 1) det.fotos_url = it.urls; }
        }
        await apiEscribir('POST', 'eventos', {tipo: it.tipo, edificio: it.edificio, guardia: it.guardia, device_id: 'web_' + G.devId, detalle: det});
        await quitar(it);
      }catch(e){
        const s = e.status || 0;
        /* rechazo definitivo SOLO si el dato es inválido. 402 (nube suspendida por cuota), 401/403, 408, 429 y 5xx: se guarda y se reintenta */
        if([400, 413, 415, 422].includes(s)){ await quitar(it); continue; }
        if(s === 409){ await quitar(it); continue; }
        await guardarItem(it);
        break; // sin señal: se reintenta luego
      }
    }
  } finally { procesando = false; pintarSync(); }
}
/* Lo registrado en este celular que todavía está subiendo cuenta igual (ej. una visita recién ingresada) */
async function pendientesComoEventos(tipos){
  return (await colaTodos()).filter(it => tipos.includes(it.tipo)).map(it => ({tipo: it.tipo, guardia: it.guardia, created_at: it.detalle.ts, detalle: it.detalle}));
}
async function guardarItem(it){ if(DBQ) await tx('readwrite', s => s.put(it)); }
async function quitar(it){ if(DBQ) await tx('readwrite', s => s.delete(it.id)); else MEM.splice(MEM.indexOf(it), 1); }
async function pintarSync(){
  const n = (await colaTodos()).length, el = $('#sync');
  el.hidden = !n; el.textContent = n + ' por subir';
}
setInterval(procesarCola, 30000);
addEventListener('online', procesarCola);
document.addEventListener('visibilitychange', () => { if(!document.hidden) procesarCola(); });

/* ---------- Acceso: link de guardia amarrado a este iPhone ---------- */
function miDispositivo(){
  try{
    const k = 'osiris_dev_' + G.token; let id = localStorage.getItem(k);
    if(!id){ id = azar(16); localStorage.setItem(k, id); if(localStorage.getItem(k) !== id) return null; }
    return id;
  }catch(_){ return null; }
}
function nombreEquipo(){
  const u = navigator.userAgent || '';
  const so = /iPhone/.test(u) ? 'iPhone' : /iPad/.test(u) ? 'iPad' : /Android/.test(u) ? 'Android' : /Windows/.test(u) ? 'Computadora Windows' : /Mac/.test(u) ? 'Mac' : 'Equipo';
  const nav = /CriOS|Chrome/.test(u) ? 'Chrome' : /FxiOS|Firefox/.test(u) ? 'Firefox' : /Safari/.test(u) ? 'Safari' : 'navegador';
  let app = ''; try{ if(navigator.standalone || matchMedia('(display-mode: standalone)').matches) app = ' (ícono en inicio)'; }catch(_){}
  return so + ' · ' + nav + app + ' (guardia)';
}
async function dispositivos(){
  const r = await api('eventos?select=detalle,created_at&tipo=eq.Config&edificio=eq.' + MON + '&detalle->>clase=eq.linkdev&detalle->>token=eq.' + enc(G.token) + '&order=created_at.desc&limit=200');
  const m = new Map(); for(const x of r){ const d = detalleDe(x); if(d.dev && !m.has(d.dev)) m.set(d.dev, d); } return m;
}
async function estadoDev(estado){
  const uid = 'monitor_' + Date.now() + '_' + azar(6);
  await apiEscribir('POST', 'eventos', {tipo:'Config', edificio:MON, guardia:'Link', device_id:'monitor-web', detalle:{clase:'linkdev', token:G.token, dev:G.dev, estado, equipo:nombreEquipo(), uid, ts:new Date().toISOString()}});
}
async function acceso(){
  G.token = new URLSearchParams(location.search).get('g');
  if(!G.token){ bloqueo('<h2>Falta el link</h2><p style="color:var(--mute)">Abre el link de guardia que te envió supervisión.</p>'); return false; }
  let r;
  try{ r = await api('eventos?select=detalle&tipo=eq.Config&edificio=eq.' + MON + '&detalle->>clase=eq.glink&detalle->>token=eq.' + enc(G.token) + '&order=created_at.desc&limit=1'); }
  catch(e){ bloqueo(`<h2>Sin conexión</h2><p style="color:var(--mute)">Revisa el internet.</p><button class="btn prim" onclick="location.reload()">Reintentar</button>`); return false; }
  if(!r.length){ bloqueo('<h2>Link desactivado</h2><p style="color:var(--mute)">Pide un link nuevo a supervisión.</p>'); return false; }
  G.link = detalleDe(r[0]); G.ed = G.link.edificio;
  G.dev = miDispositivo();
  if(!G.dev){ bloqueo('<h2>Abre el link en Safari normal</h2><p style="color:var(--mute)">En modo privado no se puede recordar este celular.</p>'); return false; }
  G.devId = G.dev.slice(0, 8);
  const devs = await dispositivos().catch(() => new Map());
  const yo = devs.get(G.dev);
  if(yo && yo.estado === 'ok') return true;
  if(!yo){
    const usados = [...devs.values()].filter(d => d.estado === 'ok').length;
    try{
      if(usados < Math.max(1, parseInt(G.link.cupos, 10) || 1)){ await estadoDev('ok'); return true; }
      await estadoDev('pendiente');
    }catch(_){ bloqueo('<h2>Sin conexión</h2><button class="btn prim" onclick="location.reload()">Reintentar</button>'); return false; }
  }
  bloqueo(`<h2>Esperando autorización</h2><p style="color:var(--mute)">Este link ya se usa en otro celular. Pide a supervisión que autorice este <b>${esc(nombreEquipo())}</b>. Se abre solo cuando lo haga.</p>`);
  setInterval(async () => { try{ const d = (await dispositivos()).get(G.dev); if(d && d.estado === 'ok') location.reload(); }catch(_){} }, 10000);
  return false;
}

/* ---------- Datos del edificio ---------- */
async function cargarEdificio(){
  const [cfg, gs] = await Promise.all([
    api('eventos?select=detalle&tipo=eq.Config&edificio=eq.' + enc(G.ed) + '&order=created_at.desc&limit=1'),
    api('eventos?select=*&edificio=eq.' + enc(G.ed) + '&tipo=in.(Guardia,GuardiaBaja)&order=created_at.desc&limit=1000'),
  ]);
  let m = cfg.length ? detalleDe(cfg[0]).modulos : null;
  if(typeof m === 'string'){ try{ m = JSON.parse(m); }catch(_){ m = null; } }
  G.mod = (m && typeof m === 'object') ? m : {visitas:true, visitas_recu:true, rondas:true, incidentes:true, encomiendas:true, propietarios:true, vehiculos:true, normativas:true};
  G.torres = Array.isArray(G.mod.torres) ? G.mod.torres : [];
  const t = parseInt(G.mod.tolerancia_min, 10); G.tol = t >= 0 && t <= 60 ? t : 15;
  /* guardias activos: el último alta/baja de cada CI manda */
  const ult = new Map();
  for(const e of gs){ const d = detalleDe(e); const ci = String(d.ci || '').trim().replace(/\s+/g, '').toUpperCase(); if(!ci) continue; const p = ult.get(ci); const tt = horaReal(e); if(!p || tt > p.t) ult.set(ci, {t: tt, e, d}); }
  const altas = gs.filter(e => e.tipo === 'Guardia');
  G.registro = [...ult.entries()].filter(([, x]) => x.e.tipo === 'Guardia').map(([ci, x]) => ({ci, nombre: String(x.d.nombre || x.e.guardia || '').trim(), turno: String(x.d.turno || 'DIURNO'), bloque: String(x.d.bloque || '')}))
    .filter(g => !G.link.bloque || !g.bloque || g.bloque === G.link.bloque || g.turno === 'FRANQUERO')
    .sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
  void altas;
}
/* Si este navegador perdió el turno (otra pestaña, Safari vs. pantalla de inicio,
   datos borrados), se recupera de la nube: el último ingreso de este link sin salida. */
async function recuperarTurno(){
  if(G.turno) return;
  try{
    const desde = new Date(Date.now() - 48 * 3600e3).toISOString();
    const r = [...await api('eventos?select=created_at,tipo,guardia,device_id,detalle&edificio=eq.' + enc(G.ed) + '&created_at=gte.' + enc(desde)
      + '&tipo=' + enc(inList(['Ingreso de turno', 'Salida de turno', 'Doblar turno'])) + '&order=created_at.asc&limit=500'),
      ...await pendientesComoEventos(['Ingreso de turno', 'Salida de turno', 'Doblar turno'])];
    const mio = e => { const d = detalleDe(e); return d.link === G.token || e.device_id === 'web_' + G.devId; };
    const salidas = new Set(r.filter(e => e.tipo === 'Salida de turno').map(e => String(detalleDe(e).turno_ref || '')));
    const niveles = new Map(r.filter(e => e.tipo === 'Doblar turno').map(e => [String(detalleDe(e).turno_ref || ''), +detalleDe(e).nivel || 12]));
    const abiertos = r.filter(e => e.tipo === 'Ingreso de turno' && mio(e) && detalleDe(e).turno_ref && !salidas.has(String(detalleDe(e).turno_ref)));
    const u = abiertos.sort((a, b) => horaReal(b) - horaReal(a))[0]; if(!u) return;
    const d = detalleDe(u), ref = String(d.turno_ref), nivel = niveles.get(ref) || 12;
    if(Date.now() - horaReal(u) > (nivel + 6) * 3600e3) return; // turno ya vencido: no se revive
    G.turno = {ci: String(d.guard_ci || ''), nombre: u.guardia || 'Guardia', ref, inicio: horaReal(u).toISOString(), nivel};
    guardarTurno();
  }catch(_){}
}
const cacheDatos = {};
async function datos(clase){
  if(cacheDatos[clase] && Date.now() - cacheDatos[clase].t < 300000) return cacheDatos[clase].filas;
  const r = await api('eventos?select=detalle&tipo=eq.Datos&edificio=eq.' + enc(G.ed) + '&detalle->>clase=eq.' + clase + '&order=created_at.desc&limit=1');
  const filas = r.length && Array.isArray(detalleDe(r[0]).filas) ? detalleDe(r[0]).filas : [];
  cacheDatos[clase] = {t: Date.now(), filas}; return filas;
}

/* ---------- Navegación ---------- */
/* Cada pantalla deja una entrada en el historial: así el gesto de volver del
   iPhone (deslizar desde el borde) y el botón atrás de Android regresan a la
   pantalla anterior en vez de sacar al guardia de la app. */
let HIST = 0;
function ir(pantalla, ...args){
  G.pila.push([pantalla, args]); pintar(); scrollTo({top:0});
  try{ history.pushState({osiris: ++HIST}, ''); }catch(_){}
}
function quitarPantalla(){ G.pila.pop(); if(!G.pila.length) G.pila.push([inicio, []]); pintar(); scrollTo({top:0}); }
function volver(){
  if(typeof gpsParar === 'function') gpsParar();
  if(HIST > 0){ try{ history.back(); return; }catch(_){} }
  quitarPantalla();
}
let CAM_CERRAR = null; // cámara abierta: volver la cierra (no cambia de pantalla)
window.addEventListener('popstate', () => {
  if(CAM_CERRAR){ CAM_CERRAR(); try{ history.pushState({osiris: HIST}, ''); }catch(_){} return; }
  HIST = Math.max(0, HIST - 1);
  quitarPantalla();
});
function pintar(){
  const [fn, args] = G.pila[G.pila.length - 1];
  $('#atras').hidden = G.pila.length <= 1;
  fn(...args);
}
$('#atras').innerHTML = icono('atras', 22);
$('#atras').onclick = volver;
function cabecera(){
  $('#titulo').textContent = G.ed + (G.link.bloque ? ' · ' + G.link.bloque : '');
  $('#subt').textContent = G.turno ? 'De turno: ' + G.turno.nombre : 'Sin turno abierto';
}

/* ---------- Componente: fotos ---------- */
/* Cámara dentro de la página: se toman varias fotos seguidas sin salir (si el
   navegador no deja usarla, se usa la cámara del sistema de a una). */
/* Ronda: hora y ubicación de cada foto (la foto queda en el celular; a la nube va solo esto) */
const GPS = {ult:null, ruta:[], id:null, inicio:0};
function marcarFoto(b){ try{ b._t = Date.now(); b._gps = GPS.ult && Date.now() - GPS.ult.t < 120000 ? {...GPS.ult} : null; }catch(_){} }
function gpsIniciar(){
  gpsParar();
  GPS.ruta = []; GPS.ult = null; GPS.inicio = Date.now();
  if(!navigator.geolocation) return;
  try{
    GPS.id = navigator.geolocation.watchPosition(p => {
      const x = {lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), prec: Math.round(p.coords.accuracy || 0), t: Date.now()};
      GPS.ult = x; if(GPS.ruta.length < 3000) GPS.ruta.push(x);
    }, () => {}, {enableHighAccuracy: true, maximumAge: 5000, timeout: 20000});
  }catch(_){}
}
function gpsParar(){ try{ if(GPS.id !== null) navigator.geolocation.clearWatch(GPS.id); }catch(_){} GPS.id = null; }
function metros(a, b){ const R = 6371000, r = x => x * Math.PI / 180; const dLa = r(b.lat - a.lat), dLo = r(b.lng - a.lng);
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
function rutaCompacta(){
  const r = GPS.ruta, paso = Math.max(1, Math.ceil(r.length / 120)), out = [];
  for(let i = 0; i < r.length; i += paso) out.push([r[i].lat, r[i].lng, Math.round((r[i].t - GPS.inicio) / 1000)]);
  const u = r[r.length - 1]; if(u && (!out.length || out[out.length - 1][2] !== Math.round((u.t - GPS.inicio) / 1000))) out.push([u.lat, u.lng, Math.round((u.t - GPS.inicio) / 1000)]);
  return out;
}
function metrosRecorridos(){ let m = 0; for(let i = 1; i < GPS.ruta.length; i++){ const d = metros(GPS.ruta[i - 1], GPS.ruta[i]); if(d < 200) m += d; } return Math.round(m); }
async function camara({min = 1, max = 1, frontal = false, etiquetas = [], titulo = 'Foto', guia = ''} = {}){
  let stream = null;
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio: false,
      video: {facingMode: frontal ? 'user' : {ideal: 'environment'}, width: {ideal: 3840}, height: {ideal: 2160}}});
  }catch(_){ stream = null; }
  if(!stream){
    const out = [];
    while(out.length < max){
      const b = await tomarFoto(frontal); if(!b) break; marcarFoto(b); out.push(b);
      if(out.length >= max || (out.length >= min && !confirm('Foto ' + out.length + ' guardada. ¿Sacar otra?'))) break;
    }
    return out;
  }
  return new Promise(listo => {
    const fotos = [], cam = $('#cam'), video = $('#camV');
    cam.classList.toggle('selfie', frontal); cam.hidden = false; document.body.classList.add('trabado');
    $('#camGuia').hidden = !guia; $('#camGuiaT').textContent = guia ? 'Encuadra ' + (guia === 'tarjeta' ? 'la tarjeta' : 'el documento') + ' dentro del marco' : '';
    video.srcObject = stream; video.play().catch(() => {});
    const pintarC = () => {
      $('#camT').textContent = etiquetas[fotos.length] || titulo;
      $('#camN').textContent = max > 1 ? (fotos.length + (min > 1 ? ' / ' + min : '')) : '';
      $('#camOk').hidden = max === 1 || fotos.length < Math.max(1, min);
      $('#camTh').innerHTML = fotos.map(b => `<img src="${verBlob(b)}" alt="">`).join('');
    };
    const cerrar = () => { CAM_CERRAR = null; stream.getTracks().forEach(t => t.stop()); video.srcObject = null; cam.hidden = true; document.body.classList.remove('trabado'); listo(fotos); };
    CAM_CERRAR = cerrar;
    $('#camX').onclick = cerrar; $('#camOk').onclick = cerrar;
    $('#camDisp').onclick = async () => {
      const w = video.videoWidth, h = video.videoHeight; if(!w) return;
      const c = document.createElement('canvas');
      if(guia){
        /* solo lo que está dentro del marco (con un poco de margen): el lector lee mucho mejor */
        const vr = video.getBoundingClientRect(), gr = $('#camGuia').getBoundingClientRect();
        const s = Math.max(vr.width / w, vr.height / h), ox = (vr.width - w * s) / 2, oy = (vr.height - h * s) / 2;
        const mx = gr.width * 0.06, my = gr.height * 0.08;
        let sx = (gr.left - vr.left - mx - ox) / s, sy = (gr.top - vr.top - my - oy) / s, sw = (gr.width + 2 * mx) / s, sh = (gr.height + 2 * my) / s;
        sx = Math.max(0, sx); sy = Math.max(0, sy); sw = Math.min(w - sx, sw); sh = Math.min(h - sy, sh);
        const k = Math.min(1600, Math.max(1200, sw)) / sw;
        c.width = Math.round(sw * k); c.height = Math.round(sh * k);
        c.getContext('2d').drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);
      } else {
        const k = Math.min(1, 1920 / Math.max(w, h));
        c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
      }
      const f = $('#camFlash'); f.style.opacity = .8; setTimeout(() => f.style.opacity = 0, 120);
      const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.78));
      if(b){ marcarFoto(b); fotos.push(b); if(navigator.vibrate) navigator.vibrate(30); }
      if(fotos.length >= max) return cerrar();
      pintarC();
    };
    pintarC();
  });
}
function zonaFotos(id, {min = 0, max = 10, frontal = false, texto = 'Tomar foto', etiquetas = [], alCambiar, guia = ''} = {}){
  const z = {id, fotos: [], min, max, frontal};
  z.pintar = () => {
    const el = $('#' + id); if(!el) return;

    el.onclick = async ev => {
      const q = ev.target.closest('[data-q]'); if(q){ z.fotos.splice(+q.dataset.q, 1); z.pintar(); if(alCambiar) alCambiar(z); return; }

        if(nuevas.length){ z.fotos.push(...nuevas); z.pintar(); if(alCambiar) alCambiar(z); }
      }

}

/* ---------- Turno ---------- */
function relevoCercano(t, hs){
  let mejor = null;
  for(const h of hs){ const m = /^(\d{1,2}):(\d{2})$/.exec(h); if(!m) continue;
    for(let d = -1; d <= 1; d++){ const c = new Date(t.getFullYear(), t.getMonth(), t.getDate() + d, +m[1], +m[2]); const dif = Math.abs(t - c) / 60000;
      if(dif <= 360 && (!mejor || dif < Math.abs(t - mejor) / 60000)) mejor = c; } }
  return mejor;
}

/* Panel de firma: trazos como texto "x,y x,y|..." (0-1000), igual que la app; pesa pocos KB */
function firmaPad(cv){
  const trazos = []; let W = 0, H = 0;
  const ajustar = () => { const r = cv.getBoundingClientRect(), k = window.devicePixelRatio || 1; W = r.width; H = r.height; cv.width = W * k; cv.height = H * k; dibujar(); };
  function dibujar(){
    const x = cv.getContext('2d'), k = window.devicePixelRatio || 1; x.setTransform(k, 0, 0, k, 0, 0); x.clearRect(0, 0, W, H);
    x.strokeStyle = 'rgba(0,0,0,.12)'; x.lineWidth = 1; x.beginPath(); x.moveTo(16, H - 36); x.lineTo(W - 16, H - 36); x.stroke();
    x.strokeStyle = '#111418'; x.lineWidth = 2.6; x.lineCap = x.lineJoin = 'round';
    for(const t of trazos){ x.beginPath(); t.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); if(t.length === 1) x.lineTo(t[0][0] + .1, t[0][1]); x.stroke(); }
    cv.parentNode.classList.toggle('con', trazos.length > 0);
  }
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  let activo = false;
  cv.addEventListener('pointerdown', e => { e.preventDefault(); activo = true; try{ cv.setPointerCapture(e.pointerId); }catch(_){} trazos.push([pos(e)]); dibujar(); });
  cv.addEventListener('pointermove', e => { if(!activo) return; e.preventDefault(); const p = pos(e), t = trazos[trazos.length - 1], u = t[t.length - 1];
    if(p[0] < 0 || p[1] < 0 || p[0] > W || p[1] > H) return; if(Math.hypot(p[0] - u[0], p[1] - u[1]) > 2){ t.push(p); dibujar(); } });
  const fin = () => { activo = false; };
  cv.addEventListener('pointerup', fin); cv.addEventListener('pointercancel', fin);
  requestAnimationFrame(ajustar);
  return {
    borrar(){ trazos.length = 0; dibujar(); },
    texto(){
      if(trazos.reduce((a, t) => a + t.length, 0) < 8 || !W) return null;
      const n = (v, m) => Math.max(0, Math.min(1000, Math.round(v / m * 1000)));
      return trazos.filter(t => t.length > 1).map(t => t.map(p => n(p[0], W) + ',' + n(p[1], H)).join(' ')).join('|');
    },
  };
}

async function visitasDentro(){
  const desde = new Date(Date.now() - 3 * 864e5).toISOString();
  const r = [...await api('eventos?select=created_at,guardia,detalle,tipo&edificio=eq.' + enc(G.ed) + '&created_at=gte.' + enc(desde) + '&tipo=' + enc(inList(['Visita', 'Salida de visita'])) + '&order=created_at.asc&limit=1000'),
    ...await pendientesComoEventos(['Visita', 'Salida de visita'])];
  const ent = new Map(), salidas = new Set();
  for(const e of r){
    const d = detalleDe(e);
    if(e.tipo === 'Visita' && sinTildes(d.tipo) === 'recurrente salida') continue;
    if(e.tipo === 'Salida de visita' || !d.ref){ if(d.ref) salidas.add(String(d.ref)); continue; }
    ent.set(String(d.ref), {d, t: horaReal(e), g: e.guardia});
  }
  return [...ent.entries()].filter(([ref]) => !salidas.has(ref)).map(([ref, x]) => ({ref, ...x})).sort((a, b) => b.t - a.t);
}

/* Lectura automática (en segundo plano): llena los campos vacíos, el guardia puede corregir */
let ocrSeq = 0;
async function leerCarnet(fotos, idEst, idNom, idCi){
  const est = $('#' + idEst); if(!est || !fotos.length) { if(est) est.textContent = ''; return; }
  const mio = ++ocrSeq;
  est.className = 'ocrst'; est.textContent = (OCR.listo() ? '' : 'Preparando el lector (solo la primera vez, puede tardar)… ') + (fotos.length < 2 ? 'Leyendo el anverso… (falta el reverso)' : 'Leyendo el carnet…');
  try{
    const r = await OCR.carnet(fotos[0], fotos[1]);
    if(mio !== ocrSeq || !$('#' + idEst)) return;
    const n = $('#' + idNom), c = $('#' + idCi);
    /* lo leído se escribe en los campos (el guardia lo puede corregir) */
    if(r.nombre && n){ n.value = r.nombre; n.dispatchEvent(new Event('input')); }
    if(r.ci && c){ c.value = r.ci; c.dispatchEvent(new Event('input')); }
    est.className = 'ocrst' + (r.nombre && r.ci ? ' ok' : '');
    const falta = [!r.nombre ? 'el nombre' : '', !r.ci ? 'el número' : ''].filter(Boolean).join(' ni ');
    est.innerHTML = esc(r.nombre || r.ci ? 'Leído: ' + [r.nombre, r.ci ? 'CI ' + r.ci : ''].filter(Boolean).join(' · ') + (falta ? '. No se leyó ' + falta + ': escríbelo.' : '. Revisa que esté bien.')
      : 'No se pudo leer el carnet: escribe los datos o saca otra foto más cerca y sin reflejo.')
      + `<details><summary>Ver lo que leyó</summary><pre>${esc((r.textos || []).join('\n—————\n') || '(nada)')}</pre></details>`;
  }catch(e){
    if(mio !== ocrSeq || !$('#' + idEst)) return;
    est.className = 'ocrst';
    est.innerHTML = esc('Sin lectura automática (' + ((e && e.message) || 'error') + '). Escribe los datos o ') + '<button type="button" class="btn" style="height:36px;padding:0 12px">Reintentar lectura</button>';
    est.querySelector('button').onclick = () => leerCarnet(fotos, idEst, idNom, idCi);
  }
}
async function leerTarjeta(foto, idEst, idNum){
  const est = $('#' + idEst); if(!est) return;
  if(!foto){ est.textContent = ''; return; }
  est.className = 'ocrst'; est.textContent = 'Leyendo el número…';
  try{
    const n = await OCR.tarjeta(foto, digitos());
    if(!$('#' + idEst)) return;
    const i = $('#' + idNum);
    if(n && i){ i.value = n; est.className = 'ocrst ok'; est.textContent = 'N° leído: ' + n + '. Revisa que esté bien.'; }
    else est.textContent = 'No se pudo leer el número: escríbelo.';
  }catch(_){ if($('#' + idEst)) est.textContent = 'Sin lectura automática: escribe el número.'; }
}

/* Franja con hora, novedad, guardia y edificio sobre la PRIMERA foto: así en WhatsApp va un solo álbum
   (sin texto aparte, que WhatsApp separa) y la descripción se ve en la foto grande del grupo. */
async function fotoConFranja(blob, lineas){
  const url = URL.createObjectURL(blob);
  try{
    const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = url; });
    const w = img.naturalWidth, h = img.naturalHeight, c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0);
    const fs = Math.round(Math.max(22, Math.min(w, h) * 0.045)), pad = Math.round(fs * 0.7), lh = Math.round(fs * 1.28);
    const partir = (t, f) => { x.font = f; const out = []; let l = '';
      for(const p of String(t).split(' ')){ const n = l ? l + ' ' + p : p; if(x.measureText(n).width > w - 2 * pad && l){ out.push(l); l = p; } else l = n; }
      if(l) out.push(l); return out; };
    const filas = [];
    lineas.forEach((t, i) => { const f = (i === 0 ? '700 ' : '600 ') + (i === 0 ? Math.round(fs * 1.1) : fs) + 'px -apple-system, Helvetica, Arial, sans-serif';
      partir(t, f).slice(0, i === 1 ? 4 : 2).forEach(l => filas.push([l, f])); });
    const alto = filas.length * lh + pad * 2;
    x.fillStyle = 'rgba(0,0,0,.62)'; x.fillRect(0, h - alto, w, alto);
    x.fillStyle = '#fff'; x.textBaseline = 'top';
    filas.forEach(([l, f], i) => { x.font = f; x.fillText(l, pad, h - alto + pad + i * lh); });
    return await new Promise(ok => c.toBlob(b => ok(b || blob), 'image/jpeg', 0.88));
  } finally { URL.revokeObjectURL(url); }
}
function pRonda(){
  cabecera();
  gpsIniciar();
  const min = Math.max(1, parseInt(G.link.ronda_fotos, 10) || 4);
  $('#main').innerHTML = `<div class="card">

    <button class="btn prim" id="rOk">Guardar ronda</button></div>`;
  const quien = () => G.turno ? G.turno.nombre : 'Guardia';
  const lugar = () => G.ed + (G.link.bloque ? ' · ' + G.link.bloque : '');
  /* la foto con la franja se prepara antes del toque: el iPhone exige abrir "Compartir" al instante */
  let lista = null, gen = 0, tmr = null;
  const preparar = () => { clearTimeout(tmr); lista = null; tmr = setTimeout(async () => {
    const mio = ++gen; if(!z.fotos.length) return;
    const obs = v('rO'), ahora = new Date();
    try{
      const primera = await fotoConFranja(z.fotos[0], ['RONDA · ' + diaHora(ahora), obs ? 'Novedad: ' + obs : 'Sin novedad', quien() + ' · ' + lugar()]);
      if(mio === gen) lista = {ahora, obs, n: z.fotos.length, fotos: [primera, ...z.fotos.slice(1)]};
    }catch(_){}
  }, 120); };
  const z = zonaFotos('rF', {min, max: 30, texto: 'Tomar fotos de la ronda', alCambiar: preparar}); z.pintar();
  $('#rO').oninput = preparar;
  $('#rOk').onclick = async () => {
    if(z.fotos.length < min) return toast('Faltan fotos: ' + z.fotos.length + ' de ' + min, 'var(--bad)');
    ocupado($('#rOk'), true, 'Guardando…');
    const obs = v('rO'), ahora = new Date();
    const texto = (obs ? 'Ronda: ' + obs : 'Ronda sin novedad') + ' - ' + quien() + ' - ' + diaHora(ahora) + ' - ' + G.ed + (G.link.bloque ? ' ' + G.link.bloque : '');
    const listo = lista && lista.obs === obs && lista.n === z.fotos.length ? lista.fotos : null;
    const enviar = fotos => {
      try{
        const files = fotos.map((f, i) => new File([f], 'ronda_' + (i + 1) + '.jpg', {type: 'image/jpeg'}));
        /* solo las fotos (la primera lleva la descripción) => WhatsApp las deja juntas en un álbum */
        if(navigator.canShare && navigator.canShare({files})) return navigator.share({files});
        if(navigator.share) return navigator.share({text: texto});
      }catch(_){}
      return null;
    };
    const compartir = listo ? enviar(listo) : null;
    /* a la nube va solo el registro; las fotos quedan en el celular (se comparten o se guardan desde "Compartir") */
    const fotosGps = z.fotos.map((b, i) => ({n: i + 1, ...(b._t ? {t: new Date(b._t).toISOString()} : {}), ...(b._gps ? {lat: b._gps.lat, lng: b._gps.lng, prec: b._gps.prec} : {})}));
    const guardado = registrar('Ronda', {fotos: z.fotos.length, fotos_en: 'celular', ...(obs ? {observaciones: obs} : {}), ts: ahora.toISOString(),
      fotos_gps: fotosGps, ruta: rutaCompacta(), ruta_inicio: new Date(GPS.inicio).toISOString(), recorrido_m: metrosRecorridos()});
    gpsParar();
    if(compartir) await compartir.catch(() => {});
    await guardado;
    toast('Ronda guardada', 'var(--ok)');
    if(listo){ volver(); return; }
    /* caso raro: la foto con la descripción no alcanzó a prepararse; se prepara y queda un botón para enviar */
    let fotos = z.fotos;
    try{ fotos = [await fotoConFranja(z.fotos[0], ['RONDA · ' + diaHora(ahora), obs ? 'Novedad: ' + obs : 'Sin novedad', quien() + ' · ' + lugar()]), ...z.fotos.slice(1)]; }catch(_){}
    $('#main').innerHTML = `<div class="card" style="text-align:center"><b style="display:block;font-size:17px;margin-bottom:12px">Ronda guardada ✓</b>
      <button class="btn prim ok" id="rWa">Enviar fotos a WhatsApp</button><button class="btn" id="rFin" style="width:100%;margin-top:10px">Listo</button></div>`;
    $('#rWa').onclick = async () => { const p = enviar(fotos); if(p) await p.catch(() => {}); volver(); };
    $('#rFin').onclick = volver;
  };
}

/* Contactos del depto (propietarios, inquilinos y residentes cargados desde supervisión) */
const normDepto = x => String(x || '').toUpperCase().replace(/DEPARTAMENTO|DEPTO|DPTO|DEP\.?/g, '').replace(/[^A-Z0-9]/g, '').replace(/^0+(?=\d)/, '');
async function contactosDepto(depto){
  const q = normDepto(depto); if(!q) return [];
  let pro = [], res = [];
  try{ [pro, res] = await Promise.all([datos('propietarios'), datos('residentes')]); }catch(_){}
  const todos = [];
  for(const f of pro){
    const d = normDepto(f.depto), extra = f.torre ? ' · ' + f.torre : '';
    if(f.copropietario || f.telefono) todos.push({d, depto: f.depto, nombre: f.copropietario || 'Propietario', rol: 'Propietario' + extra, tel: f.telefono || ''});
    if(f.inquilino || f.telefono_inq) todos.push({d, depto: f.depto, nombre: f.inquilino || 'Inquilino', rol: 'Inquilino' + extra, tel: f.telefono_inq || ''});
  }
  for(const f of res) todos.push({d: normDepto(f.depto), depto: f.depto, nombre: f.nombre || 'Residente', rol: f.parentesco || 'Residente', tel: f.celular || f.telefono || ''});
  const exactos = todos.filter(x => x.d === q);
  const l = exactos.length ? exactos : (q.length >= 2 ? todos.filter(x => x.d.startsWith(q)) : []);
  const vistos = new Set();
  return l.filter(x => { const k = sinTildes(x.nombre) + '|' + x.tel; if(vistos.has(k)) return false; vistos.add(k); return true; });
}
const telWa = t => { let d = String(t || '').replace(/[^0-9]/g, ''); if(d.length === 8) d = '591' + d; return d; };
/* abre el chat de WhatsApp de ese número (la app directamente, sin pasar por el navegador) */
function abrirWhatsApp(tel, texto){
  const d = telWa(tel); if(!d) return false;
  location.href = 'whatsapp://send?phone=' + d + '&text=' + encodeURIComponent(texto);
  return true;
}

    <div class="field"><span>Empresa (DHL, Amazon…)</span><input id="eE" autocomplete="off"></div>
    <button class="btn prim" id="eOk">Registrar encomienda</button></div>`;
  const z = zonaFotos('eF', {max: 1, texto: 'Foto del paquete'}); z.pintar();
  let lista = [], elegido = null, gen = 0;
  const pintarCt = () => {
    const box = $('#eCt'); if(!box) return;
    if(!v('eD')){ box.innerHTML = ''; return; }
    box.innerHTML = lista.length ? `<div style="font-size:13px;color:var(--mute);margin:-4px 0 0">¿A quién le llegó? Se le avisará por WhatsApp al guardar.</div>`
      + lista.map((x, i) => `<button type="button" class="cto ${elegido === i ? 'on' : ''}" data-c="${i}"><i></i><div class="t"><b>${esc(x.nombre)}</b><span>${esc(x.rol)} · Depto ${esc(x.depto || '')} · ${x.tel ? esc(x.tel) : 'sin celular'}</span></div></button>`).join('')
      : '<div style="font-size:13px;color:var(--mute)">No hay propietarios ni residentes registrados en ese depto.</div>';
    $('#eOk').textContent = elegido !== null && lista[elegido].tel ? 'Registrar y avisar por WhatsApp' : 'Registrar encomienda';
  };
  let tmr = null;
  $('#eD').oninput = () => { clearTimeout(tmr); tmr = setTimeout(async () => {
    const mio = ++gen, l = await contactosDepto(v('eD')); if(mio !== gen) return;
    lista = l; elegido = l.filter(x => x.tel).length === 1 ? l.findIndex(x => x.tel) : null;
    if(elegido !== null && !v('eN')) $('#eN').value = lista[elegido].nombre;
    pintarCt(); }, 250); };
  $('#eCt').onclick = e => { const b = e.target.closest('[data-c]'); if(!b) return; const i = +b.dataset.c;
    const antes = elegido !== null ? lista[elegido].nombre : null;
    elegido = elegido === i ? null : i;
    if(elegido !== null && (!v('eN') || v('eN') === antes)) $('#eN').value = lista[elegido].nombre;
    if(elegido === null && v('eN') === antes) $('#eN').value = '';
    pintarCt(); };
  $('#eOk').onclick = () => {
    if(!z.fotos.length) return toast('La foto del paquete es obligatoria', 'var(--bad)');
    if(!v('eD')) return toast('Escribe el departamento', 'var(--bad)');
    ocupado($('#eOk'), true, 'Registrando…');
    const c = elegido !== null ? lista[elegido] : null;
    const depto = c && c.depto ? String(c.depto) : v('eD');
    /* la foto se sube a una ruta fija para poder mandar su link en el mensaje */
    const ruta = edSeguro() + '/' + Date.now() + '_' + G.devId + '_enc.jpg', url = SB_URL + '/storage/v1/object/public/osiris/' + ruta;
    registrar('Encomienda', {ref: 'web_' + G.devId + '_e' + Date.now(), depto, destinatario: v('eN'), empresa: v('eE'),
      ...(c && c.tel ? {aviso_a: c.nombre, aviso_tel: c.tel} : {})}, {fotos: z.fotos, rutas: [ruta]});
    /* se abre WhatsApp en el mismo toque (iPhone lo exige) */
    if(c && c.tel) abrirWhatsApp(c.tel, msgEncomienda(depto, v('eN') || c.nombre, v('eE'), url));
    toast('Encomienda registrada', 'var(--ok)'); G.pila[G.pila.length - 1] = [pEncomiendas, ['pend']]; setTimeout(pintar, 300);
  };
}
async function pEncPend(){
  const c = $('#eC'); c.innerHTML = '<div class="empty">Cargando…</div>';
  let l;
  try{
    const r = [...await api('eventos?select=created_at,guardia,detalle,tipo&edificio=eq.' + enc(G.ed) + '&created_at=gte.' + enc(new Date(Date.now() - 30 * 864e5).toISOString()) + '&tipo=' + enc(inList(['Encomienda', 'Entrega de encomienda'])) + '&order=created_at.asc&limit=1000'),
      ...await pendientesComoEventos(['Encomienda', 'Entrega de encomienda'])];
    const ent = new Map(), entregadas = new Set();
    for(const e of r){ const d = detalleDe(e); if(!d.ref) continue; if(e.tipo === 'Encomienda') ent.set(String(d.ref), {d, t: horaReal(e)}); else entregadas.add(String(d.ref)); }
    l = [...ent.entries()].filter(([ref]) => !entregadas.has(ref)).map(([ref, x]) => ({ref, ...x})).sort((a, b) => b.t - a.t);
  }catch(_){ c.innerHTML = '<div class="msg bad">Sin conexión. Intenta de nuevo.</div>'; return; }
  if(!l.length){ c.innerHTML = '<div class="empty">No hay encomiendas por entregar.</div>'; return; }
  c.innerHTML = `<div class="card">${l.map((x, i) => `<div class="item"><div class="t"><b>Depto ${esc(x.d.depto || '-')}</b><span>${esc([x.d.destinatario, x.d.empresa].filter(Boolean).join(' · '))} · llegó ${esc(diaHora(x.t))}</span></div>
    ${x.d.aviso_tel ? `<button class="btn" data-wa="${i}" aria-label="WhatsApp" style="color:var(--ok)">${icono('whatsapp', 20)}</button>` : ''}<button class="btn" data-ent="${i}">Entregar</button></div>`).join('')}</div>`;
  c.onclick = async e => {
    const w = e.target.closest('[data-wa]'); if(w){ const x = l[+w.dataset.wa]; abrirWhatsApp(x.d.aviso_tel, msgEncomienda(x.d.depto || '', x.d.destinatario || x.d.aviso_a || '', x.d.empresa || '', x.d.foto_url || '')); return; }
    const b = e.target.closest('[data-ent]'); if(!b) return; const x = l[+b.dataset.ent];
    toast('Foto del residente recibiendo');
    const f = await tomarFoto(false); if(!f) return;
    b.disabled = true;
    await registrar('Entrega de encomienda', {ref: x.ref, depto: x.d.depto || '', destinatario: x.d.destinatario || '', empresa: x.d.empresa || ''}, {fotos: [f]});
    toast('Entrega registrada', 'var(--ok)'); l.splice(+b.dataset.ent, 1); pEncPend();
  };
}

/* ---------- Consultas ---------- */
function pConsultas(tab){
  cabecera();
  const tabs = [['propietarios','Propietarios', modOn('propietarios')], ['vehiculos','Vehículos', modOn('vehiculos')], ['contactos','Contactos', true], ['normativas','Reglamentos', modOn('normativas')]].filter(t => t[2]);
  tab = tab || tabs[0][0];
  $('#main').innerHTML = `<div class="seg" id="cSeg" style="overflow-x:auto">${tabs.map(([k, t]) => `<button data-t="${k}" class="${tab === k ? 'on' : ''}">${t}</button>`).join('')}</div>
    <div class="field"><input id="cB" class="inp" type="search" placeholder="Buscar" autocomplete="off"></div><div id="cL"><div class="empty">Cargando…</div></div>`;
  $('#cSeg').onclick = e => { const b = e.target.closest('[data-t]'); if(b){ G.pila[G.pila.length - 1] = [pConsultas, [b.dataset.t]]; pintar(); } };
  const tel = n => n ? `<a href="tel:${esc(String(n).replace(/[^\d+]/g, ''))}">${esc(n)}</a>` : '';
  datos(tab).then(filas => {
    const pintarL = () => {
      const q = sinTildes(v('cB'));
      const l = filas.filter(f => !q || sinTildes(Object.values(f).join(' ')).includes(q)).slice(0, 200);
      const fila = f => {
        if(tab === 'propietarios') return `<div class="item"><div class="t"><b>${esc(f.depto || '-')} · ${esc(f.copropietario || '')}</b><span>${tel(f.telefono)}${f.inquilino ? ' · Inquilino: ' + esc(f.inquilino) + ' ' + tel(f.telefono_inq) : ''}${f.nro_parqueo ? ' · Parqueo ' + esc(f.nro_parqueo) : ''}${f.placa ? ' · ' + esc(f.placa) : ''}</span></div></div>`;
        if(tab === 'vehiculos') return `<div class="item"><div class="t"><b>${esc(f.placa || '-')} · Depto ${esc(f.depto || '-')}</b><span>${esc([f.propietario, f.marca, f.modelo, f.color].filter(Boolean).join(' · '))}${f.nro_parqueo ? ' · Parqueo ' + esc(f.nro_parqueo) : ''} ${tel(f.telefono)}</span></div></div>`;
        if(tab === 'contactos') return `<div class="item"><div class="t"><b>${esc(f.nombre || '')}</b><span>${tel(f.telefono)}</span></div>${f.telefono ? `<a class="btn ok" style="display:grid;place-items:center;text-decoration:none" href="tel:${esc(String(f.telefono).replace(/[^\d+]/g, ''))}">Llamar</a>` : ''}</div>`;
        return `<div class="item"><div class="t"><b>${esc(f.nombre || 'Documento')}</b></div>${f.url ? `<a class="btn" style="display:grid;place-items:center;text-decoration:none" href="${esc(f.url)}" target="_blank" rel="noopener">Abrir</a>` : ''}</div>`;
      };
      $('#cL').innerHTML = !filas.length ? '<div class="empty">Todavía no hay datos cargados para este edificio.</div>' : `<div class="card">${l.map(fila).join('') || '<div class="empty">Sin resultados.</div>'}</div>`;
    };
    pintarL(); $('#cB').oninput = pintarL;
  }).catch(() => { $('#cL').innerHTML = '<div class="msg bad">Sin conexión. Intenta de nuevo.</div>'; });
}

(async function(){
  $('#logo').src = LOGO_OSIRIS;
  await abrirCola();
  if(!(await acceso())) return;
  cargarTurno();
  try{ await cargarEdificio(); await recuperarTurno(); }
  catch(_){ bloqueo('<h2>Sin conexión</h2><p style="color:var(--mute)">No se pudo leer el edificio.</p><button class="btn prim" onclick="location.reload()">Reintentar</button>'); return; }
  document.title = 'Osiris · ' + G.ed;
  G.pila = [[inicio, []]]; pintar();
  procesarCola(); pintarSync();
  /* si supervisión desactiva el link o quita este celular, se bloquea */
  setInterval(async () => {
    try{
      const d = (await dispositivos()).get(G.dev);
      const l = await api('eventos?select=id&tipo=eq.Config&edificio=eq.' + MON + '&detalle->>clase=eq.glink&detalle->>token=eq.' + enc(G.token) + '&limit=1');
      if(!l.length || !d || d.estado !== 'ok') location.reload();
    }catch(_){}

})();

/* ---------- Deslizar desde el borde izquierdo para volver ----------
   En la app de la pantalla de inicio el iPhone no tiene gesto de volver: se hace
   aquí. Aparece una flecha; al soltar con la flecha de color, vuelve (o cierra la
   cámara). En la primera pantalla no hace nada: no saca de la app. */
(function(){
  const app = (navigator.standalone === true) || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if(!app) return;
  const f = document.createElement('div'); f.className = 'volverG'; f.innerHTML = icono('atras', 22);
  document.body.appendChild(f);
  let x0 = null, y0 = 0, dx = 0;
  const puede = () => CAM_CERRAR || G.pila.length > 1;
  addEventListener('touchstart', e => { const t = e.touches[0]; if(e.touches.length === 1 && t.clientX < 24 && puede()){ x0 = t.clientX; y0 = t.clientY; dx = 0; } else x0 = null; }, {passive:true});
  addEventListener('touchmove', e => {
    if(x0 === null) return; const t = e.touches[0];
    dx = t.clientX - x0; if(Math.abs(t.clientY - y0) > 60 && dx < 30){ x0 = null; f.style.opacity = 0; return; }
    const p = Math.max(0, Math.min(dx, 120));
    f.style.opacity = Math.min(1, p / 60); f.style.transform = 'translateX(' + (p * 0.6 - 50) + 'px)'; f.classList.toggle('listo', p >= 80);
  }, {passive:true});
  const fin = () => { if(x0 !== null && dx >= 80){ if(CAM_CERRAR) CAM_CERRAR(); else volver(); } x0 = null; f.style.opacity = 0; f.style.transform = ''; f.classList.remove('listo'); };
  addEventListener('touchend', fin, {passive:true}); addEventListener('touchcancel', () => { dx = 0; fin(); }, {passive:true});
})();
