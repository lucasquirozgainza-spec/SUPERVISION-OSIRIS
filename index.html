/* Configuración del edificio (la última publicada por la app): bloques y tolerancia */
async function leerConfig(ed){
  const r = await api('eventos?select=detalle,created_at&tipo=eq.Config&edificio=eq.' + enc(ed) + '&order=created_at.desc&limit=1');
  let mod = {};
  if(r.length){
    let m = detalleDe(r[0]).modulos;
    if(typeof m === 'string'){ try{ m = JSON.parse(m); }catch(_){ m = {}; } }
    if(m && typeof m === 'object') mod = m;
  }
  const torres = Array.isArray(mod.torres) ? mod.torres.map(x => String(x).trim()).filter(Boolean) : [];
  return {torres, tolerancia: Turnos.toleranciaDe(mod), unGuardia: mod.un_guardia === true};
}

/* Registro de guardias del edificio: el último alta/baja de cada CI manda (igual que la app) */
async function leerRegistro(ed){
  const rows = await api('eventos?select=*&edificio=eq.' + enc(ed) + '&tipo=in.(Guardia,GuardiaBaja)&order=created_at.desc&limit=1000');
  const porCi = new Map();
  for(const e of rows){
    const d = detalleDe(e); const ci = limpiarCi(d.ci); if(!ci) continue;
    const t = horaReal(e);
    const p = porCi.get(ci);
    if(!p || t > p.t) porCi.set(ci, {t, e, d});
  }
  const out = new Map();
  for(const [ci, x] of porCi){
    const alta = x.e.tipo === 'Guardia';
    if(!alta && x.d.eliminado === true) continue;            // eliminado: ya no existe
    /* datos del último alta (una baja solo trae ci y nombre) */
    let datos = alta ? x.d : null;
    if(!datos){
      const altas = rows.filter(e => e.tipo === 'Guardia' && limpiarCi(detalleDe(e).ci) === ci).sort((a,b) => horaReal(b) - horaReal(a));
      datos = altas.length ? detalleDe(altas[0]) : x.d;
    }
    const turno = String(datos.turno || 'DIURNO');
    out.set(ci, {ci, nombre: String(datos.nombre || x.d.nombre || x.e.guardia || '').trim(), turno,
      bloque: String(datos.bloque || ''), activo: alta, desde: x.t});
  }
  return out;
}

/* Eventos de turno del mes (mismo rango que la app: 2 días antes y 3 después; correcciones sin tope) */
async function eventosTurnoMes(ed, y, m){
  const desde = new Date(y, m, 1); desde.setDate(desde.getDate() - 2);
  const hasta = new Date(y, m + 1, 1); hasta.setDate(hasta.getDate() + 3);
  const base = 'eventos?select=*&edificio=eq.' + enc(ed) + '&created_at=gte.' + enc(desde.toISOString());
  const [turnos, corr] = await Promise.all([
    paginas(base + '&created_at=lt.' + enc(hasta.toISOString()) + '&tipo=' + enc(inList(['Ingreso de turno','Salida de turno','Doblar turno'])) + '&order=created_at.asc,id.asc'),
    paginas(base + '&tipo=eq.' + enc('Corrección de turno') + '&order=created_at.asc,id.asc'),
  ]);
  return [...turnos, ...corr];
}

/* Horas del mes por guardia (CI) con el mismo cálculo de la app */
async function horasDelMes(ed, y, m, registro, cfg){
  const ev = await eventosTurnoMes(ed, y, m);
  const soloCi = registro.size > 0;
  /* franqueros (registrados o dados de baja): no suman ni restan horas extras */
  const franqueros = new Set([...registro.values()].filter(g => g.turno === 'FRANQUERO').map(g => g.ci));
  const puestos = PanelHoras.panelMes(ev, y, m, {toleranciaMin: cfg.tolerancia, soloConGuardia: soloCi, franqueros, unGuardia: cfg.unGuardia});
  return PanelHoras.porGuardia(puestos);
}

async function cargarGuardias(){
  const box = $('#v-gua'); if(!st.edif){ box.innerHTML = '<div class="empty">Elige un edificio.</div>'; return; }
  const mio = ++GU.gen, ed = st.edif, mes = mesActual();
  if(!GU.datos || GU.datos.ed !== ed) box.innerHTML = '<div class="carga" role="status" aria-label="Cargando"></div>';
  try{
    const [registro, cfg] = await Promise.all([leerRegistro(ed), leerConfig(ed)]);
    const horas = await horasDelMes(ed, mes.y, mes.m, registro, cfg);
    if(mio !== GU.gen) return;
    GU.datos = {ed, mes, registro, cfg, horas};
    pintarGuardias();
  }catch(e){
    if(mio !== GU.gen) return;
    box.innerHTML = `<div class="err">No se pudo leer la nube (${esc(e.message)}).<br>Toca ↻ para reintentar.</div>`;
  }
}

/* ---------- Resumen del mes por guardia ----------
   El mes va del ingreso del DIURNO el día 1 al último turno NOCTURNO de ese mes
   (el mismo corte de las horas extras). Para diurnos y nocturnos se revisa cada
   turno que les tocaba: si no entraron, es PERMISO (día libre aprobado para esa
   fecha) o FALTA, con quién lo cubrió. Los franqueros no tienen turnos fijos. */
function relevosDelEdificio(D){
  const cuenta = new Map();
  for(const r of D.horas.values()) for(const t of r.turnos){
    const k = Turnos.limpiar(t.horariosUsados || []).sort().join(','); if(k) cuenta.set(k, (cuenta.get(k) || 0) + 1);
  }
  const mejor = [...cuenta.entries()].sort((a,b) => b[1] - a[1])[0];
  const l = (mejor ? mejor[0].split(',') : Turnos.porDefecto.slice()).sort();
  return l.length >= 2 ? l : Turnos.limpiar(l).sort();
}
const ymdLocal = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
function turnosQueCubren(D, t0){
  const out = [];
  for(const r of D.horas.values()) for(const t of r.turnos){
    if(t.estado === 'anulado' || t.estado === 'muy corto') continue;
    const ini = t.progInicio || t.inicio, n = Math.max(1, Math.round((t.nivel || 12) / 12));
    for(let k = 0; k < n; k++){ if(Math.abs(+ini + k * 432e5 - t0) <= 3 * 36e5){ out.push(t); break; } }
  }
  return out;
}
function resumenMes(D, g){
  const r = D.horas.get(g.ci);
  const res = {dias: r ? r.dias : 0, n36: r ? r.n36 : 0, n24: r ? r.n24 : 0, sinTurno: [], permisos: 0, faltas: 0,
    adelPedidos: 0, adelConfirmados: 0, adelTotal: 0, libresPedidos: 0};
  const enMes = d => d.getFullYear() === D.mes.y && d.getMonth() === D.mes.m;
  const suyas = (SOL.lista || []).filter(x => x.ed === D.ed && (x.ci ? x.ci === g.ci : x.guardia === g.nombre));
  for(const x of suyas){
    if(x.clase === 'adelanto' && enMes(x.t)){ res.adelPedidos++; if(x.estado === 'confirmado'){ res.adelConfirmados++; res.adelTotal += x.monto || 0; } }
    if(x.clase === 'libre' && /^\d{4}-\d{2}-\d{2}$/.test(x.fecha) && enMes(new Date(x.fecha + 'T12:00:00'))) res.libresPedidos++;
  }
  if(g.turno !== 'DIURNO' && g.turno !== 'NOCTURNO') return res;
  const rel = relevosDelEdificio(D), h = rel[g.turno === 'NOCTURNO' ? 1 : 0] || rel[0];
  const [hh, mm] = h.split(':').map(Number);
  const aprobados = new Set(suyas.filter(x => x.clase === 'libre' && x.estado === 'aprobado').map(x => x.fecha));
  const ultimo = new Date(D.mes.y, D.mes.m + 1, 0).getDate();
  const ahora = Date.now();
  const desde = g.desde ? new Date(g.desde.getFullYear(), g.desde.getMonth(), g.desde.getDate() + 1) : null; // el día que lo registraron no cuenta
  for(let dia = 1; dia <= ultimo; dia++){
    const t0 = new Date(D.mes.y, D.mes.m, dia, hh, mm);
    if(+t0 + 30 * 6e4 > ahora) break;                 // todavía no le tocaba
    if(desde && t0 < desde) continue;                  // antes de que lo registraran
    if(!g.activo && g.desde && t0 >= g.desde) break;   // después de su baja
    const cubren = turnosQueCubren(D, +t0);
    if(cubren.some(t => t.clave === g.ci)) continue;   // entró (o dobló y cubrió ese turno)
    const fecha = ymdLocal(t0), permiso = aprobados.has(fecha);
    const otros = [...new Set(cubren.map(t => t.guardia))];
    res.sinTurno.push({t0, fecha, permiso, cubrio: otros.join(', ')});
    if(permiso) res.permisos++; else res.faltas++;
  }
  return res;
}
function resumenMesHtml(D, g){
  const m = resumenMes(D, g), fijo = g.turno === 'DIURNO' || g.turno === 'NOCTURNO';
  const s = (v, l) => `<div class="stat">${v}<small>${l}</small></div>`;
  const lista = m.sinTurno.map(x => `<div class="turno"><div class="tl"><b>${esc(x.t0.toLocaleDateString('es',{weekday:'short',day:'2-digit',month:'2-digit'}))} ${esc(hm(x.t0))}</b>
      <span class="badge" style="background:${x.permiso ? 'var(--info)' : 'var(--bad)'}">${x.permiso ? 'PERMISO' : 'FALTA'}</span></div>
      <div class="mv">${x.cubrio ? 'Cubrió: ' + esc(x.cubrio) : 'Nadie registró ese turno'}</div></div>`).join('');
  return `<div class="shead"><div class="h2">Resumen del mes</div><div class="sder">${info('Del ingreso diurno del día 1 al último turno nocturno del mes. ' + (fijo ? 'Un turno sin ingreso es <b>permiso</b> si tenía el día libre aprobado; si no, es <b>falta</b>.' : 'Los franqueros no tienen turnos fijos: no se cuentan faltas.'), 'Cómo se cuenta')}</div></div>
    <div class="stats" style="grid-template-columns:repeat(${fijo ? 3 : 2},1fr)">
      ${fijo ? s(`<b>${m.permisos}</b>`, 'Permisos') + s(`<b class="${m.faltas ? 'neg' : ''}">${m.faltas}</b>`, 'Faltas') : ''}
      ${s(`<b>${m.libresPedidos}</b>`, 'Días libres pedidos')}${s(`<b>${m.adelPedidos}</b>`, 'Adelantos pedidos')}
      ${s(`<b>${m.adelConfirmados}</b>`, 'Adelantos confirmados')}${s(`<b>${esc(bsTxt(m.adelTotal))}</b>`, 'Total adelantos')}
    </div>
    ${fijo && m.sinTurno.length ? `<div class="card">${lista}</div>` : ''}`;
}
function fmtSaldo(h){ const t = Turnos.saldo(h); const c = Math.round(h*60) > 0 ? 'pos' : (Math.round(h*60) < 0 ? 'neg' : ''); return `<b class="${c}">${esc(t)}</b>`; }

function pintarGuardias(){
  const D = GU.datos, box = $('#v-gua');
  const lista = [...D.registro.values()].sort((a,b) => (b.activo - a.activo) || a.turno.localeCompare(b.turno) || a.nombre.localeCompare(b.nombre,'es'));
  const activos = lista.filter(g => g.activo), bajas = lista.filter(g => !g.activo);
  const card = g => {
    const r = D.horas.get(g.ci);
    return `<div class="card gcard" data-ci="${esc(g.ci)}">
      <div class="gtop"><div class="gname">${esc(g.nombre)}</div>${g.activo ? '' : '<span class="pill">De baja</span>'}</div>
      <div class="gid">ID ${esc(g.ci)} · ${TURNO_TXT[g.turno] || esc(g.turno)}${g.bloque ? ' · ' + esc(g.bloque) : ''}</div>
      <div class="stats">
        <div class="stat">${g.turno === 'FRANQUERO' ? '<b style="font-size:13px">No aplica</b>' : fmtSaldo(r ? r.saldo : 0)}<small>Horas extras</small></div>
        <div class="stat"><b>${r ? r.dias : 0}</b><small>Días trabajados</small></div>
        <div class="stat"><b>${r ? r.n24 : 0}</b><small>Turnos 24 h</small></div>
        <div class="stat"><b>${r ? r.n36 : 0}</b><small>Turnos 36 h (día extra)</small></div>
      </div>${(() => { const m = resumenMes(D, g); const fijo = g.turno === 'DIURNO' || g.turno === 'NOCTURNO';
        return `<div class="gres">${fijo ? `Permisos <b>${m.permisos}</b> · Faltas <b class="${m.faltas ? 'neg' : ''}">${m.faltas}</b> · ` : ''}Adelantos <b>${m.adelConfirmados ? esc(bsTxt(m.adelTotal)) : '0'}</b></div>`; })()}</div>`;
  };
  box.innerHTML = `
    <div class="shead"><div class="h2">Guardias · ${activos.length} activo${activos.length === 1 ? '' : 's'}</div>
      <div class="sder">${info((D.cfg.unGuardia ? 'Edificio de un solo guardia: las horas extras se cuentan contra su propio horario (quedarse después suma; llegar tarde o irse antes resta).' : 'Horas extras solo entre los fijos (diurno y nocturno) y en espejo: lo que uno tiene a favor, el otro lo tiene en contra. Los franqueros no suman ni restan.') + ' Un turno de 36 h cuenta como día extra, no como horas extras.' + ` Tolerancia de relevo: ${D.cfg.tolerancia} min. Los cambios de guardias llegan a los celulares del edificio en unos 10 minutos.`, 'Cómo se calculan las horas')}<button class="btn chico" id="gNuevo">${icono('mas1', 15)} Registrar</button></div></div>
    ${activos.length ? activos.map(card).join('') : '<div class="card"><div class="empty">Sin guardias registrados.</div></div>'}
    ${bajas.length ? `<button class="btn more" id="gBajas">${GU.verBajas ? 'Ocultar' : 'Ver'} dados de baja (${bajas.length})</button>
      ${GU.verBajas ? bajas.map(card).join('') : ''}` : ''}
`;
}

$('#v-gua').addEventListener('click', ev => {
  if(ev.target.id === 'gNuevo') return formGuardia();
  if(ev.target.id === 'gBajas'){ GU.verBajas = !GU.verBajas; return pintarGuardias(); }
  const c = ev.target.closest('.gcard'); if(c) detalleGuardia(c.dataset.ci);
});

/* ---------- Registrar ---------- */
function formGuardia(){
  const D = GU.datos; if(!D) return;
  let turno = 'DIURNO';
  $('#panel').innerHTML = `<button class="btn close" id="cerrar">Cerrar</button>
    <h2>Registrar guardia</h2><div class="sub">${esc(D.ed)}</div>
    <label class="field"><span>Nombre</span><input id="fNom" autocomplete="off" autocapitalize="words"></label>
    <label class="field"><span>CI</span><input id="fCi" autocomplete="off" inputmode="text" autocapitalize="characters"></label>
    <div class="field"><span>Turno</span><div class="seg" id="fTur">
      <button class="btn on" data-t="DIURNO">Diurno</button><button class="btn" data-t="NOCTURNO">Nocturno</button><button class="btn" data-t="FRANQUERO">Franquero</button></div></div>
    ${D.cfg.torres.length ? `<label class="field"><span>Bloque / torre</span><select id="fBlo">${D.cfg.torres.map(t => `<option>${esc(t)}</option>`).join('')}</select></label>` : ''}
    <div id="fMsg"></div>
    <button class="btn prim" id="fOk">Registrar</button>`;
  $('#sheet').classList.add('on');
  $('#fTur').onclick = e => { const b = e.target.closest('button'); if(!b) return; turno = b.dataset.t; [...$('#fTur').children].forEach(x => x.classList.toggle('on', x === b)); };
  $('#fOk').onclick = async () => {
    const nombre = $('#fNom').value.trim(), ci = limpiarCi($('#fCi').value), bloque = $('#fBlo') ? $('#fBlo').value : '';
    const msg = t => $('#fMsg').innerHTML = `<div class="msg bad">${esc(t)}</div>`;
    if(!nombre) return msg('Escribe el nombre');
    if(ci.length < 4) return msg('Escribe el CI (carnet)');
    const reg = await leerRegistro(D.ed).catch(() => D.registro);
    const act = [...reg.values()].filter(g => g.activo);
    if(act.some(g => g.ci === ci)) return msg('Ya hay un guardia activo con el CI ' + ci + ' en este edificio.');
    if(turno !== 'FRANQUERO'){
      const ya = act.filter(g => g.turno === turno && g.bloque === bloque);
      if(ya.length) return msg(`Ya existe un guardia ${turno === 'NOCTURNO' ? 'nocturno' : 'diurno'} activo${bloque ? ' en ' + bloque : ''} (${ya[0].nombre}). Dalo de baja antes de registrar uno nuevo.`);
    }
    $('#fOk').disabled = true; $('#fOk').textContent = 'Guardando…';
    try{
      await apiEscribir('POST', 'eventos', nuevoEvento('Guardia', D.ed, nombre, {
        ci, nombre, turno, bloque,
        rol: turno === 'FRANQUERO' ? 'franquero' : 'guardia',
        cargo: turno === 'FRANQUERO' ? 'Franquero' : 'Guardia de Seguridad',
      }));
      $('#sheet').classList.remove('on'); cargarGuardias();
    }catch(e){ msg('No se pudo guardar: ' + e.message); $('#fOk').disabled = false; $('#fOk').textContent = 'Registrar'; }
  };
}

/* Relevo del día 1 siguiente (fin del último turno del mes): cuenta en este mes
   para los dos guardias, aunque el turno del que entra ya sea del mes siguiente. */
function movsOtroMes(r){
  if(!r || !r.movs) return '';
  const propios = new Set(r.turnos.flatMap(t => t.movimientos));
  const otros = r.movs.filter(m => !propios.has(m));
  if(!otros.length) return '';
  return otros.map(m => `<div class="turno"><div class="tl"><b>Relevo ${esc(m.programado.toLocaleDateString('es',{day:'2-digit',month:'2-digit'}))} ${esc(hm(m.programado))}</b><span>fin de mes</span></div>
    <div class="mv"><span class="${m.horas > 0 ? 'pos' : 'neg'}">${esc(Turnos.saldo(m.horas))}</span> ${esc(m.motivo)}${m.con ? ' (' + esc(m.con) + ')' : ''}</div></div>`).join('');
}

/* ---------- Detalle ---------- */
async function detalleGuardia(ci){
  const D = GU.datos; const g = D.registro.get(ci); if(!g) return;
  const r = D.horas.get(ci);
  const cuentaAqui = new Set(r ? r.movs : []);
  const turnosHtml = !r || !r.turnos.length ? '<div class="empty" style="padding:16px">Sin turnos en el mes.</div>' : r.turnos.map(t => {
    const f = d => d.toLocaleDateString('es',{weekday:'short',day:'2-digit',month:'2-digit'}) + ' ' + hm(d);
    const est = t.estado === 'ok' ? '' : ` <span class="badge" style="background:${t.estado === 'abierto' ? 'var(--ok)' : 'var(--warn)'}">${esc(t.estado === 'abierto' ? 'EN TURNO' : t.estado.toUpperCase())}</span>`;
    const dur = t.cerrado ? ' · ' + Turnos.duracion(Math.round(t.horas * 60)) : '';
    const movs = t.movimientos.map(m => `<div class="mv"><span class="${m.horas > 0 ? 'pos' : 'neg'}">${esc(Turnos.saldo(m.horas))}</span> ${esc(m.motivo)}${m.con ? ' (' + esc(m.con) + ')' : ''}${cuentaAqui.has(m) ? '' : ' · cuenta en el mes anterior'}</div>`).join('');
    const notas = t.notas.map(n => `<div class="mv">${esc(n)}</div>`).join('');
    return `<div class="turno"><div class="tl"><b>${esc(f(t.inicio))} → ${t.fin && t.estado !== 'sin ingreso' ? esc(hm(t.fin)) : '…'}</b><span>${t.nivel} h${dur}</span></div>${est}${movs}${notas}</div>`;
  }).join('');
  const s = (v, l) => `<div class="stat">${v}<small>${l}</small></div>`;
  $('#panel').innerHTML = `<button class="btn close" id="cerrar">Cerrar</button>
    <h2>${esc(g.nombre)}</h2><div class="sub">ID ${esc(g.ci)} · ${TURNO_TXT[g.turno] || esc(g.turno)}${g.bloque ? ' · ' + esc(g.bloque) : ''} · ${g.activo ? 'Activo' : 'De baja'} · ${esc(mesTxt(D.mes))}</div>
    <div class="shead" style="margin-top:0"><div class="h2">Horas del mes</div><button class="btn chico" id="gPdf" data-ci="${esc(g.ci)}">${icono('informe', 15)} Descargar PDF</button></div>
    <div id="gPdfMsg"></div>
    <div class="stats">
      ${s(fmtSaldo(r ? r.saldo : 0), 'Saldo horas extras')}${s(`<b class="${r && Math.round(r.aFavor*60) ? 'pos' : ''}">${esc(Turnos.saldo(r ? r.aFavor : 0))}</b>`, 'A favor')}
      ${s(`<b class="${r && Math.round(r.enContra*60) ? 'neg' : ''}">${esc(r && Math.round(r.enContra*60) ? '-' + Turnos.duracion(Math.round(r.enContra*60)) : '0 h')}</b>`, 'En contra')}${s(`<b>${esc(Turnos.duracion(Math.round((r ? r.horas : 0)*60)))}</b>`, 'Horas trabajadas')}
      ${s(`<b>${r ? r.dias : 0}</b>`, 'Días que inició turno')}${s(`<b>${r ? r.n12 : 0}</b>`, 'Turnos 12 h')}${s(`<b>${r ? r.n24 : 0}</b>`, 'Turnos 24 h')}${s(`<b>${r ? r.n36 : 0}</b>`, 'Turnos 36 h')}
    </div>
    ${r && (r.vecesTarde || r.incompletos) ? `<div class="msg">${r.vecesTarde ? r.vecesTarde + ' llegada(s) tarde. ' : ''}${r.incompletos ? r.incompletos + ' turno(s) incompletos (no suman ni restan).' : ''}</div>` : ''}
    ${resumenMesHtml(D, g)}
    <div class="h2">Ingresos y salidas</div><div class="card">${turnosHtml}${movsOtroMes(r)}</div>
    <div class="h2">Adelantos y días libres</div><div id="gSolG"></div>
    <div class="h2">Registros del mes</div><div id="gReg"><div class="carga" role="status" aria-label="Cargando"></div></div>
    <div class="h2">Acciones</div>
    <div class="acts">
      ${g.activo ? '<button class="btn warnb" id="gBaja">Dar de baja</button>' : '<button class="btn" id="gAlta">Reactivar</button>'}
      <button class="btn danger" id="gElim">Eliminar guardia</button>
    </div>
    <div id="gMsg"></div>`;
  $('#sheet').classList.add('on');
  const accion = async (fn, txt) => {
    $('#gMsg').innerHTML = `<div class="msg">${esc(txt)}…</div>`;
    try{ await fn(); $('#sheet').classList.remove('on'); cargarGuardias(); }
    catch(e){ $('#gMsg').innerHTML = `<div class="msg bad">No se pudo: ${esc(e.message)}</div>`; }
  };
  if($('#gBaja')) $('#gBaja').onclick = () => {
    if(!confirm(`¿Dar de baja a ${g.nombre}? Su historial y horas se conservan.`)) return;
    accion(() => apiEscribir('POST', 'eventos', nuevoEvento('GuardiaBaja', D.ed, g.nombre, {ci:g.ci, nombre:g.nombre})), 'Dando de baja');
  };
  if($('#gAlta')) $('#gAlta').onclick = () => accion(async () => {
    const act = [...(await leerRegistro(D.ed)).values()].filter(x => x.activo);
    if(g.turno !== 'FRANQUERO'){
      const ya = act.find(x => x.turno === g.turno && x.bloque === g.bloque && x.ci !== g.ci);
      if(ya) throw new Error(`ya hay un guardia ${TURNO_TXT[g.turno].toLowerCase()} activo${g.bloque ? ' en ' + g.bloque : ''} (${ya.nombre})`);
    }
    await apiEscribir('POST', 'eventos', nuevoEvento('Guardia', D.ed, g.nombre, {ci:g.ci, nombre:g.nombre, turno:g.turno, bloque:g.bloque,
      rol: g.turno === 'FRANQUERO' ? 'franquero' : 'guardia', cargo: g.turno === 'FRANQUERO' ? 'Franquero' : 'Guardia de Seguridad'}));
  }, 'Reactivando');
  $('#gElim').onclick = () => eliminarGuardia(g);
  historialSolGuardia(D.ed, g, D.mes);
  /* registros del mes de este guardia (por su CI) */
  try{
    const regs = await registrosGuardia(D, g);
    const cont = {}; regs.forEach(e => cont[e.tipo] = (cont[e.tipo]||0) + 1);
    $('#gReg').innerHTML = !regs.length ? '<div class="lista"><div class="empty">Sin rondas, visitas ni novedades registradas.</div></div>'
      : `<div class="msg">${Object.entries(cont).map(([k,v]) => esc((ESTILO[k]||{t:k}).t) + ': <b>' + v + '</b>').join(' · ')}</div>`
        + `<div class="card">${regs.slice(0, 150).map(e => { const t = horaReal(e), d = detalleDe(e);
          return `<div class="turno"><div class="tl"><b>${esc((ESTILO[e.tipo]||{t:e.tipo}).t)}</b><span>${esc(t.toLocaleDateString('es',{day:'2-digit',month:'2-digit'}))} ${esc(hm(t))}</span></div><div class="mv">${esc(resumen(e, d))}</div></div>`; }).join('')}</div>`;
  }catch(e){ $('#gReg').innerHTML = `<div class="err" style="padding:16px">No se pudieron leer los registros (${esc(e.message)}).</div>`; }
}

/* Registros del mes de un guardia (se guardan: el PDF y la ficha usan los mismos) */
async function registrosGuardia(D, g){
  GU.regs = GU.regs || {};
  const k = D.ed + '|' + D.mes.y + '-' + D.mes.m + '|' + g.ci;
  if(GU.regs[k]) return GU.regs[k];
  const desde = new Date(D.mes.y, D.mes.m, 1), hasta = new Date(D.mes.y, D.mes.m + 1, 2);
  const regs = (await paginas('eventos?select=*&edificio=eq.' + enc(D.ed) + '&detalle->>guard_ci=eq.' + enc(g.ci)
    + '&created_at=gte.' + enc(desde.toISOString()) + '&created_at=lt.' + enc(hasta.toISOString()) + '&order=created_at.desc'))
    .filter(e => { const t = horaReal(e); return t >= desde && t < new Date(D.mes.y, D.mes.m + 1, 1); })
    .filter(e => !['Ingreso de turno','Salida de turno','Doblar turno','Solicitud'].includes(e.tipo))
    .sort((a,b) => horaReal(b) - horaReal(a));
  return GU.regs[k] = regs;
}

/* ---------- PDF de la ficha: todo lo que muestra, en hoja carta, con poca tinta ---------- */
async function pdfGuardia(ci){
  const D = GU.datos, g = D && D.registro.get(ci); if(!g) return;
  const box = $('#gPdfMsg'), btn = $('#gPdf');
  const paso = t => box.innerHTML = `<div class="msg">${esc(t)}</div>`;
  btn.disabled = true;
  try{
    paso('Preparando el PDF…');
    const [JsPDF, regs] = await Promise.all([cargarJsPDF(), registrosGuardia(D, g).catch(() => [])]);
    const r = D.horas.get(ci), m = resumenMes(D, g), fijo = g.turno === 'DIURNO' || g.turno === 'NOCTURNO';
    const doc = new JsPDF({unit:'mm', format:'letter'});
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 16;
    const tinta = [17, 20, 24], gris = [91, 100, 114], linea = [205, 210, 218];
    let y = 0;
    /* encabezado */
    try{ doc.addImage(LOGO_OSCURO, 'PNG', M, 12, 34, 34 * 226 / 480); }catch(_){}
    doc.setTextColor(...tinta); doc.setFont('helvetica', 'bold'); doc.setFontSize(14);
    doc.text('Ficha del guardia', W - M, 18, {align:'right'});
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...gris);
    doc.text(pdfTxt(`${D.ed}  |  ${mesTxt(D.mes)}`), W - M, 23.5, {align:'right'});
    doc.setDrawColor(...tinta); doc.setLineWidth(0.5); doc.line(M, 32, W - M, 32);
    doc.setTextColor(...tinta); doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
    doc.text(pdfTxt(g.nombre), M, 42);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...gris);
    doc.text(pdfTxt(`CI ${g.ci}   |   Turno ${TURNO_TXT[g.turno] || g.turno}${g.bloque ? '   |   ' + g.bloque : ''}   |   ${g.activo ? 'Activo' : 'De baja'}`), M, 48);
    y = 58;
    const titulo = t => {
      if(y > H - 40){ doc.addPage(); y = 22; }
      doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(...tinta); doc.text(pdfTxt(t), M, y);
      doc.setDrawColor(...linea); doc.setLineWidth(0.25); doc.line(M, y + 1.8, W - M, y + 1.8); y += 4;
    };
    const tabla = (cols, filas, extra = {}) => {
      if(!filas.length){ doc.setFont('helvetica', 'italic'); doc.setFontSize(9); doc.setTextColor(...gris); doc.text('Sin registros en el mes.', M, y + 5); y += 13; return; }
      doc.autoTable({startY: y + 1, margin:{left:M, right:M, top:20, bottom:18}, theme:'plain',
        head: cols ? [cols.map(pdfTxt)] : undefined, body: filas.map(f => f.map(pdfTxt)),
        styles:{font:'helvetica', fontSize:8.8, textColor:[40, 46, 54], cellPadding:{top:1.9, bottom:1.9, left:1.6, right:1.6}, overflow:'linebreak', valign:'middle'},
        headStyles:{fontStyle:'bold', textColor: tinta, fontSize:8.5},
        didDrawCell: c => { if(c.section === 'body' || c.section === 'head'){ doc.setDrawColor(...(c.section === 'head' ? tinta : linea)); doc.setLineWidth(c.section === 'head' ? 0.35 : 0.15); doc.line(c.cell.x, c.cell.y + c.cell.height, c.cell.x + c.cell.width, c.cell.y + c.cell.height); } },
        ...extra});
      y = doc.lastAutoTable.finalY + 9;
    };
    /* pares etiqueta / valor en dos columnas */
    const pares = l => { const f = []; for(let i = 0; i < l.length; i += 2) f.push([l[i][0], l[i][1], l[i + 1] ? l[i + 1][0] : '', l[i + 1] ? l[i + 1][1] : '']); return f; };
    const negr = {0:{textColor:gris}, 1:{fontStyle:'bold', halign:'right', cellWidth:34}, 2:{textColor:gris, cellPadding:{top:1.9, bottom:1.9, left:10, right:1.6}}, 3:{fontStyle:'bold', halign:'right', cellWidth:34}};
    const enContra = r && Math.round(r.enContra * 60) ? '-' + Turnos.duracion(Math.round(r.enContra * 60)) : '0 h';
    titulo('Horas del mes');
    tabla(null, pares([
      ['Saldo horas extras', g.turno === 'FRANQUERO' ? 'No aplica' : Turnos.saldo(r ? r.saldo : 0)], ['Horas trabajadas', Turnos.duracion(Math.round((r ? r.horas : 0) * 60))],
      ['A favor', Turnos.saldo(r ? r.aFavor : 0)], ['En contra', enContra],
      ['Días que inició turno', String(r ? r.dias : 0)], ['Turnos de 12 h', String(r ? r.n12 : 0)],
      ['Turnos de 24 h', String(r ? r.n24 : 0)], ['Turnos de 36 h', String(r ? r.n36 : 0)],
      ['Llegadas tarde', String(r ? r.vecesTarde : 0)], ['Turnos incompletos', String(r ? r.incompletos : 0)]]), {columnStyles: negr});
    titulo('Resumen del mes');
    tabla(null, pares([
      ...(fijo ? [['Permisos', String(m.permisos)], ['Faltas', String(m.faltas)]] : []),
      ['Días libres pedidos', String(m.libresPedidos)], ['Adelantos pedidos', String(m.adelPedidos)],
      ['Adelantos confirmados', String(m.adelConfirmados)], ['Total adelantos', bsTxt(m.adelTotal)]]), {columnStyles: negr});
    if(fijo){
      titulo('Turnos sin ingreso');
      tabla(['Fecha', 'Hora', 'Situación', 'Cubrió'], m.sinTurno.map(x => [fDia(x.t0), fHora(x.t0), x.permiso ? 'Permiso' : 'Falta', x.cubrio || 'Nadie registró ese turno']),
        {columnStyles:{0:{cellWidth:24}, 1:{cellWidth:16}, 2:{cellWidth:22, fontStyle:'bold'}}});
    }
    titulo('Ingresos y salidas');
    const cuentaAqui = new Set(r ? r.movs : []);
    tabla(['Inicio', 'Fin', 'Turno', 'Duración', 'Estado', 'Horas extras'], (r ? r.turnos : []).map(t => [
      fDiaHora(t.inicio), t.fin && t.estado !== 'sin ingreso' ? fDiaHora(t.fin) : '', t.nivel + ' h', t.cerrado ? Turnos.duracion(Math.round(t.horas * 60)) : '',
      t.estado === 'ok' ? 'Completo' : t.estado === 'abierto' ? 'En turno' : t.estado.charAt(0).toUpperCase() + t.estado.slice(1),
      [...t.movimientos.map(mv => Turnos.saldo(mv.horas) + ' ' + mv.motivo + (mv.con ? ' (' + mv.con + ')' : '') + (cuentaAqui.has(mv) ? '' : ', mes anterior')), ...t.notas].join('\n')]),
      {columnStyles:{0:{cellWidth:24}, 1:{cellWidth:24}, 2:{cellWidth:14}, 3:{cellWidth:20}, 4:{cellWidth:22}}});
    titulo('Adelantos y días libres');
    const suyas = SOL.lista.filter(x => x.ed === D.ed && (x.ci ? x.ci === g.ci : x.guardia === g.nombre));
    tabla(['Pedido', 'Tipo', 'Para el día', 'Motivo', 'Estado', 'Monto'], suyas.map(x => [fDiaHora(x.t), x.clase === 'libre' ? 'Día libre' : 'Adelanto',

/* ===================== SOLICITUDES: adelantos y días libres (solo supervisión) =====================
   La app manda   'Solicitud' {clase: adelanto|libre, sid, motivo, fecha}
   Supervisión    'Respuesta' {sid, estado: aprobado|rechazado}
   Adelanto aprobado → el guardia escribe lo que recibió: 'Solicitud' {clase: monto, sid, monto}
   Supervisión    'Respuesta' {sid, estado: confirmado|no_entregado, monto}
   Solo lo CONFIRMADO cuenta como adelanto entregado. */
const SOL = {lista:[], gen:0, cargado:false};
const SOL_DIAS = 120;

function bsTxt(v){ const n = +v; if(!isFinite(n)) return '-'; return 'Bs ' + (Number.isInteger(n) ? n : n.toFixed(2)); }
function diaLibreTxt(ymd){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(ymd || ''); if(!m) return ymd || ''; return new Date(+m[1], +m[2]-1, +m[3]).toLocaleDateString('es',{weekday:'long',day:'2-digit',month:'long'}); }

async function leerSolicitudes(){
  const desde = enc(new Date(Date.now() - SOL_DIAS*864e5).toISOString());
  const rows = await paginas('eventos?select=tipo,edificio,guardia,detalle,created_at&tipo=in.(Solicitud,Respuesta)&created_at=gte.' + desde + '&order=created_at.asc');
  const porSid = new Map(), montos = new Map(), resp = [];
  for(const e of rows){
    const d = detalleDe(e), sid = String(d.sid || ''); if(!sid) continue;
    if(e.tipo === 'Respuesta'){ resp.push({sid, d, t:horaReal(e)}); continue; }
    if(d.clase === 'monto'){ montos.set(sid, {monto:+d.monto, t:horaReal(e)}); continue; }
    if(d.clase !== 'adelanto' && d.clase !== 'libre') continue;
    porSid.set(sid, {sid, ed:e.edificio, clase:d.clase, guardia:String(e.guardia || ''), ci:String(d.guard_ci || ''),
      bloque:String(d.bloque || ''), motivo:String(d.motivo || ''), fecha:String(d.fecha || ''), t:horaReal(e),
      estado:'pendiente', montoGuardia:null, monto:null, cuandoResp:null});
  }
  for(const [sid, m] of montos){ const x = porSid.get(sid); if(x) x.montoGuardia = m.monto; }
  resp.sort((a,b) => a.t - b.t);
  for(const r of resp){
    const x = porSid.get(r.sid); if(!x) continue;
    if(!['aprobado','rechazado','confirmado','no_entregado'].includes(r.d.estado)) continue;
    x.estado = r.d.estado; x.cuandoResp = r.t;
    if(r.d.estado === 'confirmado') x.monto = isFinite(+r.d.monto) ? +r.d.monto : x.montoGuardia;
  }
  for(const x of porSid.values()) if(x.clase === 'adelanto' && x.estado === 'aprobado' && x.montoGuardia != null) x.estado = 'por_confirmar';
  return [...porSid.values()].sort((a,b) => b.t - a.t);
}

const porAtender = x => x.estado === 'pendiente' || x.estado === 'por_confirmar';

/* Número en el botón "Guardias" de la barra de abajo */
function pintarAvisoSol(){
  const b = document.querySelector('#bnav button[data-v="sol"]'); if(!b) return;
  const n = SOL.lista.filter(porAtender).length;
  let s = b.querySelector('.solN');
  if(!n){ if(s) s.remove(); return; }
  if(!s){ s = document.createElement('span'); s.className = 'solN'; b.style.position = 'relative'; b.appendChild(s); }
  s.textContent = n > 9 ? '9+' : n;
}

async function cargarSolicitudes(){
  const mio = ++SOL.gen;
  try{
    const l = await leerSolicitudes();
    if(mio !== SOL.gen) return;
    SOL.lista = l; SOL.cargado = true;
  }catch(e){
    if(mio !== SOL.gen) return;
    const box = $('#v-sol'); if(box && vistaActual === 'sol') box.innerHTML = `<div class="err">No se pudieron leer las solicitudes (${esc(e.message)}).</div>`;
    return;
  }
  pintarAvisoSol();
  /* con los pedidos ya leídos, las tarjetas de guardias muestran permisos y adelantos */
  if(GU.datos && $('#v-gua').innerHTML.trim()) pintarGuardias();
  if(typeof vistaActual !== 'undefined' && vistaActual === 'sol') pintarSolicitudes();
}

const SOL_EST = {pendiente:['Pendiente','warn'], aprobado:['Aprobado','ok'], por_confirmar:['Por confirmar','warn'],
  confirmado:['Entregado','ok'], rechazado:['No aprobado',''], no_entregado:['No entregado','']};
const fechaLarga = d => d.toLocaleDateString('es',{weekday:'long', day:'numeric', month:'long'});
function itemSol(x, conEdificio){
  const libre = x.clase === 'libre';
  const dia = /^\d{4}-\d{2}-\d{2}$/.test(x.fecha) ? fechaLarga(new Date(x.fecha + 'T12:00:00')) : '';
  const que = libre ? 'Día libre: ' + (dia || 'sin fecha') : 'Adelanto de sueldo' + (dia ? ' para el ' + dia : '');
  const donde = [conEdificio ? x.ed : '', x.bloque].filter(Boolean).join(', ');
  const pedido = 'Pedido el ' + fechaLarga(x.t) + ', ' + hm(x.t);
  const b = (est, txt, cls = 'btn') => `<button class="${cls}" data-sact="${est}" data-sid="${esc(x.sid)}">${txt}</button>`;
  let [et, cl] = SOL_EST[x.estado] || ['', ''];
  if(x.estado === 'aprobado' && !libre) et = 'Aprobado, falta el monto';
  if(x.estado === 'confirmado') et = 'Entregado ' + bsTxt(x.monto);
  let pie = '';
  if(x.estado === 'pendiente') pie = `<div class="acts">${b('rechazado', 'Denegar')}${b('aprobado', 'Aceptar', 'btn prim')}</div>`;
  else if(x.estado === 'por_confirmar') pie = `<div class="sconf"><label class="field"><span>El guardia dice que recibió ${esc(bsTxt(x.montoGuardia))}. Monto entregado</span>
      <input type="number" inputmode="decimal" min="0" step="0.5" value="${esc(x.montoGuardia)}" data-smonto="${esc(x.sid)}"></label>
      <div class="acts">${b('no_entregado', 'No se lo di')}${b('confirmado', 'Confirmar', 'btn prim')}</div></div>`;
  const cambiar = x.estado === 'aprobado' ? b('rechazado', 'Cambiar a denegado', 'lnkbtn') : x.estado === 'rechazado' ? b('aprobado', 'Cambiar a aceptado', 'lnkbtn') : '';
  return `<div class="srow">
    <div class="sfila"><div class="t"><b>${esc(x.guardia)}</b>${donde ? `<small>${esc(donde)}</small>` : ''}</div><span class="pill ${cl}">${esc(et)}</span></div>
    <div class="sque">${esc(que)}</div>
    ${x.motivo ? `<div class="smot">Motivo: ${esc(x.motivo)}</div>` : ''}
    <div class="sped"><span>${esc(pedido)}</span>${cambiar}</div>
    ${pie}<div class="sMsg" data-smsg="${esc(x.sid)}"></div></div>`;
}
const SOLV = {filtro:'pend'};
function pintarSolicitudes(){
  const box = $('#v-sol'); if(!box || vistaActual !== 'sol') return;
  if(!SOL.cargado){ if(!box.innerHTML.trim()) box.innerHTML = '<div class="carga" role="status" aria-label="Cargando"></div>'; return; }
  const hoy = new Date(), nomMes = hoy.toLocaleDateString('es',{month:'long'});
  const esteMes = d => d.getFullYear() === hoy.getFullYear() && d.getMonth() === hoy.getMonth();
  const atender = SOL.lista.filter(porAtender);
  const resp = SOL.lista.filter(x => !porAtender(x)).sort((a, b) => (b.cuandoResp || b.t) - (a.cuandoResp || a.t));
  const adel = SOL.lista.filter(x => x.clase === 'adelanto' && x.estado === 'confirmado' && esteMes(x.cuandoResp || x.t));
  const total = adel.reduce((a, x) => a + (x.monto || 0), 0);
  const libres = SOL.lista.filter(x => x.clase === 'libre' && x.estado === 'aprobado' && /^\d{4}-\d{2}-\d{2}$/.test(x.fecha) && esteMes(new Date(x.fecha + 'T12:00:00')));
  const f = SOLV.filtro;
  const lista = f === 'pend' ? atender : resp.slice(0, 80);
  const vacio = f === 'pend' ? 'No hay peticiones por responder.' : 'Todavía no respondiste ninguna petición.';
  box.innerHTML = `
    <div class="shead" style="margin-top:0"><div class="h2">Resumen de ${esc(nomMes)}</div><div class="sder">${info('Se muestran los pedidos de todos los edificios, sin elegir uno. Aquí llegan los pedidos de adelanto y de día libre de los guardias de todos los edificios. Un adelanto cuenta recién cuando confirmas el monto que entregaste.', 'Cómo funciona')}</div></div>
    <div class="kpis">
      <div class="kpi"><b class="${atender.length ? 'warnT' : ''}">${atender.length}</b><small>Por responder</small></div>
      <div class="kpi"><b>${esc(bsTxt(total))}</b><small>Adelantos</small></div>
      <div class="kpi"><b>${libres.length}</b><small>Días libres</small></div>
    </div>
    <div class="segm" id="solF">${[['pend', 'Por responder'], ['resp', 'Respondidas']].map(([k, t]) => `<button class="${f === k ? 'on' : ''}" data-f="${k}">${t}${k === 'pend' && atender.length ? ' (' + atender.length + ')' : ''}</button>`).join('')}</div>
    <div class="lista slista">${lista.length ? lista.map(x => itemSol(x, true)).join('') : `<div class="empty">${vacio}</div>`}</div>`;
}

async function historialSolGuardia(ed, g, mes){
  const box = () => $('#gSolG');
  SOL.ficha = {ed, g, mes};
  try{ if(!SOL.cargado) await cargarSolicitudes(); }catch(_){}
  if(!box()) return;
  const suyas = SOL.lista.filter(x => x.ed === ed && (x.ci ? x.ci === g.ci : x.guardia === g.nombre));
  if(!suyas.length){ box().innerHTML = '<div class="lista"><div class="empty">No pidió adelantos ni días libres.</div></div>'; return; }
  const delMes = suyas.filter(x => x.clase === 'adelanto' && x.estado === 'confirmado' && x.t.getFullYear() === mes.y && x.t.getMonth() === mes.m);
  const total = delMes.reduce((a, x) => a + (x.monto || 0), 0);
  box().innerHTML = `<div class="lista slista"><div class="srow"><div class="sfila"><div class="t"><b>Adelantos de ${esc(mesTxt(mes))}</b><small>${delMes.length} entregado${delMes.length === 1 ? '' : 's'}</small></div><div class="v"><b>${esc(bsTxt(total))}</b></div></div></div>`
    + suyas.map(x => itemSol(x, false)).join('') + '</div>';
}

async function responderSol(sid, estado){
  const x = SOL.lista.find(s => s.sid === sid); if(!x) return;
  const msg = t => { const m = document.querySelector(`[data-smsg="${CSS.escape(sid)}"]`); if(m) m.innerHTML = t ? `<div class="msg bad">${esc(t)}</div>` : ''; };
  const det = {sid, estado, clase:x.clase, guardia:x.guardia, ci:x.ci, fecha:x.fecha};
  if(estado === 'confirmado'){
    const inp = document.querySelector(`[data-smonto="${CSS.escape(sid)}"]`);
    const v = parseFloat(String(inp ? inp.value : x.montoGuardia).replace(',', '.'));
    if(!(v > 0)) return msg('Escribe el monto que le diste.');
    det.monto = v;
  }
  if(estado === 'no_entregado' && !confirm(`¿Marcar que NO le diste ${bsTxt(x.montoGuardia)} a ${x.guardia}? No contará como adelanto.`)) return;
  document.querySelectorAll(`[data-sid="${CSS.escape(sid)}"]`).forEach(b => b.disabled = true);
  try{
    await apiEscribir('POST', 'eventos', nuevoEvento('Respuesta', x.ed, 'Supervisión', det));
    await cargarSolicitudes();
    if($('#gSolG') && SOL.ficha) historialSolGuardia(SOL.ficha.ed, SOL.ficha.g, SOL.ficha.mes);
  }catch(e){
    msg('No se pudo guardar: ' + e.message);
    document.querySelectorAll(`[data-sid="${CSS.escape(sid)}"]`).forEach(b => b.disabled = false);
  }
}

$('#panel').addEventListener('click', ev => {

const Cobros = (() => {

    correo:'osirissecurity.bo@gmail.com', web:'osirissecurity.com.bo', banco:'', cuenta:'', titular:'', pie:'',

  const MESES_C = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const C = {cargado:false, sub:'notas', empresa:{...EMPRESA_DEF}, clientes:new Map(), notas:[], recibos:[], edificios:[], fEd:'', fMes:'', caja:null};

  /* ---------- utilidades ---------- */
  const num4 = n => String(n).padStart(4, '0');
  const bs = n => (Math.round((+n || 0) * 100) / 100).toLocaleString('es-BO', {minimumFractionDigits:2, maximumFractionDigits:2});
  const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const fechaLarga = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? `${+m[3]} de ${MESES_C[+m[2] - 1]} de ${m[1]}` : (s || ''); };
  const fechaCorta = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? `${m[3]}/${m[2]}/${m[1]}` : (s || ''); };
  const fechaMed = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? `${+m[3]} ${MESES_C[+m[2] - 1].slice(0, 3)} ${m[1]}` : (s || ''); };
  const periodoTxt = s => { const m = /^(\d{4})-(\d{2})$/.exec(s || ''); return m ? MESES_C[+m[2] - 1].replace(/^./, c => c.toUpperCase()) + ' ' + m[1] : (s || ''); };
  const mesDe = s => String(s || '').slice(0, 7);
  const masDias = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
  const evento = (clase, datos) => nuevoEvento('Config', MON, 'Supervisión', {...datos, clase});
  const guardarEv = (clase, datos) => apiEscribir('POST', 'eventos', evento(clase, datos));
  const borrarNum = (clase, n) => apiEscribir('DELETE', 'eventos?tipo=eq.Config&edificio=eq.' + MON + '&detalle->>clase=eq.' + clase + '&detalle->>numero=eq.' + n);
  const campo = (id, label, valor = '', extra = '') => `<label class="field"><span>${esc(label)}</span><input id="${id}" value="${esc(valor)}" ${extra}></label>`;
  const hoja = html => { $('#panel').innerHTML = `<button class="btn close" id="cerrar">Cerrar</button>${html}`; $('#sheet').classList.add('on'); };
  const cerrarHoja = () => $('#sheet').classList.remove('on');

  function letras(n){
    const U = ['','UNO','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE','DIEZ','ONCE','DOCE','TRECE','CATORCE','QUINCE',
      'DIECISÉIS','DIECISIETE','DIECIOCHO','DIECINUEVE','VEINTE','VEINTIUNO','VEINTIDÓS','VEINTITRÉS','VEINTICUATRO','VEINTICINCO',
      'VEINTISÉIS','VEINTISIETE','VEINTIOCHO','VEINTINUEVE'];
    const D = ['','','','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'];
    const CC = ['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];
    const cien = x => { if(x === 100) return 'CIEN'; const c = Math.floor(x / 100), r = x % 100; let t = CC[c];
      if(r) t += (t ? ' ' : '') + (r < 30 ? U[r] : D[Math.floor(r / 10)] + (r % 10 ? ' Y ' + U[r % 10] : '')); return t; };
    const apo = t => t.replace(/VEINTIUNO$/, 'VEINTIÚN').replace(/UNO$/, 'UN');
    const ent = Math.floor(Math.round(n * 100) / 100), cts = Math.round((n - ent) * 100);
    let t = '';
    const mill = Math.floor(ent / 1e6), miles = Math.floor((ent % 1e6) / 1000), resto = ent % 1000;
    if(mill) t += (mill === 1 ? 'UN MILLÓN' : apo(cien(mill)) + ' MILLONES') + ' ';
    if(miles) t += (miles === 1 ? 'MIL' : apo(cien(miles)) + ' MIL') + ' ';
    if(resto) t += cien(resto);
    return `${(t.trim() || 'CERO')} ${String(cts).padStart(2, '0')}/100 BOLIVIANOS`;
  }

  /* jsPDF solo cuando hace falta */
  let cargaPdf = null;
  function pdfListo(){
    if(window.jspdf) return Promise.resolve(true);

  /* ---------- datos ---------- */
  async function cargar(){
    const out = await paginas('eventos?select=detalle,created_at&tipo=eq.Config&edificio=eq.' + MON

      else if(d.clase === 'cob_recibo' && d.numero) recibos.set(String(d.numero), d);
    }

      const r = await api('eventos?select=edificio&tipo=eq.Config&order=created_at.desc&limit=2000');
      C.edificios = [...new Set(r.map(x => x.edificio).filter(x => x && x !== '*' && !x.startsWith('__')))].sort((a, b) => a.localeCompare(b, 'es'));
    }catch(_){}

  const sigRecibo = () => C.recibos.reduce((m, r) => Math.max(m, +r.numero || 0), 0) + 1;
  const recibosDe = num => C.recibos.filter(r => r.nota && +r.nota === +num);
  const pagado = n => recibosDe(n.numero).reduce((a, r) => a + (+r.monto || 0), 0);
  const saldo = n => Math.max(0, Math.round(((+n.total || 0) - pagado(n)) * 100) / 100);
  const estado = n => { const p = pagado(n); return p >= n.total - 0.005 ? ['Pagada', 'ok'] : p > 0 ? ['Parcial', 'warn'] : ['Pendiente', '']; };

  /* ---------- PDF ---------- */
  const ROJO = [178, 24, 30], TINTA = [24, 28, 36], GRIS = [104, 112, 124], LINEA = [222, 226, 232], SUAVE = [247, 248, 250];

  const HOJAS = [['carta','Carta',215.9,279.4], ['oficio','Oficio',215.9,330.2], ['media','Media carta',215.9,139.7], ['personal','Personalizado']];
  function hojaDims(clave, e){
    const h = HOJAS.find(x => x[0] === clave);
    if(h && h[2]) return [h[2], h[3]];
    const w = +e.hojaW, al = +e.hojaH;

  const docDe = ([w, h]) => nuevoDoc([Math.min(w, h), Math.max(w, h)], w > h ? 'landscape' : 'portrait');
  const nuevoDoc = (formato, orientation = 'portrait') => { const d = new window.jspdf.jsPDF({unit:'mm', format:formato, orientation}); d.setFont('helvetica', 'normal'); return d; };
  /* Encabezado: franja roja, logo, datos de Osiris; título con el número a la derecha
     y una franja de datos (fecha, mes…) en celdas iguales separadas por líneas finas */
  /* Encabezado sobrio: logo y datos de Osiris; título y número del mismo tamaño;

  const COL = 74;   // ancho de la columna de datos de la derecha
  function encabezado(doc, W, e, titulo, numero, filas){

    y = Math.max(y, 12 + 36 * 226 / 480) + 11;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(14);
    doc.setTextColor(...TINTA); doc.text(titulo, M, y, {charSpace:0.6});
    doc.setTextColor(...ROJO); doc.text('N° ' + numero, R, y, {align:'right'});
    y += 4; doc.setDrawColor(...TINTA); doc.setLineWidth(0.35); doc.line(M, y, R, y);

      doc.setFont('helvetica', 'bold'); doc.setFontSize(fuerte ? 11 : 9.5); doc.setTextColor(...TINTA); doc.text(v, R, yd, {align:'right'});

  }
  function etiqueta(doc, txt, x, y){ doc.setFont('helvetica', 'normal'); doc.setFontSize(7); doc.setTextColor(...GRIS); doc.text(txt.toUpperCase(), x, y, {charSpace:0.4}); doc.setTextColor(...TINTA); }
  function firmas(doc, W, y, e, conFirma, textoCliente){

  function leyenda(doc, W, H, e){

  /* Forma de pago: una sola, en texto limpio (sin recuadros ni rellenos) */
  function formasPago(doc, W, y, s){

      : m === 'cheque' ? [['A la orden de', e.chequeA || titular]]

      doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...GRIS);
      doc.text('Escanea el código con la app de tu banco.', M + lado + 6, y + 4);

    }

      doc.setTextColor(...TINTA); doc.text(String(v), M + (k ? 30 : 0), yq); yq += 4.8;

  }
  function pdfNota(s){
    const [W, H] = s.hoja || [215.9, 279.4], M = 16, R = W - M, e = s.empresa, c = s.cliente || {};
    const doc = docDe([W, H]), anchoIzq = R - M - COL - 10;

    doc.setTextColor(...TINTA); y = Math.max(y, h.yDer) + 9;

    doc.text('P. UNIT. (Bs)', X.pu, y + 4.5, {align:'right', charSpace:0.4}); doc.text('IMPORTE (Bs)', X.sub, y + 4.5, {align:'right', charSpace:0.4});

    doc.setFont('helvetica', 'bold'); doc.setFontSize(12.5); doc.setTextColor(...TINTA); doc.text(bs(s.total), X.sub, y, {align:'right'});
    doc.setDrawColor(...TINTA); doc.setLineWidth(0.35); doc.line(X.pu - 22, y + 3, R, y + 3);
    y += 13;

    doc.setFont('helvetica', 'normal'); doc.setFontSize(10);

    const bloque = (tit, txt) => { if(!txt) return; if(tit){ etiqueta(doc, tit, M, y); y += 5; } doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);

  function pdfRecibo(r){
    const [W, H] = r.hoja || [215.9, 139.7], M = 16, R = W - M, e = r.empresa;

  let PREV_URL = null, PREV_T = null;

  /* ---------- pantalla principal ---------- */

  /* filtros (desplegables) compartidos por Notas y Recibos */

  /* cifras compactas: sin centavos si son cero (el "Bs" va en la etiqueta) */

  const kpis = l => `<div class="kpis">${l.map(([v, t]) => `<div class="kpi"><b>${v}</b><small>${t}</small></div>`).join('')}</div>`;

  /* --- Notas --- */
  function vNotas(c){

  function totalDe(items){ return items.reduce((a, i) => a + (+i.cant || 0) * (+i.precio || 0), 0); }
  function formNota(){
    const lista = clientes(), hoy = new Date(), per = hoy.getFullYear() + '-' + String(hoy.getMonth() + 1).padStart(2, '0');
    const meses = []; for(let i = -9; i <= 2; i++){ const x = new Date(hoy.getFullYear(), hoy.getMonth() + i, 1); meses.push(x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0')); }
    const cli = cid => C.clientes.get(cid);
    const lineaBase = (cid, p) => ({detalle: `${(cli(cid) && cli(cid).concepto) || CONCEPTO_DEF}, ${periodoTxt(p)}`, cant: 1, precio: cli(cid) && cli(cid).monto !== '' ? +cli(cid).monto : ''});
    const n = {cid: (C.fEd && lista.find(x => x.nombre === C.fEd) || lista[0]).cid, numero: sigNota(), fecha: ymd(hoy), periodo: per, obs: '', firma: true, metodos: (C.empresa.metodos || []).slice(0, 1)};
    n.items = [lineaBase(n.cid, per)];
    hoja(`<h2>Nueva nota</h2>
      <label class="field"><span>Edificio</span><select id="nCli">${lista.map(x => `<option value="${esc(x.cid)}" ${x.cid === n.cid ? 'selected' : ''}>${esc(x.nombre)}</option>`).join('')}</select></label>
      <div class="dos"><label class="field"><span>N°</span><input id="nNum" inputmode="numeric" value="${n.numero}"></label>
        <label class="field"><span>Fecha</span><input id="nFec" type="date" value="${n.fecha}"></label></div>
<div class="dos"><label class="field"><span>Mes</span><select id="nPer">${meses.reverse().map(p => `<option value="${p}" ${p === per ? 'selected' : ''}>${esc(periodoTxt(p))}</option>`).join('')}</select></label><label class="field"><span>Hoja</span><select id="nHoja">${HOJAS.map(([k, t]) => `<option value="${k}" ${k === (C.empresa.hojaNota || 'carta') ? 'selected' : ''}>${t}</option>`).join('')}</select></label></div>
      <div class="h2">Detalle</div><div id="nItems"></div>
      <button class="btn" id="nMas" style="width:100%;height:44px">${icono('mas1', 15)} Agregar línea</button>
      <div class="card" style="margin-top:12px"><div class="total"><span>Total</span><span id="nTot"></span></div><div class="lit" id="nLit"></div></div>
      <details class="info"><summary>${icono('mas1', 14)} Observaciones</summary><div><textarea id="nObs" placeholder="Opcional"></textarea></div></details>
      <div class="h2">Forma de pago</div>
      <div class="chips" id="nMet" style="margin-top:0">${[['', 'Ninguna'], ...METODOS].map(([k, t]) => `<button data-met="${k}" class="tab${((C.empresa.metodos || [])[0] || '') === k ? ' on' : ''}">${t}</button>`).join('')}</div>
      ${(C.empresa.metodos || []).includes('qr') && !C.empresa.qr ? '' : ''}
      <label class="chk" style="border:0"><input type="checkbox" id="nFir" checked> Con firma y sello</label>
      <div id="nMsg"></div>
      <button class="btn prim" id="nPdf">Generar PDF</button>
      <div class="h2">Vista previa</div><div class="prevCaja" id="nPrev"></div>`);
    const pintarItems = () => { $('#nItems').innerHTML = n.items.map((it, i) => `<div class="item" data-i="${i}">
        <label class="field det"><span>Concepto</span><input data-k="detalle" value="${esc(it.detalle)}"></label>
        <label class="field"><span>Cantidad</span><input data-k="cant" inputmode="decimal" value="${esc(it.cant)}"></label>
        <label class="field"><span>Precio (Bs)</span><input data-k="precio" inputmode="decimal" value="${esc(it.precio)}" placeholder="0.00"></label>
        <button class="btn x" data-quitar="${i}" aria-label="Quitar línea" ${n.items.length < 2 ? 'disabled' : ''}>✕</button></div>`).join(''); };
    const snap = () => {
      const e = {...C.empresa}, items = n.items.filter(i => String(i.detalle).trim() || +i.precio).map(i => ({detalle:String(i.detalle).trim(), cant:+i.cant || 0, precio:+i.precio || 0}));
      const plazo = parseInt(e.plazo, 10);
      const metodos = n.metodos.filter(m => m !== 'qr' || e.qr);   // QR solo si hay imagen cargada
      const qr = metodos.includes('qr') ? e.qr : ''; delete e.qr;     // la imagen va una vez, no dentro de "empresa"
      return {numero:+n.numero, cid:n.cid, cliente:{...cli(n.cid)}, empresa:e, fecha:n.fecha, periodo:n.periodo, items, obs:String(n.obs || '').trim(),
        total:totalDe(items), firma:n.firma, vence: plazo > 0 && n.fecha ? masDias(n.fecha, plazo) : '', metodos, qr, hoja: hojaDims($('#nHoja') ? $('#nHoja').value : e.hojaNota, C.empresa)};
    };
    const refrescar = () => { const t = totalDe(n.items); $('#nTot').textContent = 'Bs ' + bs(t); $('#nLit').textContent = letras(t); previa($('#nPrev'), () => pdfNota(snap())); };
    pintarItems(); pdfListo().then(refrescar); refrescar();
    $('#nCli').onchange = () => { n.cid = $('#nCli').value; n.items = [lineaBase(n.cid, n.periodo)]; pintarItems(); refrescar(); };
    $('#nPer').onchange = () => { const viejo = periodoTxt(n.periodo); n.periodo = $('#nPer').value;
      n.items.forEach(it => { if(it.detalle.endsWith(viejo)) it.detalle = it.detalle.slice(0, -viejo.length) + periodoTxt(n.periodo); }); pintarItems(); refrescar(); };
    $('#nNum').oninput = () => { n.numero = $('#nNum').value.replace(/\D/g, ''); refrescar(); };
    $('#nFec').oninput = () => { n.fecha = $('#nFec').value; refrescar(); };
    $('#nObs').oninput = () => { n.obs = $('#nObs').value; refrescar(); };
    $('#nFir').onchange = () => { n.firma = $('#nFir').checked; refrescar(); };
    $('#nHoja').onchange = refrescar;
    $('#nMet').onclick = ev => { const b = ev.target.closest('[data-met]'); if(!b) return;
      $('#nMet').querySelectorAll('[data-met]').forEach(x => x.classList.toggle('on', x === b));
      n.metodos = b.dataset.met ? [b.dataset.met] : []; refrescar(); };
    $('#nItems').addEventListener('input', e => { const f = e.target.closest('.item'); if(!f || !e.target.dataset.k) return;
      const it = n.items[+f.dataset.i], k = e.target.dataset.k; it[k] = k === 'detalle' ? e.target.value : e.target.value.replace(',', '.'); refrescar(); });
    $('#nItems').addEventListener('click', e => { const b = e.target.closest('[data-quitar]'); if(b){ n.items.splice(+b.dataset.quitar, 1); pintarItems(); refrescar(); } });
    $('#nMas').onclick = () => { n.items.push({detalle:'', cant:1, precio:''}); pintarItems(); refrescar(); };
    $('#nPdf').onclick = async () => {
      const m = t => $('#nMsg').innerHTML = `<div class="msg bad">${esc(t)}</div>`;
      if(!window.jspdf) return m('Sin conexión: no se pudo cargar el generador de PDF.');
      const s = snap();
      if(!(s.numero > 0)) return m('Escribe el número.');
      if(!s.items.length || !(s.total > 0)) return m('Pon al menos un concepto con su precio.');
      const usada = C.notas.find(x => +x.numero === s.numero);
      if(usada && usada.cid !== s.cid) return m(`El N° ${num4(s.numero)} ya es de ${usada.cliente ? usada.cliente.nombre : 'otra nota'}.`);
      const sh = compartir(pdfNota(s), nombreNota(s));
      try{
        await borrarNum('cob_nota', s.numero); await guardarEv('cob_nota', s);
        C.notas = [s, ...C.notas.filter(x => +x.numero !== s.numero)].sort((a, b) => b.numero - a.numero);
        cerrarHoja(); repintar();
      }catch(e){ m('El PDF se generó, pero no se guardó: ' + e.message); }
      if(sh) await sh;
    };
  }

  /* --- Recibos --- */
  function vRecibos(c){
    const meses = [...new Set(C.recibos.map(r => mesDe(r.fecha)))].sort().reverse();
    const ver = C.recibos.filter(r => (!C.fEd || (r.cliente && r.cliente.nombre === C.fEd)) && (!C.fMes || mesDe(r.fecha) === C.fMes));
    const cobrado = ver.reduce((a, r) => a + (+r.monto || 0), 0);
    const pend = C.notas.filter(n => saldo(n) > 0 && (!C.fEd || (n.cliente && n.cliente.nombre === C.fEd)));
    c.innerHTML = `${filtros(meses)}
      ${kpis([[String(ver.length), 'Recibos'], [bsK(cobrado), 'Cobrado · Bs'], [bsK(pend.reduce((a, n) => a + saldo(n), 0)), 'Por cobrar · Bs']])}
      <div class="fab"><button class="btn prim" id="rNuevo">${icono('mas1', 16)} Nuevo recibo</button></div>
      <div class="lista">${ver.length ? ver.map(r => `<div class="it" data-rec="${r.numero}"><div class="t"><b>N° ${num4(r.numero)} · ${esc(r.cliente ? r.cliente.nombre : r.de)}</b>
          <small>${esc(fechaCorta(r.fecha))} · ${esc(r.forma)}${r.nota ? ' · Nota ' + num4(r.nota) : ''}</small></div><div class="v">Bs ${bs(r.monto)}</div></div>`).join('')
        : '<div class="empty">Sin recibos.</div>'}</div>`;
    enganchaFiltros(c);
    c.querySelector('#rNuevo').onclick = () => formRecibo(null);
    c.querySelectorAll('[data-rec]').forEach(el => el.onclick = () => verRecibo(C.recibos.find(r => +r.numero === +el.dataset.rec)));
  }
  function verRecibo(r){
    hoja(`<h2>Recibo N° ${num4(r.numero)}</h2><div class="sub">${esc(r.cliente ? r.cliente.nombre : r.de)} · ${esc(fechaLarga(r.fecha))}</div>
      ${kpis([[bsK(r.monto), 'Monto · Bs'], [esc(r.forma.split(' ')[0]), 'Forma'], [r.nota ? num4(r.nota) : 'Sin nota', 'Nota']])}
      <button class="btn prim" id="vPdf">Ver PDF</button><div class="h2">Vista previa</div><div class="prevCaja" id="vPrev"></div>`);
    pdfListo().then(ok => { if(ok) previa($('#vPrev'), () => pdfRecibo(r)); });
    $('#vPdf').onclick = () => { if(window.jspdf) compartir(pdfRecibo(r), nombreRecibo(r)); };
  }
  function formRecibo(nota){
    const pend = C.notas.filter(n => saldo(n) > 0);
    const r = {numero: sigRecibo(), fecha: ymd(new Date()), forma: FORMAS[0], ref: '', firma: true, nota: nota ? nota.numero : (pend[0] ? pend[0].numero : ''), cid: ''};
    const aplicarNota = () => {
      const n = C.notas.find(x => +x.numero === +r.nota);
      if(n){ const c = n.cliente || {}; r.cid = n.cid; r.monto = saldo(n) || n.total; r.de = c.razon || c.nombre || '';
        r.concepto = `Pago de la nota de cobranza N° ${num4(n.numero)}: ${n.items.map(i => i.detalle).join('; ')}`; }
      else { const c = clientes()[0] || {}; r.cid = c.cid || ''; r.monto = c.monto || ''; r.de = c.razon || c.nombre || ''; r.concepto = (c.concepto || CONCEPTO_DEF); }
    };
    aplicarNota();
    const opNotas = pend.map(n => `<option value="${n.numero}" ${+n.numero === +r.nota ? 'selected' : ''}>N° ${num4(n.numero)} · ${esc(n.cliente ? n.cliente.nombre : '')} · saldo Bs ${bs(saldo(n))}</option>`).join('');
    hoja(`<div id="rForm"><h2>Nuevo recibo</h2>
      <label class="field"><span>Nota</span><select id="rNota">${opNotas}<option value="" ${r.nota ? '' : 'selected'}>Sin nota (otro pago)</option></select></label>
      <label class="field" id="rCliBox" ${r.nota ? 'hidden' : ''}><span>Cliente</span><select id="rCli">${clientes().map(c => `<option value="${esc(c.cid)}">${esc(c.nombre)}</option>`).join('')}</select></label>
      <div class="dos"><label class="field"><span>N°</span><input id="rNum" inputmode="numeric" value="${r.numero}"></label>
        <label class="field"><span>Fecha</span><input id="rFec" type="date" value="${r.fecha}"></label></div>
      <div class="dos"><label class="field"><span>Monto (Bs)</span><input id="rMon" inputmode="decimal" value="${esc(r.monto)}"></label>
        <label class="field"><span>Forma de pago</span><select id="rFor">${FORMAS.map(f => `<option>${f}</option>`).join('')}</select></label></div>
      <div class="dos"><label class="field"><span>Referencia</span><input id="rRef" placeholder="Opcional"></label><label class="field"><span>Hoja</span><select id="rHoja">${HOJAS.map(([k, t]) => `<option value="${k}" ${k === (C.empresa.hojaRecibo || 'media') ? 'selected' : ''}>${t}</option>`).join('')}</select></label></div>
      <details class="info"><summary>${icono('mas1', 14)} Detalle</summary><div>
        <label class="field"><span>Recibí de</span><input id="rDe" value="${esc(r.de)}"></label>
        <label class="field"><span>Por concepto de</span><textarea id="rCon">${esc(r.concepto)}</textarea></label></div></details>
      <label class="chk" style="border:0"><input type="checkbox" id="rFir" checked> Con firma y sello</label>
      <div id="rMsg"></div>
      <button class="btn prim" id="rOk">Generar recibo</button>
      <div class="h2">Vista previa</div><div class="prevCaja" id="rPrev"></div></div>`);
    const snap = () => {
      const n = C.notas.find(x => +x.numero === +r.nota), cli = C.clientes.get(r.cid) || (n && n.cliente) || {};
      const monto = +String(r.monto).replace(',', '.') || 0;
      return {numero:+r.numero, nota:n ? n.numero : '', cid:r.cid, cliente:{...cli}, empresa:{...C.empresa}, fecha:r.fecha, monto,
        forma:r.forma, ref:r.ref, de:r.de, concepto:r.concepto, firma:r.firma, saldo: n ? Math.max(0, Math.round((saldo(n) - monto) * 100) / 100) : 0,
        hoja: hojaDims($('#rHoja') ? $('#rHoja').value : C.empresa.hojaRecibo, C.empresa)};
    };
    const leer = () => { r.numero = $('#rNum').value.replace(/\D/g, ''); r.fecha = $('#rFec').value; r.monto = $('#rMon').value; r.forma = $('#rFor').value;
      r.ref = $('#rRef').value.trim(); r.de = $('#rDe').value.trim(); r.concepto = $('#rCon').value.trim(); r.firma = $('#rFir').checked; };
    const prev = () => { leer(); previa($('#rPrev'), () => pdfRecibo(snap())); };
    $('#rNota').onchange = () => { r.nota = $('#rNota').value; $('#rCliBox').hidden = !!r.nota; if(!r.nota) r.cid = $('#rCli').value; aplicarNota();
      if(!r.nota){ const c = C.clientes.get($('#rCli').value) || {}; r.cid = c.cid || ''; r.de = c.razon || c.nombre || ''; r.monto = c.monto || ''; r.concepto = c.concepto || CONCEPTO_DEF; }
      $('#rMon').value = r.monto; $('#rDe').value = r.de; $('#rCon').value = r.concepto; prev(); };
    $('#rCli').onchange = () => { const c = C.clientes.get($('#rCli').value) || {}; r.cid = c.cid || ''; $('#rDe').value = c.razon || c.nombre || ''; $('#rMon').value = c.monto || ''; $('#rCon').value = c.concepto || CONCEPTO_DEF; prev(); };
    $('#rForm').addEventListener('input', prev);
    $('#rFir').onchange = prev;
    pdfListo().then(prev);
    $('#rOk').onclick = async () => {
      leer(); const s = snap();
      const m = t => $('#rMsg').innerHTML = `<div class="msg bad">${esc(t)}</div>`;
      if(!window.jspdf) return m('Sin conexión: no se pudo cargar el generador de PDF.');
      if(!(s.numero > 0)) return m('Escribe el número.');
      if(!(s.monto > 0)) return m('Escribe el monto.');
      if(!s.de) return m('Escribe de quién recibiste el pago.');
      const usado = C.recibos.find(x => +x.numero === s.numero);
      if(usado && (usado.cid !== s.cid || +usado.nota !== +s.nota)) return m(`El recibo N° ${num4(s.numero)} ya se usó.`);
      const sh = compartir(pdfRecibo(s), nombreRecibo(s));
      try{
        await borrarNum('cob_recibo', s.numero); await guardarEv('cob_recibo', s);
        C.recibos = [s, ...C.recibos.filter(x => +x.numero !== s.numero)].sort((a, b) => b.numero - a.numero);
        cerrarHoja(); C.sub = 'recibos'; repintar();
      }catch(e){ m('El PDF se generó, pero no se guardó: ' + e.message); }
      if(sh) await sh;
    };
  }

  /* --- Clientes --- */
  function vClientes(c){
    const l = clientes();
    c.innerHTML = `<div class="fab"><button class="btn prim" id="cNuevo">${icono('mas1', 16)} Registrar edificio</button></div>
      <div class="lista">${l.length ? l.map(x => `<div class="it" data-cli="${esc(x.cid)}"><div class="t"><b>${esc(x.nombre)}</b><small>${esc(x.direccion || x.razon || 'Sin dirección')}</small></div>
        <div class="v">${x.monto !== '' && x.monto != null ? 'Bs ' + bs(x.monto) : 'Sin monto'}<small style="color:var(--mute)">al mes</small></div></div>`).join('')
        : '<div class="empty">Sin edificios.</div>'}</div>`;
    c.querySelector('#cNuevo').onclick = () => formCliente();
    c.querySelectorAll('[data-cli]').forEach(el => el.onclick = () => formCliente(C.clientes.get(el.dataset.cli)));
  }
  function formCliente(x){
    hoja(`<h2>${x ? esc(x.nombre) : 'Registrar edificio'}</h2>
      ${campo('kNom', 'Edificio', x ? x.nombre : '', 'list="kEds" autocapitalize="words"')}
      <datalist id="kEds">${C.edificios.map(e => `<option value="${esc(e)}">`).join('')}</datalist>
      <div class="dos">${campo('kMon', 'Monto mensual (Bs)', x ? x.monto : '', 'inputmode="decimal"')}${campo('kNit', 'NIT o CI', x ? x.nit : '')}</div>
      ${campo('kDir', 'Dirección', x ? x.direccion : '')}
      <details class="info"><summary>${icono('mas1', 14)} Más datos</summary><div>
        ${campo('kRaz', 'Razón social', x ? x.razon : '', 'autocapitalize="words"')}
        ${campo('kCiu', 'Ciudad', x ? x.ciudad : 'Santa Cruz de la Sierra')}
        <div class="dos">${campo('kCon', 'Contacto', x ? x.contacto : '', 'autocapitalize="words"')}${campo('kTel', 'Teléfono', x ? x.telefono : '', 'inputmode="tel"')}</div>
        ${campo('kCto', 'Concepto', x ? x.concepto : CONCEPTO_DEF)}</div></details>
      <div id="kMsg"></div>
      <div class="acts" style="margin-top:12px">${x ? '<button class="btn" id="kDel" style="color:var(--bad)">Quitar</button>' : ''}<button class="btn prim" id="kOk">Guardar</button></div>`);
    $('#kOk').onclick = async () => {
      const nombre = $('#kNom').value.trim(), monto = $('#kMon').value.trim().replace(',', '.');
      const m = t => $('#kMsg').innerHTML = `<div class="msg bad">${esc(t)}</div>`;
      if(!nombre) return m('Escribe el nombre del edificio.');
      if(monto && !(+monto >= 0)) return m('El monto debe ser un número.');
      if(!x && clientes().some(c => c.nombre.toLowerCase() === nombre.toLowerCase())) return m('Ese edificio ya está registrado.');
      const d = {cid: x ? x.cid : 'c' + Date.now().toString(36), nombre, monto: monto ? +monto : '', nit:$('#kNit').value.trim(), direccion:$('#kDir').value.trim(),
        razon:$('#kRaz').value.trim(), ciudad:$('#kCiu').value.trim(), contacto:$('#kCon').value.trim(), telefono:$('#kTel').value.trim(), concepto:$('#kCto').value.trim() || CONCEPTO_DEF};
      $('#kOk').disabled = true;
      try{ await guardarEv('cob_cliente', d); C.clientes.set(d.cid, d); cerrarHoja(); repintar(); }
      catch(e){ m('No se pudo guardar: ' + e.message); $('#kOk').disabled = false; }
    };
    if($('#kDel')) $('#kDel').onclick = async () => {
      if(!confirm('¿Quitar ' + x.nombre + '? Las notas emitidas se conservan.')) return;
      try{ await guardarEv('cob_cliente', {cid:x.cid, nombre:x.nombre, borrado:true}); C.clientes.delete(x.cid); cerrarHoja(); repintar(); }
      catch(e){ $('#kMsg').innerHTML = `<div class="msg bad">No se pudo: ${esc(e.message)}</div>`; }
    };
  }

         ${campo('eDir', 'Dirección', e.direccion)}<div class="dos">${campo('eCor', 'Correo', e.correo, 'autocapitalize="off"')}${campo('eWeb', 'Web', e.web, 'autocapitalize="off"')}</div>`, !e.nit)}
      ${acc('candado', 'Firma', esc(e.firmante ? e.firmante + (e.cargo ? ' · ' + e.cargo : '') : 'Firma y sello de Osiris'),

         <div class="prevCaja" style="padding:12px;display:flex;align-items:center;justify-content:center;gap:10px"><img src="${FIRMA}" alt="Firma" style="height:46px"><img src="${SELLO}" alt="Sello" style="height:70px"></div>`)}
      ${acc('cobros', 'Forma de pago', esc((METODOS.find(x => x[0] === (e.metodos || [])[0]) || [, 'Ninguna'])[1]),
        `<div class="field"><span>Por defecto en cada nota</span></div><div class="chips" id="eMet" style="margin-top:0">${[['', 'Ninguna'], ...METODOS].map(([k, t]) => `<button data-met="${k}" class="tab${((e.metodos || [])[0] || '') === k ? ' on' : ''}">${t}</button>`).join('')}</div>
         <div class="h2">Transferencia</div>
         <div class="dos">${campo('eBan', 'Banco', e.banco)}<label class="field"><span>Tipo de cuenta</span><select id="eTip">${['Caja de ahorro','Cuenta corriente'].map(t => `<option ${t === e.tipoCuenta ? 'selected' : ''}>${t}</option>`).join('')}</select></label></div>
         <div class="dos">${campo('eCta', 'N° de cuenta', e.cuenta, 'inputmode="numeric"')}${campo('eCiT', 'CI / NIT del titular', e.ciTitular)}</div>

/* Preferencias por edificio (secciones, columnas, papel), guardadas en este celular */
function prefInforme(){
  const ed = st.edif || '';
  if(INF.pref && INF.pref.ed === ed) return INF.pref;
  let p = null;
  try{ p = JSON.parse(leer('inf_' + ed) || 'null'); }catch(_){}
  const base = {ed, papel:'carta', vacias:true, secc:{}, ocultas:{}};
  for(const s of SECC_INF){ base.secc[s.k] = true; base.ocultas[s.k] = []; }
  if(p && typeof p === 'object'){
    if(PAPELES[p.papel]) base.papel = p.papel;
    if(typeof p.vacias === 'boolean') base.vacias = p.vacias;
    for(const s of SECC_INF){
      if(p.secc && typeof p.secc[s.k] === 'boolean') base.secc[s.k] = p.secc[s.k];
      if(p.ocultas && Array.isArray(p.ocultas[s.k])) base.ocultas[s.k] = p.ocultas[s.k].filter(c => s.cols.some(x => x[0] === c));
    }
  }
  INF.pref = base; return base;
}
function guardarPref(){ const p = INF.pref; if(p) guardar('inf_' + p.ed, JSON.stringify({papel:p.papel, vacias:p.vacias, secc:p.secc, ocultas:p.ocultas})); }
