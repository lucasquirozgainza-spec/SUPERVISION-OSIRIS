/* Carga jsPDF solo cuando se necesita (CDN principal y, si falla, el alternativo) */
function cargarScript(src){
  return new Promise((ok, mal) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => mal(new Error('no cargó ' + src)); document.head.appendChild(s); });
}
async function cargarJsPDF(){
  if(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API.autoTable) return window.jspdf.jsPDF;
  const fuentes = [
    ['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'],
    ['https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js', 'https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js'],
  ];
  let err;
  for(const [a, b] of fuentes){
    try{
      if(!(window.jspdf && window.jspdf.jsPDF)) await cargarScript(a);
      if(!window.jspdf.jsPDF.API.autoTable) await cargarScript(b);
      if(window.jspdf.jsPDF.API.autoTable) return window.jspdf.jsPDF;
    }catch(x){ err = x; }
  }
  throw err || new Error('no se pudo cargar el generador de PDF');
}

/* Texto apto para la fuente del PDF (Latin-1) */
function pdfTxt(v){
  return String(v ?? '').replace(/[→⇒]/g, '->').replace(/[–—]/g, '-').replace(/[“”]/g, '"').replace(/[‘’]/g, "'")
    .replace(/…/g, '...').replace(/•/g, '-').replace(/[^\x00-\xFF]/g, '').trim();
}
const fDia = t => String(t.getDate()).padStart(2,'0') + '/' + String(t.getMonth()+1).padStart(2,'0') + '/' + t.getFullYear();
const fHora = t => String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
const fDiaHora = t => t ? String(t.getDate()).padStart(2,'0') + '/' + String(t.getMonth()+1).padStart(2,'0') + ' ' + fHora(t) : '';
const normal = s => String(s ?? '').trim().toLowerCase().replace(/\s+/g, ' ');

/* Une cada llegada (visita, encomienda, hospedaje) con su salida/entrega: por ref; si no hay ref (registros
   anteriores a la v12.5), con la última llegada anterior de la misma persona y depto que no tenga salida */
function emparejar(entradas, salidas, clave){
  const porRef = new Map(); entradas.forEach(x => { if(x.d.ref) porRef.set(String(x.d.ref), x); });
  const ordenadas = [...salidas].sort((a,b) => a.t - b.t);
  for(const s of ordenadas){
    let e = s.d.ref ? porRef.get(String(s.d.ref)) : null;
    if(e && e.salida) e = null;
    if(!e){
      const k = clave(s.d);
      const cand = entradas.filter(x => !x.salida && x.t <= s.t && clave(x.d) === k && (!s.d.ref || !x.d.ref));
      e = cand.length ? cand[cand.length - 1] : null;
    }
    if(e) e.salida = s;
  }
}


async function generarInforme(){
  const ed = st.edif, mes = mesActual(), P = prefInforme();
  const res = $('#iRes'), btn = $('#iGen');
  const paso = t => res.innerHTML = `<div class="msg">${esc(t)}</div>`;
  if(!SECC_INF.some(s => P.secc[s.k])){ res.innerHTML = '<div class="msg bad">Marca al menos una sección.</div>'; return; }
  btn.disabled = true;
  try{
    paso('Cargando el generador de PDF…');
    const JsPDF = await cargarJsPDF();
    paso('Leyendo los movimientos del mes…');
    const desde = new Date(mes.y, mes.m, 1), hasta = new Date(mes.y, mes.m + 1, 1);
    const hastaQ = new Date(mes.y, mes.m + 1, 4);   // salidas y subidas tardías de los últimos días
    const filas = await paginas('eventos?select=*&edificio=eq.' + enc(ed) + '&created_at=gte.' + enc(desde.toISOString())
      + '&created_at=lt.' + enc(hastaQ.toISOString()) + '&tipo=' + enc(inList(OPERATIVOS)) + '&order=created_at.asc,id.asc');
    /* sin duplicados (mismo uid) y con su hora real */
    const vistos = new Set(), ev = [];
    for(const e of filas){
      const d = detalleDe(e), u = d.uid || ('id' + e.id);
      if(vistos.has(u)) continue; vistos.add(u);
      ev.push({e, d, t: horaReal(e), g: e.guardia || ''});
    }
    ev.sort((a,b) => a.t - b.t);
    const delMes = x => x.t >= desde && x.t < hasta;
    const de = (...tipos) => ev.filter(x => tipos.includes(x.e.tipo));
    const base = x => ({fecha: fDia(x.t), hora: fHora(x.t)});

    /* ---- filas de cada sección (objetos por columna) ---- */
    const datos = {};
    const visEnt = de('Visita').filter(x => normal(x.d.tipo) !== 'recurrente salida');
    if(P.secc.visitas){
      const sal = [...de('Salida de visita'), ...de('Visita').filter(x => normal(x.d.tipo) === 'recurrente salida')];
      emparejar(visEnt, sal, d => normal(d.nombre) + '|' + normal(d.depto));
      datos.visitas = visEnt.filter(delMes).map((x, i) => {
        const d = x.d, s = x.salida;
        return {...base(x), n: String(i + 1), visitante: d.nombre, ci: d.ci, depto: d.depto, autoriza: d.autoriza,
          motivo: [d.motivo, normal(d.tipo).startsWith('recurrente') ? 'recurrente' : ''].filter(Boolean).join(' - '),
          placa: d.placa, tarjeta: d.tarjeta || (s && s.d.tarjeta) || '', salida: s ? fDiaHora(s.t) : '',
          devolvio: s && s.d.tarjeta_devuelta === true ? 'Sí' : (s && s.d.tarjeta_devuelta === false ? 'NO' : ''),
          registro: x.g, registroSal: s ? s.g : ''};
      });
    }
    if(P.secc.encom){
      const ent = de('Encomienda');
      emparejar(ent, de('Entrega de encomienda'), d => normal(d.depto) + '|' + normal(d.destinatario));
      const hayEntregas = ent.some(x => x.salida);
      datos.encom = ent.filter(delMes).map(x => ({...base(x), depto: x.d.depto, dest: x.d.destinatario, empresa: x.d.empresa, recibio: x.g,
        entregada: x.salida ? fDiaHora(x.salida.t) : (hayEntregas ? 'Pendiente' : ''), entrego: x.salida ? x.salida.g : ''}));
    }
    const TIPO_ADV = {tarde:'Ingreso tarde', tarjeta:'Tarjeta no devuelta', tarjeta_turno:'Tarjetas sin devolver', uniforme:'Sin uniforme'};
    if(P.secc.incid){
      datos.incid = de('Incidente').filter(delMes).map(x => ({...base(x), tipo: x.d.tipo || 'Incidente', lugar: x.d.lugar,
        detalle: x.d.descripcion || x.d.observaciones || x.d.motivo, bloque: x.d.bloque, registro: x.g}));
    }
    if(P.secc.advert){
      datos.advert = de('Advertencia','Guardia sin uniforme').filter(delMes).map(x => x.e.tipo === 'Advertencia'
        ? {...base(x), tipo: TIPO_ADV[x.d.tipo] || x.d.tipo || 'Advertencia', detalle: x.d.motivo || x.d.mensaje, bloque: x.d.bloque, registro: x.g}
        : {...base(x), tipo: 'Sin uniforme', detalle: 'Inició turno sin uniforme', bloque: x.d.bloque, registro: x.g});
    }
    if(P.secc.turnos){
      datos.turnos = de('Ingreso de turno','Salida de turno','Doblar turno').filter(delMes).map(x => ({...base(x),
        mov: x.e.tipo === 'Doblar turno' ? 'Dobla turno' : x.e.tipo.replace(' de turno', ''), guardia: x.g, ci: x.d.guard_ci,
        bloque: x.d.bloque, turno: x.d.nivel ? x.d.nivel + ' h' : '', obs: x.d.observaciones}));
    }
    if(P.secc.rondas){
      datos.rondas = de('Ronda').filter(delMes).map(x => ({...base(x), guardia: x.g, bloque: x.d.bloque, puntos: x.d.puntos,
        fotos: x.d.fotos != null ? String(x.d.fotos) : '', obs: x.d.observaciones}));
    }
    if(P.secc.hosp){
      const ent = de('Hospedaje');
      emparejar(ent, de('Salida de hospedaje'), d => normal(d.huesped) + '|' + normal(d.depto));
      datos.hosp = ent.filter(delMes).map(x => ({...base(x), depto: x.d.depto, huesped: x.d.huesped, documento: x.d.documento,
        plataforma: x.d.plataforma, noches: String(x.d.noches ?? ''), huespedes: String(x.d.huespedes ?? ''),
        salida: x.salida ? fDiaHora(x.salida.t) : '', registro: x.g}));
    }
    let cfg = null;
    if(P.secc.horas){
      paso('Calculando horas del personal…');
      const [regG, c] = await Promise.all([leerRegistro(ed), leerConfig(ed)]); cfg = c;
      const horas = await horasDelMes(ed, mes.y, mes.m, regG, cfg);
      datos.horas = [...horas.entries()].map(([k, r]) => { const g = regG.get(k); return {
        guardia: g ? g.nombre : r.guardia, ci: g ? g.ci : k, turno: g ? (TURNO_TXT[g.turno] || g.turno) : '',
        dias: String(r.dias), n12: String(r.n12), n24: String(r.n24), n36: String(r.n36),
        horas: Turnos.duracion(Math.round(r.horas * 60)), aFavor: Turnos.saldo(r.aFavor),
        enContra: Math.round(r.enContra * 60) ? '-' + Turnos.duracion(Math.round(r.enContra * 60)) : '0 h',
        saldo: g && g.turno === 'FRANQUERO' ? 'No aplica' : Turnos.saldo(r.saldo), tarde: String(r.vecesTarde), incompletos: String(r.incompletos)}; })
        .sort((a, b) => a.guardia.localeCompare(b.guardia, 'es'));
    }

    paso('Armando el PDF…');
    const doc = new JsPDF({orientation:'landscape', unit:'mm', format: PAPELES[P.papel].f});
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    const M = 12, TOPE = 32;                          // margen lateral y alto de la franja superior
    const gris = [95, 105, 112], claro = [239, 243, 245], linea = [214, 222, 227];
    let y = TOPE + 4;
    const nuevaPagina = () => { doc.addPage(); y = TOPE + 4; };

    /* Resumen en recuadros */
    /* Los totales salen de las MISMAS filas que las tablas: nunca pueden no coincidir */
    const resumenItems = [];
    const nT = m => (datos.turnos || []).filter(r => r.mov === m).length;
    for(const [k, t] of [['visitas','Visitas'],['encom','Encomiendas'],['incid','Incidentes'],['advert','Advertencias'],['rondas','Rondas'],['turnos',''],['hosp','Hospedajes']]){
      if(!P.secc[k]) continue;
      if(k === 'turnos'){ resumenItems.push(['Ingresos de turno', nT('Ingreso')], ['Salidas de turno', nT('Salida')]); }
      else resumenItems.push([t, (datos[k] || []).length]);
    }
    if(resumenItems.length){
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12.5); doc.setTextColor(...COLOR_TITULO);
    doc.text('Resumen del mes', M, y); y += 3;
    const nb = Math.max(resumenItems.length, 6), bw = (W - 2 * M - (nb - 1) * 3) / nb;
    resumenItems.forEach(([t, n], i) => {
      const x = M + i * (bw + 3);
      doc.setFillColor(...claro); doc.setDrawColor(...linea); doc.roundedRect(x, y, bw, 17, 2, 2, 'FD');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(...COLOR_TITULO); doc.text(String(n), x + bw / 2, y + 8.5, {align:'center'});
      doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(55, 65, 72); doc.text(pdfTxt(t), x + bw / 2, y + 13.8, {align:'center'});
    });
    y += 27;
    }

    /* Tablas */
    const notas = [];
    for(const s of SECC_INF){
      if(!P.secc[s.k]) continue;
      const rows = datos[s.k] || [];
      let cols = s.cols.filter(([c]) => !P.ocultas[s.k].includes(c));
      if(P.vacias && rows.length) cols = cols.filter(([c]) => rows.some(r => String(r[c] ?? '').trim() !== ''));
      if(y > H - 45) nuevaPagina();
      doc.setFont('helvetica', 'bold'); doc.setFontSize(12.5); doc.setTextColor(...COLOR_TITULO);
      doc.text(pdfTxt(s.t), M, y);
      if(rows.length){ const tw = doc.getTextWidth(pdfTxt(s.t)); doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...gris); doc.text(`(${rows.length})`, M + tw + 2, y); }
      doc.setDrawColor(...COLOR_MARCA); doc.setLineWidth(0.4); doc.line(M, y + 1.8, W - M, y + 1.8); doc.setLineWidth(0.2);
      if(!rows.length){ doc.setFont('helvetica', 'italic'); doc.setFontSize(9); doc.setTextColor(...gris); doc.text('Sin registros en el mes.', M, y + 8); y += 17; continue; }
      const estilos = {};
      cols.forEach(([c]) => { if(ANCHOS[c]) estilos[c] = {cellWidth: ANCHOS[c]}; });
      if(s.k === 'horas') ['dias','n12','n24','n36','tarde','incompletos'].forEach(c => estilos[c] = {...(estilos[c] || {}), halign:'center'});
      doc.autoTable({
        startY: y + 4, margin:{left:M, right:M, top:TOPE + 4, bottom:14},
        columns: cols.map(([c, t]) => ({header: pdfTxt(t), dataKey: c})),
        body: rows.map(r => { const o = {}; cols.forEach(([c]) => o[c] = pdfTxt(r[c])); return o; }),
        theme:'grid',
        styles:{font:'helvetica', fontSize:8.5, cellPadding:{top:2, bottom:2, left:2.2, right:2.2}, overflow:'linebreak', valign:'middle',
          lineColor: linea, lineWidth: 0.15, textColor:[40, 48, 54]},
        headStyles:{fillColor: COLOR_MARCA, textColor:255, fontStyle:'bold', fontSize:8.5, valign:'middle'},
        alternateRowStyles:{fillColor: claro},
        columnStyles: estilos,
        didParseCell: c => { if(c.section === 'body' && s.k === 'visitas' && c.column.dataKey === 'devolvio' && c.cell.raw === 'NO'){ c.cell.styles.textColor = [200, 30, 30]; c.cell.styles.fontStyle = 'bold'; } },
      });
      y = doc.lastAutoTable.finalY + 11;
      if(s.k === 'horas' && cfg) notas.push(cfg.unGuardia ? `Edificio de un solo guardia: las horas extras se cuentan contra su propio horario de relevo (quedarse después suma; llegar tarde o irse antes resta). Turno de 36 h: cuenta como día extra trabajado. Tolerancia ${cfg.tolerancia} min: pasado el margen se cuentan los minutos completos.` : `Horas extras solo entre los guardias fijos (diurno y nocturno), en espejo: lo que uno tiene a favor el otro lo tiene en contra (relevos con atraso o salida anticipada). Los franqueros no suman ni restan. Turno de 24 h: sale a la misma hora del día siguiente; turno de 36 h: cuenta como día extra trabajado, no como horas extras. El mes empieza con el diurno del día 1 y termina con el nocturno del último día. Tolerancia ${cfg.tolerancia} min: pasado el margen se cuentan los minutos completos.`);
    }
    if(notas.length){
      if(y > H - 25) nuevaPagina();
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...gris);
      doc.text(doc.splitTextToSize(pdfTxt(notas.join(' ')), W - 2 * M), M, y);
    }

    /* Franja con logo en cada página y pie */
    const n = doc.internal.getNumberOfPages(), ahora = new Date();
    for(let i = 1; i <= n; i++){
      doc.setPage(i);
      doc.setFillColor(...COLOR_MARCA); doc.rect(0, 0, W, 24, 'F');
      try{ doc.addImage(LOGO_OSIRIS, 'PNG', M, 3.2, 37, 17.4); }catch(_){}
      doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
      doc.text('Informe mensual de movimientos', W - M, 11, {align:'right'});
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5);
      doc.text(pdfTxt(`${ed}  |  ${mesTxt(mes)}`), W - M, 17.5, {align:'right'});
      doc.setDrawColor(...linea); doc.line(M, H - 10, W - M, H - 10);
      doc.setFontSize(7.5); doc.setTextColor(...gris);
      doc.text(pdfTxt(`OSIRIS Security  -  Generado el ${fDia(ahora)} a las ${fHora(ahora)}`), M, H - 6);
      doc.text(`Página ${i} de ${n}`, W - M, H - 6, {align:'right'});
    }
    doc.setTextColor(0);
    INF.nombre = pdfTxt(`Informe ${ed} ${mesTxt(mes)}.pdf`).replace(/[\\/:*?"<>|]/g, '-');
    INF.blob = doc.output('blob');
    if(INF.url) URL.revokeObjectURL(INF.url);
    INF.url = URL.createObjectURL(INF.blob);
    res.innerHTML = `<div class="msg ok">Informe listo: ${n} página${n === 1 ? '' : 's'}, hoja ${esc(PAPELES[P.papel].t.toLowerCase())} horizontal.</div>
      <div class="acts"><a class="btn prim" style="text-align:center;text-decoration:none" href="${INF.url}" download="${esc(INF.nombre)}" target="_blank" rel="noopener">Abrir / descargar</a>
      <button class="btn prim" id="iShare">Compartir</button></div>`;
  }catch(e){
    res.innerHTML = `<div class="msg bad">No se pudo generar el informe (${esc(e.message)}). Revisa tu conexión e inténtalo de nuevo.</div>`;
  }finally{ btn.disabled = false; }
}

async function leerModulos(ed){
  const r = await api('eventos?select=detalle,created_at&tipo=eq.Config&edificio=eq.' + enc(ed) + '&order=created_at.desc&limit=1');
  let m = r.length ? detalleDe(r[0]).modulos : null;
  if(typeof m === 'string'){ try{ m = JSON.parse(m); }catch(_){ m = null; } }
  return {mod: (m && typeof m === 'object' && !Array.isArray(m)) ? m : {}, existe: r.length > 0};
}
async function cargarAjustesEd(){
  const mio = ++ED.gen, ed = st.edif, c = $('#edCuerpo');
  try{
    const {mod, existe} = await leerModulos(ed);

      <div class="h2">Campos de visitas</div>
      <div class="card">${CAMPOS_VISITA.map(([k,t]) => sw(k, t, true)).join('')}
        <label class="field"><span>Dígitos de la tarjeta de acceso</span><input id="aDig" type="number" min="3" max="16" value="${dig}" inputmode="numeric"></label></div>
      <div class="h2">Turnos</div>

  $('#nTor').onclick = ev => { const b = ev.target.closest('[data-nt]'); if(b){ torres.splice(+b.dataset.nt, 1); pintarT(); } };
  $('#nTorAdd').onclick = () => { const v = $('#nTorN').value.trim(); if(v && !torres.includes(v)) torres.push(v); $('#nTorN').value = ''; pintarT(); };
  $('#nOk').onclick = async () => {
    const nombre = $('#nNom').value.trim().replace(/\s+/g, ' ');
    const existentes = [...$('#edif').options].map(o => o.value.toLowerCase());
    if(!nombre) return $('#nMsg').innerHTML = '<div class="msg bad">Escribe el nombre.</div>';
    if(nombre.startsWith('_') || nombre === '*') return $('#nMsg').innerHTML = '<div class="msg bad">Nombre no válido.</div>';
    if(existentes.includes(nombre.toLowerCase())) return $('#nMsg').innerHTML = '<div class="msg bad">Ya existe un edificio con ese nombre.</div>';
    const mod = {torres: [...torres], tolerancia_min: 15, tarjeta_digitos: 10};
    document.querySelectorAll('[data-nm]').forEach(i => mod[i.dataset.nm] = i.checked);
    $('#nOk').disabled = true;
    try{
      await apiEscribir('POST', 'eventos', nuevoEvento('Config', nombre, 'Supervisión', {modulos: JSON.stringify(mod)}));
      const sel = $('#edif'); const o = document.createElement('option'); o.value = o.textContent = nombre; sel.appendChild(o);
      [...sel.options].sort((a, b) => a.value.localeCompare(b.value, 'es')).forEach(x => sel.appendChild(x));
      sel.value = nombre; sel.dispatchEvent(new Event('change'));
      $('#sheet').classList.remove('on');
    }catch(x){ $('#nMsg').innerHTML = `<div class="msg bad">No se pudo crear (${esc(x.message)}).</div>`; $('#nOk').disabled = false; }
  };
}
$('#v-edi').addEventListener('click', async e => {
  if(!ED.cfg) return;
  const t = e.target;
  if(t.dataset && t.dataset.torre !== undefined){ ED.cfg.torres.splice(+t.dataset.torre, 1); return redibujarTorres(); }
  if(t.id === 'aTorreAdd'){ const v = $('#aTorreN').value.trim(); if(v && !ED.cfg.torres.includes(v)) ED.cfg.torres.push(v); $('#aTorreN').value = ''; return redibujarTorres(); }

    const M = {...ED.cfg.mod};

    if(!(tol >= 0 && tol <= 60)) return $('#aMsg').innerHTML = '<div class="msg bad">La tolerancia va de 0 a 60 minutos.</div>';
    M.tarjeta_digitos = dig; M.tolerancia_min = tol; M.torres = [...ED.cfg.torres];
    t.disabled = true;

      await apiEscribir('POST', 'eventos', nuevoEvento('Config', ED.cfg.ed, 'Supervisión', {modulos: JSON.stringify(M)}));

      GU.datos = null;

});

/* ---------------- Celulares (ajustes por dispositivo) ---------------- */
const AJ_DEF = {bloque:'', ronda_fotos:10, ronda_horas:2, notif_rondas:true, alarma_candados:true, control_uniforme:true,
  turno_ingreso:'', turno_salida:'', retencion_dias:90, camara_nativa:false, notif_metodo:'whatsapp', admin_whatsapp:'', admin_email:''};
async function cargarCelulares(){
  const mio = ++ED.gen, ed = st.edif, c = $('#edCuerpo');
  try{
    const [rep, ord, pres, cfg] = await Promise.all([
      api('eventos?select=created_at,detalle&tipo=eq.Equipo&edificio=eq.' + enc(ed) + '&order=created_at.desc&limit=300'),
      api('eventos?select=created_at,detalle&tipo=eq.AjustesEquipo&edificio=eq.' + enc(ed) + '&order=created_at.desc&limit=300'),
      api('presencia?select=device_id,guardia,last_seen,en_turno&edificio=eq.' + enc(ed) + '&limit=100').catch(() => []),
      leerConfig(ed),
    ]);
    if(mio !== ED.gen) return;
    const eq = new Map();
    for(const r of rep){ const d = detalleDe(r); if(d.device_id && !eq.has(d.device_id)) eq.set(d.device_id, {rep:d, t:fecha(r.created_at)}); }
    for(const r of ord){ const d = detalleDe(r); const x = eq.get(d.device_id); if(x && !x.orden) x.orden = {d, t:fecha(r.created_at)}; }
    const viejos = pres.filter(p => p.device_id && !eq.has(p.device_id));
    ED.equipos = eq; ED.torres = cfg.torres;
    const tarjeta = ([id, x]) => {
      const a = {...AJ_DEF, ...(x.rep.ajustes || {})};
      const p = pres.find(q => q.device_id === id);
      const visto = p && p.last_seen ? fecha(p.last_seen) : x.t;
      const pend = x.orden && x.orden.t > x.t;
      const hor = a.turno_ingreso && a.turno_salida ? `${a.turno_ingreso} / ${a.turno_salida}` : 'normal 08:00 / 20:00';
      return `<div class="card gcard" data-dev="${esc(id)}">
        <div class="gtop"><div class="gname">${esc(a.bloque || 'Sin bloque')}</div>${pend ? '<span class="badge" style="background:var(--warn)">PENDIENTE</span>' : ''}</div>
        <div class="gid">${esc(x.rep.modelo || 'Celular')} · app ${esc(x.rep.version || '')} · visto ${esc(hace(visto))}${p && p.guardia && p.guardia !== 'Sin turno' ? ' · ' + esc(p.guardia) : ''}</div>
        <div class="stats">
          <div class="stat"><b>${a.ronda_fotos}</b><small>Fotos por ronda</small></div>
          <div class="stat"><b>${a.notif_rondas ? a.ronda_horas + ' h' : 'No'}</b><small>Aviso de ronda</small></div>
          <div class="stat"><b style="font-size:13px">${esc(hor)}</b><small>Relevo</small></div>
          <div class="stat"><b>${Math.round(a.retencion_dias / 30)}</b><small>Meses de datos</small></div>
        </div>
        ${pend ? '<div class="msg" style="margin-bottom:0">Cambios enviados: el celular los aplica apenas se conecte (≈1 min).</div>' : ''}
      </div>`;
    };
    c.innerHTML = `
      ${eq.size ? [...eq.entries()].sort((a,b) => String((a[1].rep.ajustes||{}).bloque||'').localeCompare(String((b[1].rep.ajustes||{}).bloque||''))).map(tarjeta).join('')
        : '<div class="empty">Ningún celular de este edificio reportó todavía sus ajustes.</div>'}
      ${viejos.length ? `<div class="msg">${viejos.length} celular(es) de este edificio todavía tienen una versión anterior de la app; cuando la actualicen aparecerán aquí para configurarlos.</div>` : ''}
      <div class="msg">Toca un celular para cambiar sus ajustes: fotos por ronda, cada cuántas horas avisar la ronda, horario de relevo, bloque, uniforme, alarma de candados, aviso de incidentes y más.</div>`;
  }catch(e){ if(mio === ED.gen) c.innerHTML = `<div class="err">No se pudo leer la nube (${esc(e.message)}).</div>`; }
}
$('#v-edi').addEventListener('click', e => { const c = e.target.closest('[data-dev]'); if(c && ED.sub === 'celulares') formCelular(c.dataset.dev); });

    <div class="h2">Aviso de incidentes al administrador</div><div class="card">

      <label class="field"><span>WhatsApp del administrador</span><input id="c_admin_whatsapp" inputmode="tel" value="${esc(a.admin_whatsapp)}"></label>
      <label class="field"><span>Correo del administrador</span><input id="c_admin_email" type="email" value="${esc(a.admin_email)}"></label></div>
    <div class="h2">Otros</div><div class="card">
      ${num('meses', 'Conservar datos en el celular (meses, 1 a 24)', 1, 24, Math.max(1, Math.round(a.retencion_dias / 30)))}
      ${chk('camara_nativa', 'Usar la cámara del celular (en vez de la de la app)')}</div>

  $('#sheet').classList.add('on');
  const leerForm = () => {
    const n = (k, min, max) => { const v = parseInt($('#c_' + k).value, 10); if(!(v >= min && v <= max)) throw new Error(`revisa el valor (${min} a ${max})`); return v; };
    const hora = k => { const v = $('#c_' + k).value.trim(); if(v && !/^\d{2}:\d{2}$/.test(v)) throw new Error('hora inválida'); return v; };
    const ti = hora('turno_ingreso'), ts = hora('turno_salida');
    if(!!ti !== !!ts) throw new Error('pon las dos horas de relevo o deja las dos vacías');
    return {
      ...($('#c_bloque') ? {bloque: $('#c_bloque').value} : {}),
      ronda_fotos: n('ronda_fotos', 1, 30), ronda_horas: n('ronda_horas', 1, 12), notif_rondas: $('#c_notif_rondas').checked,
      turno_ingreso: ti, turno_salida: ts, control_uniforme: $('#c_control_uniforme').checked, alarma_candados: $('#c_alarma_candados').checked,
      notif_metodo: $('#c_notif_metodo').value, admin_whatsapp: $('#c_admin_whatsapp').value.trim(), admin_email: $('#c_admin_email').value.trim(),
      retencion_dias: n('meses', 1, 24) * 30, camara_nativa: $('#c_camara_nativa').checked,

    let aj; try{ aj = leerForm(); }catch(err){ $('#cMsg').innerHTML = `<div class="msg bad">${esc(err.message)}</div>`; return; }
    if(sinBloque) delete aj.bloque;
    $('#cMsg').innerHTML = '<div class="msg">Enviando…</div>';
    try{
      for(const d of ids) await apiEscribir('POST', 'eventos', nuevoEvento('AjustesEquipo', st.edif, 'Supervisión', {device_id:d, version:'web_' + Date.now() + '_' + d, ajustes:aj}));

    }catch(err){ $('#cMsg').innerHTML = `<div class="msg bad">No se pudo enviar (${esc(err.message)}).</div>`; }

  $('#cTodos').onclick = () => { if(confirm(`¿Aplicar estos ajustes a los ${ED.equipos.size} celulares del edificio? (cada uno conserva su bloque)`)) enviar([...ED.equipos.keys()], true); };
}

/* ---------------- Listas: propietarios, residentes, vehículos, contactos, reglamentos, puntos ---------------- */
async function cargarLista(clase){
  const c = $('#edCuerpo'), ed = st.edif, mio = ++ED.gen;
  try{
    if(!ED.datos[clase] || ED.datos[clase].ed !== ed){
      const r = await api('eventos?select=created_at,detalle&tipo=eq.Datos&edificio=eq.' + enc(ed) + '&detalle->>clase=eq.' + clase + '&order=created_at.desc&limit=1');
      if(mio !== ED.gen) return;
      const d = r.length ? detalleDe(r[0]) : null;
      ED.datos[clase] = {ed, filas: d && Array.isArray(d.filas) ? d.filas.map(f => ({...f})) : [], existe: !!d, t: r.length ? fecha(r[0].created_at) : null, origen: d ? d.origen : ''};
      delete ED.sucio[clase];
    }
    pintarListaEd(clase);
  }catch(e){ if(mio === ED.gen) c.innerHTML = `<div class="err">No se pudo leer la nube (${esc(e.message)}).</div>`; }
}
function textoFila(clase, f){
  const L = LISTAS[clase];
  const t1 = L.principal.map(k => f[k]).filter(Boolean).join(' · ') || '(sin datos)';
  const resto = L.cols.filter(([k]) => !L.principal.includes(k) && k !== 'url' && k !== 'codigo' && f[k]).slice(0, 3).map(([k, t]) => f[k]).join(' · ');
  return [t1, resto];
}
function pintarListaEd(clase){
  const L = LISTAS[clase], D = ED.datos[clase], c = $('#edCuerpo');
  const q = sinTildes(ED.filtro);
  const idx = D.filas.map((f, i) => i).filter(i => !q || sinTildes(Object.values(D.filas[i]).join(' ')).includes(q));
  if(clase === 'propietarios' || clase === 'residentes' || clase === 'vehiculos') idx.sort((a, b) => String(D.filas[a].depto || '').localeCompare(String(D.filas[b].depto || ''), 'es', {numeric:true}));
  const sucio = ED.sucio[clase];
  c.innerHTML = `
    <div class="card" style="padding:10px 12px">
      <b>${esc(L.t)}</b> · ${D.filas.length} registro${D.filas.length === 1 ? '' : 's'}
      <div style="font-size:12.5px;color:var(--mute);margin-top:2px">${D.existe ? 'Última versión en la nube: ' + esc(D.t.toLocaleString('es',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})) + (D.origen === 'web' ? ' (desde aquí)' : ' (desde un celular)')
        : 'Todavía no hay datos en la nube: se suben solos cuando un celular con la app actualizada se conecta, o cárgalos aquí.'}</div>
      <div class="acts" style="margin-top:10px">
        <button class="btn" id="lNuevo">＋ Agregar</button>
        ${L.excel ? '<button class="btn" id="lImp">Importar Excel</button><button class="btn" id="lExp">Descargar Excel</button>' : ''}
      </div>
      ${L.excel ? '<input type="file" id="lArch" accept=".xlsx,.xls,.csv" hidden>' : ''}
    </div>
    ${sucio ? `<div class="msg" style="position:sticky;top:120px;z-index:3"><b>${sucio} cambio${sucio === 1 ? '' : 's'} sin enviar.</b><div class="acts" style="margin-top:8px"><button class="btn prim" id="lEnviar">Guardar y enviar a los celulares</button><button class="btn" id="lDescartar">Descartar</button></div></div>` : ''}
    ${D.filas.length > 8 ? `<div class="field"><input id="lBuscar" placeholder="Buscar…" value="${esc(ED.filtro)}" autocomplete="off"></div>` : ''}
    <div id="lFilas">${idx.length ? idx.slice(0, 300).map(i => { const [a, b] = textoFila(clase, D.filas[i]);
      return `<div class="card gcard" data-fila="${i}" style="padding:10px 12px"><div style="font-weight:700">${esc(a)}</div>${b ? `<div class="gid">${esc(b)}</div>` : ''}</div>`; }).join('')
      : `<div class="empty">${q ? 'Sin resultados.' : 'Lista vacía.'}</div>`}${idx.length > 300 ? '<div class="empty">Usa el buscador para ver más.</div>' : ''}</div>`;
  const bus = $('#lBuscar');
  if(bus) bus.oninput = () => { ED.filtro = bus.value; const pos = bus.selectionStart; pintarListaEd(clase); const b2 = $('#lBuscar'); if(b2){ b2.focus(); b2.setSelectionRange(pos, pos); } };
}
function marcarSucio(clase){ ED.sucio[clase] = (ED.sucio[clase] || 0) + 1; }

  const clase = ED.sub; if(!LISTAS[clase]) return;
  const t = e.target, D = ED.datos[clase]; if(!D) return;
  if(t.id === 'lNuevo') return formFila(clase, null);

    t.disabled = true; t.textContent = 'Enviando…';
    try{
      await apiEscribir('POST', 'eventos', nuevoEvento('Datos', D.ed, 'Supervisión', {clase, version:'web_' + Date.now(), origen:'web', filas: D.filas}));
      delete ED.sucio[clase]; delete ED.datos[clase]; await cargarLista(clase); pintarEdificio();

  const L = LISTAS[clase], D = ED.datos[clase], f = i === null ? {} : D.filas[i];
  const nuevo = i === null;
  let cuerpo;
  if(clase === 'normativas'){
    cuerpo = `<label class="field"><span>Nombre del documento</span><input id="f_nombre" value="${esc(f.nombre || '')}"></label>
      ${f.url ? `<div class="msg"><a href="${esc(f.url)}" target="_blank" rel="noopener">Ver archivo actual</a></div>` : ''}
      <label class="field"><span>${f.url ? 'Reemplazar archivo' : 'Archivo'} (PDF o foto)</span><input id="f_archivo" type="file" accept=".pdf,image/jpeg,image/png"></label>`;
  } else if(clase === 'puntos_control'){
    cuerpo = `<label class="field"><span>Nombre del punto (ej. Azotea, Garaje)</span><input id="f_nombre" value="${esc(f.nombre || '')}"></label>
      ${f.codigo ? `<div class="msg">Código del QR: ${esc(f.codigo)}<br>El QR para imprimir se saca desde la app (Puntos de ronda).</div>` : '<div class="msg">El código del QR se genera solo. Luego imprime el QR desde la app.</div>'}`;
  } else {
    cuerpo = L.cols.map(([k, t]) => `<label class="field"><span>${esc(t)}</span><input id="f_${k}" value="${esc(f[k] || '')}" autocomplete="off"></label>`).join('');
  }
  $('#panel').innerHTML = `<button class="btn close" id="cerrar">Cerrar</button>
    <h2>${nuevo ? 'Agregar' : 'Editar'}</h2><div class="sub">${esc(L.t)} · ${esc(D.ed)}</div>${cuerpo}<div id="fMsg"></div>
    <button class="btn prim" id="fOk">${nuevo ? 'Agregar' : 'Guardar cambio'}</button>
    ${nuevo ? '' : '<button class="btn danger" id="fDel" style="width:100%;margin-top:8px;padding:12px">Eliminar</button>'}
    <div class="msg">Los cambios se envían a los celulares cuando tocas <b>Guardar y enviar</b> en la lista.</div>`;
  $('#sheet').classList.add('on');
  $('#fOk').onclick = async () => {
    const nf = {...f};
    if(clase === 'normativas'){
      nf.nombre = $('#f_nombre').value.trim();
      const arch = $('#f_archivo').files[0];
      if(!nf.nombre) return $('#fMsg').innerHTML = '<div class="msg bad">Escribe el nombre.</div>';
      if(!arch && !nf.url) return $('#fMsg').innerHTML = '<div class="msg bad">Elige el archivo.</div>';
      if(arch){
        $('#fOk').disabled = true; $('#fMsg').innerHTML = '<div class="msg">Subiendo archivo…</div>';
        try{ nf.url = await subirDocumento(D.ed, arch); }
        catch(x){ $('#fOk').disabled = false; return $('#fMsg').innerHTML = `<div class="msg bad">No se pudo subir (${esc(x.message)}).</div>`; }
      }
    } else if(clase === 'puntos_control'){
      nf.nombre = $('#f_nombre').value.trim();
      if(!nf.nombre) return $('#fMsg').innerHTML = '<div class="msg bad">Escribe el nombre.</div>';
      if(!nf.codigo) nf.codigo = 'OSIRIS-PC-' + D.ed.replace(/ /g, '') + '-' + Date.now();
    } else {
      L.cols.forEach(([k]) => { const v = $('#f_' + k).value.trim(); if(v) nf[k] = v; else delete nf[k]; });
      if(!L.principal.some(k => nf[k])) return $('#fMsg').innerHTML = `<div class="msg bad">Completa al menos ${esc(L.cols.find(c => c[0] === L.principal[0])[1])}.</div>`;
      if(clase === 'propietarios' && !nf.id) nf.id = edSeguro(D.ed) + '-' + (nf.depto || 'x') + '-' + Date.now();
    }
    if(nuevo) D.filas.push(nf); else D.filas[i] = nf;
    marcarSucio(clase); $('#sheet').classList.remove('on'); pintarEdificio();
  };
  if($('#fDel')) $('#fDel').onclick = () => { if(!confirm('¿Eliminar este registro?')) return; D.filas.splice(i, 1); marcarSucio(clase); $('#sheet').classList.remove('on'); pintarEdificio(); };
}

/* Sube un PDF o foto al almacenamiento de la nube (carpeta del edificio) */
async function subirDocumento(ed, archivo){
  const ext = (archivo.name.split('.').pop() || 'pdf').toLowerCase().replace(/[^a-z0-9]/g, '') || 'pdf';
  const tipo = archivo.type || (ext === 'pdf' ? 'application/pdf' : 'image/jpeg');
  const ruta = edSeguro(ed) + '/docs/' + Date.now() + '_web.' + ext;
  const r = await fetch(SB_URL + '/storage/v1/object/osiris/' + ruta, {method:'POST', headers:{apikey:SB_KEY, 'Content-Type':tipo, 'x-upsert':'true'}, body:archivo});
  if(!r.ok){ let t = ''; try{ t = await r.text(); }catch(_){}; throw new Error('HTTP ' + r.status + (t ? ': ' + t.slice(0, 120) : '')); }
  return SB_URL + '/storage/v1/object/public/osiris/' + ruta;
}

/* ---------- Excel ---------- */
async function cargarXLSX(){
  if(window.XLSX) return window.XLSX;
  for(const src of ['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js']){
    try{ await cargarScript(src); if(window.XLSX) return window.XLSX; }catch(_){}
  }
  throw new Error('no se pudo cargar el lector de Excel');
}
async function importarExcel(clase, archivo){
  const L = LISTAS[clase], D = ED.datos[clase];
  try{
    const X = await cargarXLSX();
    const wb = X.read(await archivo.arrayBuffer(), {type:'array'});
    const nuevas = [];
    for(const nombre of wb.SheetNames){
      const filas = X.utils.sheet_to_json(wb.Sheets[nombre], {header:1, raw:false, defval:''});
      /* la fila de encabezados: la primera (de las 10 primeras) donde se reconocen más columnas */
      let mejor = -1, mapa = null, puntos = 0;
      for(let h = 0; h < Math.min(10, filas.length); h++){
        const cab = filas[h].map(sinTildes), m = {}, usadas = new Set();
        /* primero las claves más específicas (ej. "telefono inquilino" antes que "telefono") */
        const orden = [...L.cols].sort((a, b) => Math.max(...b[2].map(x => x.length), 0) - Math.max(...a[2].map(x => x.length), 0));
        for(const [k, , pal] of orden){
          const j = cab.findIndex((c, n) => !usadas.has(n) && c && pal.some(p => c.includes(p)));
          if(j >= 0){ m[k] = j; usadas.add(j); }
        }
        const n = Object.keys(m).length;
        if(n > puntos){ puntos = n; mejor = h; mapa = m; }
      }
      if(!mapa || !L.principal.some(k => k in mapa)) continue;
      for(const fila of filas.slice(mejor + 1)){
        const o = {};
        for(const [k, j] of Object.entries(mapa)){ let v = String(fila[j] ?? '').trim(); if(/^\d+\.0$/.test(v)) v = v.slice(0, -2); if(v) o[k] = v; }
        if(!L.principal.some(k => o[k])) continue;
        if(clase === 'propietarios') o.id = edSeguro(D.ed) + '-' + (o.depto || 'x') + '-' + Date.now() + '-' + nuevas.length;
        nuevas.push(o);
      }
    }
    if(!nuevas.length) return alert('No encontré datos en ese archivo. La primera fila debe tener los títulos de las columnas (por ejemplo: Depto, Propietario, Teléfono).');
    const reemplazar = D.filas.length ? confirm(`Encontré ${nuevas.length} registros.\n\nAceptar = REEMPLAZAR la lista actual (${D.filas.length}).\nCancelar = AGREGARLOS a la lista actual.`) : true;
    D.filas = reemplazar ? nuevas : [...D.filas, ...nuevas];
    marcarSucio(clase); pintarEdificio();
  }catch(e){ alert('No se pudo leer el archivo: ' + e.message); }
  finally{ const i = $('#lArch'); if(i) i.value = ''; }
}
async function exportarExcel(clase){
  const L = LISTAS[clase], D = ED.datos[clase];
  try{
    const X = await cargarXLSX();
    const filas = [L.cols.map(c => c[1]), ...D.filas.map(f => L.cols.map(([k]) => f[k] || ''))];
    const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(filas), L.t.slice(0, 30));
    X.writeFile(wb, `${L.t} ${D.ed}.xlsx`);
  }catch(e){ alert('No se pudo crear el Excel: ' + e.message); }
}

const textoBusqueda = e => sinTildes([e.tipo, e.guardia, ...Object.entries(detalleDe(e))
  .filter(([k]) => !['uid','ts','foto_url','fotos_url','relevos','turno_ref','ref','version'].includes(k))

async function buscar(){
  BUS.q = $('#bQ').value.trim(); BUS.dia = $('#bDia').value;
  const mio = ++BUS.gen, ed = st.edif, mes = mesActual(), box = $('#bRes');
  box.innerHTML = '<div class="empty">Buscando…</div>';
  try{
    let desde = new Date(mes.y, mes.m, 1), hasta = new Date(mes.y, mes.m + 1, 1);
    if(BUS.dia){ const [y, mm, d] = BUS.dia.split('-').map(Number); desde = new Date(y, mm - 1, d); hasta = new Date(y, mm - 1, d + 1); }
    const grupo = TIPOS_BUS.find(x => x[0] === BUS.tipo)[2] || OPERATIVOS;
    const filas = await paginas('eventos?select=*&edificio=eq.' + enc(ed) + '&created_at=gte.' + enc(desde.toISOString())
      + '&created_at=lt.' + enc(new Date(+hasta + 3 * 864e5).toISOString()) + '&tipo=' + enc(inList(grupo)) + '&order=created_at.desc,id.desc');
    if(mio !== BUS.gen) return;
    const palabras = sinTildes(BUS.q).split(/\s+/).filter(Boolean);
    const vistos = new Set(), res = [];
    for(const e of filas){
      const d = detalleDe(e), u = d.uid || ('id' + e.id);
      if(vistos.has(u)) continue; vistos.add(u);
      const t = horaReal(e); if(!(t >= desde && t < hasta)) continue;
      const txt = textoBusqueda(e), txtSinEsp = txt.replace(/[\s.\-]/g, '');
      if(palabras.length && !palabras.every(p => txt.includes(p) || txtSinEsp.includes(p.replace(/[.\-]/g, '')))) continue;
      res.push({e, t});
    }
    res.sort((a, b) => b.t - a.t);
    await unirFotosTurno(res.map(x => x.e));
    BUS.res = res; BUS.sel = new Set();
    pintarResultados();
  }catch(e){ if(mio === BUS.gen) box.innerHTML = `<div class="err">No se pudo buscar (${esc(e.message)}).</div>`; }
}
function pintarResultados(){
  const box = $('#bRes'), R = BUS.res;
  if(!R.length){ box.innerHTML = '<div class="empty">No se encontraron registros con esa búsqueda en el periodo elegido.</div>'; return; }
  box.innerHTML = `
