/* Foto → JPEG reducido (para que el PDF no pese demasiado) */
async function fotoParaPdf(url){
  const r = await fetch(url, {cache:'force-cache'}); if(!r.ok) throw new Error('HTTP ' + r.status);
  const blob = await r.blob();
  const src = URL.createObjectURL(blob);
  try{
    const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => mal(new Error('imagen inválida')); i.src = src; });
    const k = Math.min(1, 1100 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return {data: c.toDataURL('image/jpeg', 0.82), w: c.width, h: c.height, bytes: blob.size};
  } finally { URL.revokeObjectURL(src); }
}
/* Ruta y hora de carga de una foto, a partir de su nombre en el servidor (empieza con la hora en milisegundos) */
function infoArchivo(url){
  const m = /\/object\/public\/([^?]+)/.exec(url), ruta = m ? decodeURIComponent(m[1]) : url;
  const n = /\/(\d{12,14})_[^/]*$/.exec(ruta);
  return {ruta, subida: n ? new Date(+n[1]) : null};
}
const fCompleta = t => t ? t.toLocaleString('es', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false}) : '-';
function huellaTexto(e){
  const d = detalleDe(e), orden = {};
  Object.keys(d).sort().forEach(k => orden[k] = d[k]);
  return JSON.stringify({id: e.id, tipo: e.tipo, edificio: e.edificio, guardia: e.guardia, created_at: e.created_at, device_id: e.device_id, detalle: orden});
}

async function generarCertificado(){
  const elegidos = [...BUS.sel].sort((a, b) => a - b).map(i => BUS.res[i]).sort((a, b) => a.t - b.t);
  if(!elegidos.length) return;
  const out = $('#bOut'), btn = $('#bCert'), ed = st.edif, mes = mesActual();
  const paso = t => out.innerHTML = `<div class="msg">${esc(t)}</div>`;
  btn.disabled = true;
  try{
    paso('Cargando el generador de PDF…');
    const JsPDF = await cargarJsPDF();
    paso('Calculando huellas digitales…');
    const huellas = [];
    for(const x of elegidos) huellas.push(await sha256(huellaTexto(x.e)));
    const ahora = new Date();
    const huellaDoc = await sha256(huellas.join('|') + '|' + ahora.toISOString());
    const numero = 'OSI-' + ahora.getFullYear() + String(ahora.getMonth() + 1).padStart(2, '0') + String(ahora.getDate()).padStart(2, '0') + '-' + huellaDoc.slice(0, 8).toUpperCase();

    const doc = new JsPDF({orientation:'portrait', unit:'mm', format:'letter'});
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 18, TOPE = 34;
    const oscuro = [30, 50, 61], gris = [90, 100, 108], linea = [214, 222, 227], claro = [242, 245, 247];
    let y = TOPE + 6;
    const nueva = () => { doc.addPage(); y = TOPE + 6; };
    const espacio = h => { if(y + h > H - 22) nueva(); };
    const parrafo = (txt, size = 10, estilo = 'normal', color = [40, 48, 54]) => {
      doc.setFont('helvetica', estilo); doc.setFontSize(size); doc.setTextColor(...color);
      const ls = doc.splitTextToSize(pdfTxt(txt), W - 2 * M);
      for(const l of ls){ espacio(size * 0.45); doc.text(l, M, y); y += size * 0.45; }
      y += 2;
    };

    /* ---- Portada / declaración ---- */
    doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.setTextColor(...oscuro);
    doc.text('CERTIFICADO DE REGISTRO DIGITAL', W / 2, y, {align:'center'}); y += 7;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(...gris);
    doc.text(pdfTxt('N° ' + numero + '   |   Emitido el ' + fCompleta(ahora)), W / 2, y, {align:'center'}); y += 10;
    const tipoTxt = TIPOS_BUS.find(x => x[0] === BUS.tipo)[1];
    parrafo(`OSIRIS SECURITY CERTIFICA que los ${elegidos.length} registro${elegidos.length === 1 ? '' : 's'} detallado${elegidos.length === 1 ? '' : 's'} en el presente documento `
      + `fueron capturados mediante la aplicación móvil OSIRIS por el personal de seguridad asignado al edificio ${ed}, y que se encuentran almacenados `
      + `en el servidor en la nube de OSIRIS Security (${SERVIDOR}). El contenido aquí transcrito corresponde fielmente a lo almacenado en dicho servidor `
      + `a la fecha y hora de emisión de este certificado, incluidas las fotografías adjuntas.`, 10.5);
    parrafo('Para cada registro se detalla: la fecha y hora en que fue capturado en el dispositivo, la fecha y hora en que fue recibido por el servidor, '
      + 'el dispositivo de origen, el responsable que lo registró, la huella digital SHA-256 del registro y, cuando existen, las fotografías con su '
      + 'ubicación en el servidor, su fecha de carga y la carpeta del celular donde la aplicación guarda la copia original.', 10);
    espacio(30);
    doc.setFillColor(...claro); doc.setDrawColor(...linea); doc.roundedRect(M, y, W - 2 * M, 24, 2, 2, 'FD');
    doc.setFontSize(9.5); doc.setTextColor(...oscuro); doc.setFont('helvetica', 'bold');
    doc.text('Criterio de la búsqueda', M + 4, y + 6);
    doc.setFont('helvetica', 'normal'); doc.setTextColor(40, 48, 54);
    doc.text(pdfTxt(`Edificio: ${ed}     Periodo: ${BUS.dia ? BUS.dia.split('-').reverse().join('/') : mesTxt(mes)}     Tipo: ${tipoTxt}`), M + 4, y + 12);
    doc.text(pdfTxt(`Texto buscado: ${BUS.q ? '"' + BUS.q + '"' : '(sin filtro)'}     Registros certificados: ${elegidos.length}`), M + 4, y + 18);
    y += 32;

    /* ---- Cada registro ---- */
    for(let k = 0; k < elegidos.length; k++){
      const {e, t} = elegidos[k], d = detalleDe(e), es = ESTILO[e.tipo] || {t: e.tipo};
      paso(`Armando registro ${k + 1} de ${elegidos.length}…`);
      espacio(40);
      doc.setFillColor(...COLOR_MARCA); doc.rect(M, y - 5, W - 2 * M, 8, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(255);
      doc.text(pdfTxt(`Registro ${k + 1} de ${elegidos.length}: ${es.t}`), M + 3, y + 0.6);
      doc.text(pdfTxt(fCompleta(t)), W - M - 3, y + 0.6, {align:'right'});
      y += 6;
      const filas = [['Edificio', e.edificio], ['Fecha y hora del hecho', fCompleta(t)], ['Registrado por', (e.guardia || '-') + (d.guard_ci ? '  (CI ' + d.guard_ci + ')' : '')]];
      if(d.bloque) filas.push(['Bloque / torre', d.bloque]);
      for(const [kk, v] of camposVisibles(d)) if(kk !== 'bloque') filas.push([ETIQUETAS[kk] || (kk.charAt(0).toUpperCase() + kk.slice(1).replace(/_/g, ' ')), valorTxt(v)]);
      doc.autoTable({startY: y, margin:{left:M, right:M, top:TOPE + 6, bottom:22}, theme:'grid', body: filas.map(([a, b]) => [pdfTxt(a), pdfTxt(b)]),
        styles:{fontSize:9.5, cellPadding:2.2, lineColor:linea, lineWidth:0.15, textColor:[40, 48, 54]},
        columnStyles:{0:{cellWidth:52, fontStyle:'bold', fillColor:claro, textColor:oscuro}}});
      y = doc.lastAutoTable.finalY + 4;
      const reg = [['Identificador único', d.uid || ('id ' + e.id)], ['Capturado en el dispositivo', fCompleta(fecha(d.ts || e.created_at))],
        ['Recibido por el servidor', fCompleta(fecha(e.created_at))], ['Dispositivo de origen', e.device_id || '-'],
        ['Servidor', SERVIDOR + ' - tabla "eventos", registro N° ' + e.id], ['Huella digital (SHA-256)', huellas[k]]];
      doc.autoTable({startY: y, margin:{left:M, right:M, top:TOPE + 6, bottom:22}, theme:'plain', head:[['Registro digital', '']],
        body: reg.map(([a, b]) => [pdfTxt(a), pdfTxt(b)]),
        headStyles:{fillColor:claro, textColor:oscuro, fontSize:9}, styles:{fontSize:8.2, cellPadding:1.4, textColor:gris, font:'helvetica'},
        columnStyles:{0:{cellWidth:52, fontStyle:'bold'}, 1:{font:'courier'}}});
      y = doc.lastAutoTable.finalY + 5;
      /* fotos */
      const fotos = fotosDe(d);
      for(let j = 0; j < fotos.length; j++){
        const info = infoArchivo(fotos[j]);
        let img = null; try{ img = await fotoParaPdf(fotos[j]); }catch(_){}
        const maxW = W - 2 * M - 40, maxH = 95;
        let w = maxW, h = maxH;
        if(img){ const r = img.w / img.h; if(maxW / r <= maxH){ w = maxW; h = maxW / r; } else { h = maxH; w = maxH * r; } }
        espacio((img ? h : 0) + 22);
        if(img){ doc.addImage(img.data, 'JPEG', (W - w) / 2, y, w, h); doc.setDrawColor(...linea); doc.rect((W - w) / 2, y, w, h); y += h + 4; }
        doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(...oscuro);
        doc.text(pdfTxt(`Fotografía ${j + 1} de ${fotos.length}` + (img ? '' : ' (no se pudo descargar en este momento; ver ubicación)')), M, y); y += 4;
        doc.setFont('helvetica', 'normal'); doc.setTextColor(...gris);
        const lin = [`Archivo en el servidor: ${info.ruta}`, `Cargada al servidor: ${info.subida ? fCompleta(info.subida) : 'ver registro'}${img ? '   |   Tamaño: ' + Math.round(img.bytes / 1024) + ' KB' : ''}`,
          `Copia original en el celular de origen: galería, carpeta "${ALBUM[e.tipo] || 'Pictures/OSIRIS'}"`];
        for(const l of lin) for(const s of doc.splitTextToSize(pdfTxt(l), W - 2 * M)){ espacio(4); doc.text(s, M, y); y += 3.8; }
        y += 4;
      }
      y += 4;
    }

    /* ---- Cierre y firma ---- */
    espacio(70);
    parrafo(`Se expide el presente certificado a solicitud de parte interesada, el ${fCompleta(ahora)}. La huella digital de cada registro permite comprobar `
      + 'en cualquier momento que su contenido en el servidor no fue alterado: basta con recalcularla sobre el registro almacenado y compararla con la aquí impresa.', 10);
    y += 14;
    doc.setDrawColor(...oscuro); doc.line(M + 6, y, M + 76, y);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(...oscuro);
    doc.text('Responsable de supervisión', M + 41, y + 5, {align:'center'});
    doc.setFont('helvetica', 'normal'); doc.text('OSIRIS Security', M + 41, y + 10, {align:'center'});
    /* sello */
    const cx = W - M - 32, cy = y - 2;
    doc.setDrawColor(...COLOR_MARCA); doc.setLineWidth(0.8); doc.circle(cx, cy, 22); doc.setLineWidth(0.3); doc.circle(cx, cy, 19);
    try{ doc.addImage(LOGO_OSIRIS_COLOR, 'PNG', cx - 13, cy - 11, 26, 12.2); }catch(_){}
    doc.setFont('helvetica', 'bold'); doc.setFontSize(6.5); doc.setTextColor(...COLOR_MARCA);
    doc.text('REGISTRO DIGITAL', cx, cy + 6, {align:'center'}); doc.text('CERTIFICADO', cx, cy + 9.5, {align:'center'});
    doc.setFont('helvetica', 'normal'); doc.setFontSize(5.5); doc.text(numero, cx, cy + 13, {align:'center'});
    doc.setLineWidth(0.2);
    y += 22;
    parrafo('Este documento certifica la existencia, fecha y contenido de los registros digitales en los servidores de OSIRIS Security. No reemplaza una certificación notarial.', 7.5, 'italic', gris);

    /* ---- Encabezado, marca de agua y pie en cada página ---- */
    const n = doc.internal.getNumberOfPages();
    for(let i = 1; i <= n; i++){
      doc.setPage(i);
      doc.saveGraphicsState();
      doc.setGState(new doc.GState({opacity: 0.07}));
      try{ doc.addImage(LOGO_OSIRIS_COLOR, 'PNG', W / 2 - 60, H / 2 - 28, 120, 56.5); }catch(_){}
      doc.setFont('helvetica', 'bold'); doc.setFontSize(46); doc.setTextColor(...COLOR_MARCA);
      doc.text('OSIRIS SECURITY', W / 2 - 62, H / 2 + 62, {angle: 35});
      doc.text('ORIGINAL DIGITAL', W / 2 - 50, H / 2 - 30, {angle: 35});
      doc.restoreGraphicsState();
      doc.setFillColor(...COLOR_MARCA); doc.rect(0, 0, W, 26, 'F');
      try{ doc.addImage(LOGO_OSIRIS, 'PNG', M - 4, 4, 38, 17.9); }catch(_){}
      doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(12.5);
      doc.text('CERTIFICADO DE REGISTRO DIGITAL', W - M, 12, {align:'right'});
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
      doc.text(pdfTxt(`N° ${numero}  |  ${ed}`), W - M, 18.5, {align:'right'});
      doc.setDrawColor(...linea); doc.line(M, H - 14, W - M, H - 14);
      doc.setFontSize(7); doc.setTextColor(...gris);
      doc.text(pdfTxt(`Huella del documento (SHA-256): ${huellaDoc}`), M, H - 9.5);
      doc.text(`Página ${i} de ${n}`, W - M, H - 5.5, {align:'right'});
      doc.text(pdfTxt('OSIRIS Security - Certificado de registro digital'), M, H - 5.5);
    }
    INF.nombre = pdfTxt(`Certificado ${numero} ${ed}.pdf`).replace(/[\\/:*?"<>|]/g, '-');
    INF.blob = doc.output('blob');
    if(INF.url) URL.revokeObjectURL(INF.url);
    INF.url = URL.createObjectURL(INF.blob);
    out.innerHTML = `<div class="msg ok">Certificado ${esc(numero)} listo: ${n} página${n === 1 ? '' : 's'}, ${elegidos.length} registro${elegidos.length === 1 ? '' : 's'}.</div>
      <div class="acts"><a class="btn prim" style="text-align:center;text-decoration:none" href="${INF.url}" download="${esc(INF.nombre)}" target="_blank" rel="noopener">Abrir / descargar</a>
      <button class="btn prim" id="bShare">Compartir</button></div>`;
    out.scrollIntoView({block:'center'});
  }catch(e){
    out.innerHTML = `<div class="msg bad">No se pudo generar el certificado (${esc(e.message)}).</div>`;
  }finally{ btn.disabled = false; }
}
async function compartirPdf(){
  try{
    const f = new File([INF.blob], INF.nombre, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[f]})) await navigator.share({files:[f], title:INF.nombre});
    else window.open(INF.url, '_blank');
  }catch(_){}
}

/* ===================== ACCESO: PIN de supervisión y links de administradores ===================== */
const MON = '__monitor__';   // "edificio" interno donde el monitor guarda su configuración (la app no lo lee)
const ACC = {modo:'sup', link:null, pin:null};

/* SHA-256 (con respaldo en JS por si el navegador no trae crypto.subtle) */
async function sha256(txt){
  const data = new TextEncoder().encode(txt);
  if(window.crypto && crypto.subtle){
    try{ const b = await crypto.subtle.digest('SHA-256', data); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join(''); }catch(_){}
  }
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l = data.length, n = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(n); m.set(data); m[l] = 0x80;
  const dv = new DataView(m.buffer); dv.setUint32(n - 4, l * 8); dv.setUint32(n - 8, Math.floor(l / 0x20000000));
  const w = new Uint32Array(64), r = (x, k) => (x >>> k) | (x << (32 - k));
  for(let o = 0; o < n; o += 64){
    for(let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
    for(let i = 16; i < 64; i++){ const a = w[i-15], b = w[i-2]; w[i] = (w[i-16] + (r(a,7) ^ r(a,18) ^ (a >>> 3)) + w[i-7] + (r(b,17) ^ r(b,19) ^ (b >>> 10))) | 0; }
    let [a,b,c,d,e,f,g,h] = H;
    for(let i = 0; i < 64; i++){
      const t1 = (h + (r(e,6) ^ r(e,11) ^ r(e,25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((r(a,2) ^ r(a,13) ^ r(a,22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0; H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}
function azar(n){
  const abc = 'abcdefghijkmnpqrstuvwxyz23456789', b = new Uint8Array(n);
  (window.crypto || {getRandomValues: a => a.map(() => Math.floor(Math.random() * 256))}).getRandomValues(b);
  return [...b].map(x => abc[x % abc.length]).join('');
}

async function leerPin(){
  const r = await api('eventos?select=detalle,created_at&tipo=eq.Config&edificio=eq.' + MON + '&detalle->>clase=eq.pin&order=created_at.desc&limit=1');
  return r.length ? detalleDe(r[0]) : null;
}
async function guardarPin(pin){
  const salt = azar(16), hash = await sha256(salt + ':' + pin);
  const ev = nuevoEvento('Config', MON, 'Supervisión', {clase:'pin', salt, hash});
  await apiEscribir('POST', 'eventos', ev);
  /* el PIN anterior ya no sirve */
  try{ await apiEscribir('DELETE', 'eventos?tipo=eq.Config&edificio=eq.' + MON + '&detalle->>clase=eq.pin&detalle->>uid=neq.' + enc(ev.detalle.uid)); }catch(_){}
  ACC.pin = {salt, hash}; guardar('sup', hash);
}

function pantallaBloqueo(html){ $('#lockBox').innerHTML = html; $('#lock').hidden = false; }
function quitarBloqueo(){ $('#lock').hidden = true; }

/* Supervisión: pide el PIN una vez por celular (o lo crea la primera vez) */
async function accesoSupervision(){
  let pin;
  try{ pin = await leerPin(); }
  catch(e){
    pantallaBloqueo(`<h2>Sin conexión</h2><p style="color:var(--mute)">No se pudo conectar con la nube (${esc(e.message)}).</p><button class="btn prim" onclick="location.reload()">Reintentar</button>`);
    return false;
  }
  ACC.pin = pin;
  if(pin && leer('sup') === pin.hash) return true;
  return new Promise(listo => {
    if(!pin){
      pantallaBloqueo(`<h2>Crea tu PIN de supervisión</h2>
        <p style="color:var(--mute);font-size:14px">Protege la gestión de guardias, los informes y los links. Se pide una sola vez en cada celular.</p>
        <label class="field"><span>PIN nuevo (4 a 8 números)</span><input id="p1" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></label>
        <label class="field"><span>Repite el PIN</span><input id="p2" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></label>
        <div id="pMsg"></div><button class="btn prim" id="pOk">Guardar PIN</button>`);
      $('#pOk').onclick = async () => {
        const a = $('#p1').value.trim(), b = $('#p2').value.trim();
        if(!/^\d{4,8}$/.test(a)) return $('#pMsg').innerHTML = '<div class="msg bad">El PIN debe tener de 4 a 8 números.</div>';
        if(a !== b) return $('#pMsg').innerHTML = '<div class="msg bad">Los PIN no coinciden.</div>';
        $('#pOk').disabled = true;
        try{ await guardarPin(a); quitarBloqueo(); listo(true); }
        catch(e){ $('#pMsg').innerHTML = `<div class="msg bad">No se pudo guardar (${esc(e.message)}).</div>`; $('#pOk').disabled = false; }
      };
    } else {
      pantallaBloqueo(`<h2>Osiris · Supervisión</h2>
        <label class="field"><span>Ingresa tu PIN</span><input id="p1" type="password" inputmode="numeric" maxlength="8" autocomplete="current-password"></label>
        <div id="pMsg"></div><button class="btn prim" id="pOk">Entrar</button>`);
      const entrar = async () => {
        const h = await sha256(pin.salt + ':' + $('#p1').value.trim());
        if(h !== pin.hash){ $('#pMsg').innerHTML = '<div class="msg bad">PIN incorrecto.</div>'; $('#p1').value = ''; return; }
        guardar('sup', h); quitarBloqueo(); listo(true);
      };
      $('#pOk').onclick = entrar;
      $('#p1').addEventListener('keydown', e => { if(e.key === 'Enter') entrar(); });
    }
    setTimeout(() => { const i = $('#p1'); if(i) i.focus(); }, 50);
  });
}

/* Edificios que ve un link (los links viejos tenían uno solo en "edificio") */
function edsDeLink(d){
  const l = Array.isArray(d.edificios) ? d.edificios.map(String).filter(Boolean) : [];
  return l.length ? l : (d.edificio ? [String(d.edificio)] : []);
}
async function leerLink(token){
  const r = await api('eventos?select=detalle,created_at&tipo=eq.Config&edificio=eq.' + MON + '&detalle->>clase=eq.link&detalle->>token=eq.' + enc(token) + '&order=created_at.desc&limit=1');
  return r.length ? detalleDe(r[0]) : null;
}
/* Link de administrador: solo ve EN VIVO los edificios que se le asignaron */
async function accesoAdmin(token){
  let r;
  try{ const d = await leerLink(token); r = d ? [{detalle:d}] : []; }
  catch(e){
    pantallaBloqueo(`<h2>Sin conexión</h2><p style="color:var(--mute)">${esc(e.message)}</p><button class="btn prim" onclick="location.reload()">Reintentar</button>`);
    return false;
  }
  if(!r.length){
    pantallaBloqueo('<h2>Link desactivado</h2><p style="color:var(--mute)">Este link ya no tiene acceso. Pide uno nuevo a supervisión.</p>');
    return false;
  }
  ACC.link = detalleDe(r[0]);
  ACC.eds = edsDeLink(ACC.link);
  if(!ACC.eds.length){ pantallaBloqueo('<h2>Link sin edificios</h2><p style="color:var(--mute)">Pide a supervisión que le asigne edificios.</p>'); return false; }
  return true;
}

/* ---------- Dispositivos autorizados por link ----------
   El primer/los primeros dispositivos que abren el link quedan autorizados (hasta los "cupos" del link).
   Cualquier otro queda esperando hasta que supervisión lo permita. */
function miDispositivo(token){
  try{
    const k = 'osiris_dev_' + token;
    let id = localStorage.getItem(k);
    if(!id){ id = azar(16); localStorage.setItem(k, id); if(localStorage.getItem(k) !== id) return null; }
    return id;
  }catch(_){ return null; }
}
function nombreEquipo(){
  const u = navigator.userAgent || '';
  const so = /iPhone/.test(u) ? 'iPhone' : /iPad/.test(u) ? 'iPad' : /Android/.test(u) ? 'Android' : /Windows/.test(u) ? 'Computadora Windows' : /Macintosh|Mac OS/.test(u) ? 'Mac' : 'Equipo';
  const nav = /Edg/.test(u) ? 'Edge' : /CriOS|Chrome/.test(u) ? 'Chrome' : /FxiOS|Firefox/.test(u) ? 'Firefox' : /Safari/.test(u) ? 'Safari' : 'navegador';
  let app = '';
  try{ if(navigator.standalone || matchMedia('(display-mode: standalone)').matches) app = ' (ícono en inicio)'; }catch(_){}
  return so + ' · ' + nav + app;
}
async function dispositivosLink(token){
  const r = await api('eventos?select=detalle,created_at&tipo=eq.Config&edificio=eq.' + MON + '&detalle->>clase=eq.linkdev&detalle->>token=eq.' + enc(token) + '&order=created_at.desc&limit=500');
  const ult = new Map();
  for(const x of r){ const d = detalleDe(x); if(d.dev && !ult.has(d.dev)) ult.set(d.dev, {...d, t: fecha(x.created_at)}); }
  return ult;
}
/* Nuevo estado de un dispositivo (ok / pendiente / bloqueado); las versiones viejas se borran */
async function estadoDev(token, dev, estado, equipo){
  const ev = nuevoEvento('Config', MON, 'Link', {clase:'linkdev', token, dev, estado, equipo});
  await apiEscribir('POST', 'eventos', ev);
  try{ await apiEscribir('DELETE', 'eventos?tipo=eq.Config&edificio=eq.' + MON + '&detalle->>clase=eq.linkdev&detalle->>token=eq.' + enc(token)
    + '&detalle->>dev=eq.' + enc(dev) + '&detalle->>uid=neq.' + enc(ev.detalle.uid)); }catch(_){}
}
async function autorizarDispositivo(token){
  const dev = miDispositivo(token);
  if(!dev){
    pantallaBloqueo('<h2>Abre el link en el navegador normal</h2><p style="color:var(--mute)">Este navegador no deja recordar el dispositivo (modo privado o datos bloqueados). Ábrelo en Safari o Chrome normal.</p>');
    return false;
  }
  ACC.dev = dev;
  let devs;
  try{ devs = await dispositivosLink(token); }
  catch(e){ pantallaBloqueo(`<h2>Sin conexión</h2><p style="color:var(--mute)">${esc(e.message)}</p><button class="btn prim" onclick="location.reload()">Reintentar</button>`); return false; }
  const mio = devs.get(dev);
  if(mio && mio.estado === 'ok') return true;
  if(!mio){
    const cupos = Math.max(1, parseInt(ACC.link.cupos, 10) || 2);
    const usados = [...devs.values()].filter(d => d.estado === 'ok').length;
    try{
      if(usados < cupos){ await estadoDev(token, dev, 'ok', nombreEquipo()); return true; }
      await estadoDev(token, dev, 'pendiente', nombreEquipo());
    }catch(e){ pantallaBloqueo(`<h2>Sin conexión</h2><p style="color:var(--mute)">${esc(e.message)}</p><button class="btn prim" onclick="location.reload()">Reintentar</button>`); return false; }
  }
  esperarAutorizacion(token, dev, mio ? mio.estado : 'pendiente');
  return false;
}
function esperarAutorizacion(token, dev, estado){
  const pintar = est => pantallaBloqueo(est === 'bloqueado'
    ? `<h2>Sin acceso en este dispositivo</h2><p style="color:var(--mute)">Este link ya no está autorizado en este ${esc(nombreEquipo())}.</p><button class="btn prim" id="pedirAcc">Pedir acceso</button>`
    : `<h2>Esperando autorización</h2><p style="color:var(--mute)">Este link ya se abrió en otro dispositivo. Avísale a quien te lo compartió para que autorice este <b>${esc(nombreEquipo())}</b>. La pantalla se abre sola cuando lo haga.</p>`);
  pintar(estado);
  document.addEventListener('click', async e => {
    if(e.target.id !== 'pedirAcc') return;
    e.target.disabled = true;
    try{ await estadoDev(token, dev, 'pendiente', nombreEquipo()); pintar('pendiente'); }catch(_){ e.target.disabled = false; }
  });
  setInterval(async () => {
    try{ const d = (await dispositivosLink(token)).get(dev); if(d && d.estado === 'ok') location.reload(); else if(d && d.estado !== estado){ estado = d.estado; pintar(estado); } }catch(_){}
  }, 10000);
}

/* ---------- Ajustes: links de administradores y PIN ---------- */
function urlGuardia(token){ const u = new URL('guardia.html', location.href); u.search = '?g=' + token; u.hash = ''; return u.toString(); }
function urlLink(token){ const u = new URL(location.href); u.search = '?a=' + token; u.hash = ''; return u.toString(); }
async function pintarAjustes(){
  const box = $('#v-cfg');
  box.innerHTML = '<div class="empty">Cargando…</div>';
  let links = [];
  let devRows = [], glinks = [];
  try{
    [links, devRows, glinks] = await Promise.all([
      api('eventos?select=detalle,created_at&tipo=eq.Config&edificio=eq.' + MON + '&detalle->>clase=eq.link&order=created_at.desc&limit=200'),
      api('eventos?select=detalle,created_at&tipo=eq.Config&edificio=eq.' + MON + '&detalle->>clase=eq.linkdev&order=created_at.desc&limit=1000'),
      api('eventos?select=detalle,created_at&tipo=eq.Config&edificio=eq.' + MON + '&detalle->>clase=eq.glink&order=created_at.desc&limit=200'),
    ]);
  }
  catch(e){ box.innerHTML = `<div class="err">No se pudo leer la nube (${esc(e.message)}).</div>`; return; }
  const eds = [...$('#edif').options].map(o => o.value).filter(Boolean);
  /* dispositivos por link (la versión más nueva de cada uno) */
  const devsDe = new Map();
  for(const x of devRows){ const d = detalleDe(x); if(!d.token || !d.dev) continue; if(!devsDe.has(d.token)) devsDe.set(d.token, new Map()); const m = devsDe.get(d.token); if(!m.has(d.dev)) m.set(d.dev, {...d, t: fecha(x.created_at)}); }
  /* solicitudes de acceso: solo de links que siguen activos; las de links ya desactivados se limpian solas */
  const nombreDe = new Map();
  for(const d of unicosPorToken(links)) nombreDe.set(d.token, {nombre: d.nombre || 'Administrador', clase: 'link', ed: edsDeLink(d).join('|'), url: urlLink(d.token)});
  for(const d of unicosPorToken(glinks)) nombreDe.set(d.token, {nombre: d.nombre || 'Guardia', clase: 'glink', ed: d.edificio || '', url: urlGuardia(d.token)});
  const huerfanos = [...devsDe.keys()].filter(tok => !nombreDe.has(tok));
  for(const tok of huerfanos){ devsDe.delete(tok); apiEscribir('DELETE', 'eventos?tipo=eq.Config&edificio=eq.' + MON + '&detalle->>clase=eq.linkdev&detalle->>token=eq.' + enc(tok)).catch(() => {}); }
  const solicitudes = [];
  for(const [tok, m] of devsDe) for(const d of m.values()) if(d.estado === 'pendiente') solicitudes.push({tok, d, l: nombreDe.get(tok)});
  const pendientes = solicitudes.length;
  const listaDevs = tok => { const m = devsDe.get(tok); const l = m ? [...m.values()].filter(d => d.estado !== 'bloqueado') : [];
    if(!l.length) return '<div style="font-size:13px;color:var(--mute);margin-top:6px">Aún no se abrió en ningún dispositivo.</div>';
    return l.map(d => `<div class="pres" style="border-top:1px solid var(--line)"><span class="n" style="font-weight:500">${esc(d.equipo || 'Dispositivo')}
      <span class="t" style="display:block">${d.estado === 'ok' ? 'autorizado ' + esc(hace(d.t)) : '<b style="color:var(--warn)">pide acceso</b> ' + esc(hace(d.t))}</span></span>
      ${d.estado === 'ok' ? `<button class="btn" data-a="quitar" data-dev="${esc(d.dev)}" data-eq="${esc(d.equipo || '')}" style="color:var(--bad)">Quitar</button>`
        : `<button class="btn" data-a="permitir" data-dev="${esc(d.dev)}" data-eq="${esc(d.equipo || '')}" style="color:var(--ok)">Permitir</button><button class="btn" data-a="quitar" data-dev="${esc(d.dev)}" data-eq="${esc(d.equipo || '')}">Rechazar</button>`}</div>`).join(''); };
  const usados = tok => { const m = devsDe.get(tok); return m ? [...m.values()].filter(d => d.estado === 'ok').length : 0; };
  box.innerHTML = `
    ${pendientes ? `<div class="h2" style="color:var(--warn)">Piden acceso (${pendientes})</div><div class="card">${solicitudes.map(x => `
      <div class="lnk" data-tok="${esc(x.tok)}" data-url="${esc(x.l.url)}" data-nom="${esc(x.l.nombre)}" data-ed="${esc(x.l.ed)}" data-clase="${x.l.clase}">
        <b>${esc(x.d.equipo || 'Dispositivo')}</b>
        <div style="font-size:13px;color:var(--mute)">Link: ${esc(x.l.nombre)} · pidió ${esc(hace(x.d.t))}</div>
        <div class="acts" style="margin-top:8px"><button class="btn" data-a="permitir" data-dev="${esc(x.d.dev)}" data-eq="${esc(x.d.equipo || '')}" style="color:var(--ok)">Permitir</button>
          <button class="btn" data-a="quitar" data-dev="${esc(x.d.dev)}" data-eq="${esc(x.d.equipo || '')}">Rechazar</button></div>
      </div>`).join('')}</div>` : ''}
    <div class="h2">Links para administradores</div>
    <div class="card">
      <div style="font-size:14px;color:var(--mute);margin-bottom:6px">Cada link muestra <b>solo los movimientos en vivo</b> de los edificios que marques (uno o varios). No ve guardias, informes ni otros edificios. Lo puedes cambiar o desactivar cuando quieras.</div>
      <label class="field"><span>Para quién es (ej. Brandon Rojas · Bramar Group)</span><input id="lNom" autocomplete="off"></label>
      <label class="field"><span>Dispositivos que pueden abrirlo (ej. 2 = su celular y su compu)</span><select id="lCupos">${[1,2,3,4,5].map(n => `<option ${n === 2 ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <div class="field"><span>Edificios que podrá ver</span><div id="lEds">${eds.map(e => `<label class="chk"><input type="checkbox" value="${esc(e)}" ${e === st.edif ? 'checked' : ''}> ${esc(e)}</label>`).join('')}</div></div>
      <div id="lMsg"></div>
      <button class="btn prim" id="lCrear">Crear link</button>
    </div>
    <div class="card">${links.length ? unicosPorToken(links).map(d => { const u = urlLink(d.token), le = edsDeLink(d);
      return `<div class="lnk" data-tok="${esc(d.token)}" data-url="${esc(u)}" data-nom="${esc(d.nombre || '')}" data-ed="${esc(le.join('|'))}" data-cupos="${esc(String(d.cupos || 2))}">
        <b>${esc(d.nombre || 'Administrador')}</b>
        <div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:4px">${le.map(e => `<span class="badge" style="background:var(--acc)">${esc(e)}</span>`).join('')}</div>
        <div class="u">${esc(u)}</div>
        <div style="font-size:13px;font-weight:700;margin-top:2px">Dispositivos: ${usados(d.token)} de ${esc(String(d.cupos || 2))}</div>
        ${listaDevs(d.token)}
        <div class="acts" style="margin-top:8px"><button class="btn" data-a="copiar">Copiar</button><button class="btn" data-a="compartir">Compartir</button><button class="btn" data-a="editar">Editar</button><button class="btn" data-a="borrar" style="color:var(--bad)">Desactivar</button></div>
      </div>`; }).join('') : '<div class="empty" style="padding:14px">Todavía no creaste links.</div>'}</div>
    <div class="h2">Links para guardias con iPhone</div>
    <div class="card">
      <div style="font-size:14px;color:var(--mute);margin-bottom:6px">Versión web de la app para registrar desde un iPhone: turno, visitas, recurrentes, rondas, incidentes, encomiendas y consultas. Queda amarrada al primer celular que la abre.</div>
      <label class="field"><span>Nombre (ej. iPhone portería Torre 1)</span><input id="gNom" autocomplete="off"></label>
      <label class="field"><span>Edificio</span><select id="gEd">${eds.map(e => `<option ${e === st.edif ? 'selected' : ''}>${esc(e)}</option>`).join('')}</select></label>
      <label class="field"><span>Bloque / torre (opcional)</span><input id="gBlo" autocomplete="off" placeholder="Ej. Torre 1"></label>
      <div class="row" style="margin-top:0"><label class="field" style="flex:1;margin:0"><span>Relevo 1</span><input id="gR1" type="time" value="08:00"></label><label class="field" style="flex:1;margin:0"><span>Relevo 2</span><input id="gR2" type="time" value="20:00"></label></div>
      <label class="field"><span>Fotos mínimas por ronda</span><select id="gFot">${[1,2,3,4,5,6,8,10].map(n => `<option ${n === 4 ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <div id="gMsg"></div>
      <button class="btn prim" id="gCrear">Crear link de guardia</button>
    </div>
    <div class="card">${glinks.length ? unicosPorToken(glinks).map(d => { const u = urlGuardia(d.token);
      return `<div class="lnk" data-tok="${esc(d.token)}" data-url="${esc(u)}" data-nom="${esc(d.nombre || '')}" data-ed="${esc(d.edificio || '')}" data-clase="glink">
        <b>${esc(d.nombre || 'Guardia')}</b>
        <div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:4px"><span class="badge" style="background:var(--ok)">${esc(d.edificio || '')}${d.bloque ? ' · ' + esc(d.bloque) : ''}</span></div>
        <div class="u">${esc(u)}</div>
        ${listaDevs(d.token)}
        <div class="acts" style="margin-top:8px"><button class="btn" data-a="copiar">Copiar</button><button class="btn" data-a="compartir">Compartir</button><button class="btn" data-a="borrar" style="color:var(--bad)">Desactivar</button></div>
      </div>`; }).join('') : '<div class="empty" style="padding:14px">Todavía no creaste links de guardia.</div>'}</div>
    <div class="h2">Seguridad</div>
    <div class="card">
      <div class="acts"><button class="btn" id="cPin">Cambiar PIN</button><button class="btn" id="cSalir">Cerrar sesión en este celular</button></div>
    </div>
    <div class="msg">Los links bloquean la pantalla en su edificio, pero como la app usa la clave pública de Supabase, alguien con conocimientos técnicos podría leer otros datos. Compártelos solo con personas de confianza.</div>`;
}
$('#v-cfg').addEventListener('click', async ev => {
  const t = ev.target;
  if(t.id === 'lCrear'){
    const nombre = $('#lNom').value.trim(), elegidos = [...document.querySelectorAll('#lEds input:checked')].map(i => i.value);
    if(!nombre){ $('#lMsg').innerHTML = '<div class="msg bad">Escribe para quién es el link.</div>'; return; }
    if(!elegidos.length){ $('#lMsg').innerHTML = '<div class="msg bad">Marca al menos un edificio.</div>'; return; }
    t.disabled = true;
    try{ await apiEscribir('POST', 'eventos', nuevoEvento('Config', MON, 'Supervisión', {clase:'link', token: azar(20), edificio: elegidos[0], edificios: elegidos, nombre, cupos: parseInt($('#lCupos').value, 10) || 2})); pintarAjustes(); }
    catch(e){ $('#lMsg').innerHTML = `<div class="msg bad">No se pudo crear (${esc(e.message)}).</div>`; t.disabled = false; }
    return;
  }
  if(t.id === 'gCrear'){
    const nombre = $('#gNom').value.trim(), r1 = $('#gR1').value, r2 = $('#gR2').value;
    if(!nombre){ $('#gMsg').innerHTML = '<div class="msg bad">Escribe un nombre para el link.</div>'; return; }
    t.disabled = true;
    try{
      await apiEscribir('POST', 'eventos', nuevoEvento('Config', MON, 'Supervisión', {clase:'glink', token: azar(20), nombre, edificio: $('#gEd').value,
        bloque: $('#gBlo').value.trim(), relevos: [r1, r2].filter(Boolean).join(',') || '08:00,20:00', ronda_fotos: parseInt($('#gFot').value, 10) || 4, cupos: 1}));
      pintarAjustes();
    }catch(e){ $('#gMsg').innerHTML = `<div class="msg bad">No se pudo crear (${esc(e.message)}).</div>`; t.disabled = false; }
    return;
  }
  if(t.id === 'cSalir'){ guardar('sup', ''); location.reload(); return; }
  if(t.id === 'cPin'){
    const a = prompt('PIN nuevo (4 a 8 números):'); if(a === null) return;
    if(!/^\d{4,8}$/.test(a.trim())) return alert('El PIN debe tener de 4 a 8 números.');
    if(prompt('Repite el PIN nuevo:') !== a) return alert('Los PIN no coinciden.');
    try{ await guardarPin(a.trim()); alert('PIN cambiado. Los demás celulares lo pedirán de nuevo.'); }catch(e){ alert('No se pudo cambiar: ' + e.message); }
    return;
  }
  const fila = t.closest('.lnk'); if(!fila || !t.dataset.a) return;
  const url = fila.dataset.url;
  if(t.dataset.a === 'copiar'){
    try{ await navigator.clipboard.writeText(url); t.textContent = 'Copiado ✓'; }catch(_){ prompt('Copia el link:', url); }
  } else if(t.dataset.a === 'compartir'){
    const texto = fila.dataset.clase === 'glink' ? `Osiris · App del guardia (${fila.dataset.ed}): ${url}` : `Osiris · Monitoreo en vivo de ${fila.dataset.ed.split('|').join(', ')}: ${url}`;
    if(navigator.share){ try{ await navigator.share({title:'Osiris · Monitoreo', text:texto}); }catch(_){} }
    else location.href = 'https://wa.me/?text=' + enc(texto);
  } else if(t.dataset.a === 'editar'){
    editarLink(fila.dataset.tok, fila.dataset.nom, fila.dataset.ed.split('|').filter(Boolean), parseInt(fila.dataset.cupos, 10) || 2);
  } else if(t.dataset.a === 'permitir' || t.dataset.a === 'quitar'){
    if(t.dataset.a === 'quitar' && !confirm(`¿Quitar el acceso a ${t.dataset.eq || 'este dispositivo'}? Si lo vuelve a abrir, tendrá que pedirte permiso.`)) return;
    t.disabled = true;
    try{ await estadoDev(fila.dataset.tok, t.dataset.dev, t.dataset.a === 'permitir' ? 'ok' : 'bloqueado', t.dataset.eq); pintarAjustes(); }
    catch(e){ alert('No se pudo: ' + e.message); t.disabled = false; }
  } else if(t.dataset.a === 'borrar'){
    if(!confirm(`¿Desactivar el link de ${fila.dataset.nom || 'este administrador'}? Dejará de funcionar al instante.`)) return;
    try{
      await apiEscribir('DELETE', 'eventos?tipo=eq.Config&edificio=eq.' + MON + '&detalle->>clase=eq.' + (fila.dataset.clase === 'glink' ? 'glink' : 'link') + '&detalle->>token=eq.' + enc(fila.dataset.tok));
      await apiEscribir('DELETE', 'eventos?tipo=eq.Config&edificio=eq.' + MON + '&detalle->>clase=eq.linkdev&detalle->>token=eq.' + enc(fila.dataset.tok));
      pintarAjustes();
    }
    catch(e){ alert('No se pudo desactivar: ' + e.message); }
  }
});

/* Un link editado deja varias versiones: se muestra la más nueva de cada uno */
function unicosPorToken(rows){
  const vistos = new Set(), out = [];
  for(const x of rows){ const d = detalleDe(x); if(!d.token || vistos.has(d.token)) continue; vistos.add(d.token); out.push(d); }
  return out;
}
/* Cambiar los edificios de un link SIN cambiar el link (el administrador sigue usando el mismo) */
function editarLink(token, nombre, actuales, cupos){
  const eds = [...$('#edif').options].map(o => o.value).filter(Boolean);
  const todos = [...new Set([...eds, ...actuales])];
  $('#panel').innerHTML = `<button class="btn close" id="cerrar">Cerrar</button>
    <h2>${esc(nombre || 'Administrador')}</h2><div class="sub">Edificios y dispositivos de su link (el link no cambia)</div>
    <label class="field"><span>Nombre</span><input id="eNom" value="${esc(nombre)}"></label>
    <label class="field"><span>Dispositivos que pueden abrirlo</span><select id="eCupos">${[1,2,3,4,5].map(n => `<option ${n === cupos ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    <div class="card" id="eEds">${todos.map(e => `<label class="chk"><input type="checkbox" value="${esc(e)}" ${actuales.includes(e) ? 'checked' : ''}> ${esc(e)}</label>`).join('')}</div>
    <div id="eMsg"></div><button class="btn prim" id="eOk">Guardar</button>`;
  $('#sheet').classList.add('on');
  $('#eOk').onclick = async () => {
    const el = [...document.querySelectorAll('#eEds input:checked')].map(i => i.value), nom = $('#eNom').value.trim() || nombre;
    if(!el.length) return $('#eMsg').innerHTML = '<div class="msg bad">Marca al menos un edificio (o usa Desactivar).</div>';
    $('#eOk').disabled = true;
    try{
      const ev = nuevoEvento('Config', MON, 'Supervisión', {clase:'link', token, edificio: el[0], edificios: el, nombre: nom, cupos: parseInt($('#eCupos').value, 10) || 2});
      await apiEscribir('POST', 'eventos', ev);
      await apiEscribir('DELETE', 'eventos?tipo=eq.Config&edificio=eq.' + MON + '&detalle->>clase=eq.link&detalle->>token=eq.' + enc(token) + '&detalle->>uid=neq.' + enc(ev.detalle.uid));
      $('#sheet').classList.remove('on'); pintarAjustes();
    }catch(x){ $('#eMsg').innerHTML = `<div class="msg bad">No se pudo guardar (${esc(x.message)}).</div>`; $('#eOk').disabled = false; }
  };
}

/* ---------- Navegación ---------- */
function irA(v){
  vistaActual = v;
  for(const x of ['mov','gua','bus','inf','edi','cfg']) $('#v-' + x).hidden = x !== v;
  [...$('#bnav').children].forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('#tabs').style.display = v === 'mov' ? '' : 'none';
  $('#online').style.display = v === 'mov' ? '' : 'none';
  $('#periodo').hidden = v !== 'mov';
  $('#mesSel').hidden = !(v === 'gua' || v === 'inf' || v === 'bus');
  scrollTo({top:0});
  if(v === 'mov') refrescar();
  if(v === 'gua') cargarGuardias();
  if(v === 'inf') pintarInforme();
  if(v === 'edi') pintarEdificio();
  if(v === 'bus') pintarBuscar();
  if(v === 'cfg') pintarAjustes();
}
function refrescarVista(){
  if(vistaActual === 'mov') refrescar(true);
  else if(vistaActual === 'gua') cargarGuardias();
  else if(vistaActual === 'inf') pintarInforme();
  else if(vistaActual === 'bus'){ if(BUS.res.length) buscar(); else pintarBuscar(); }
  else if(vistaActual === 'edi'){ if(ED.sucio[ED.sub]) return; delete ED.datos[ED.sub]; pintarEdificio(); }
  else pintarAjustes();
}
function alCambiarEdificio(){ GU.datos = null; BUS.res = []; BUS.sel = new Set(); if(vistaActual === 'bus') pintarBuscar(); ED.datos = {}; ED.sucio = {}; ED.cfg = null; if(vistaActual === 'edi') pintarEdificio(); if(vistaActual === 'gua') cargarGuardias(); if(vistaActual === 'inf') pintarInforme(); }
$('#bnav').addEventListener('click', e => { const b = e.target.closest('button'); if(b) irA(b.dataset.v); });
$('#mesSel').addEventListener('change', () => { if(vistaActual === 'bus'){ BUS.res = []; pintarBuscar(); } if(vistaActual === 'gua') cargarGuardias(); if(vistaActual === 'inf') pintarInforme(); });

/* ---------- Arranque ---------- */
(async function(){
  document.querySelectorAll('.nico').forEach(n => n.innerHTML = icono(n.dataset.ico, 22));
  const p = leer('periodo'); if(p && [...$('#periodo').options].some(o => o.value === p)){ st.periodo = p; $('#periodo').value = p; }
  llenarMeses();
  pintarTabs();
  $('#list').innerHTML = '<div class="empty">Cargando movimientos…</div>';
  const token = new URLSearchParams(location.search).get('a');
  if(token){
    ACC.modo = 'admin';
    document.body.classList.add('admin');
    if(!(await accesoAdmin(token))) return;
    if(!(await autorizarDispositivo(token))) return;
    if(ACC.eds.length === 1){
      st.edif = ACC.eds[0];
      $('#edif').hidden = true;
      $('#edifFijo').hidden = false; $('#edifFijo').textContent = st.edif;
      document.title = 'Osiris · ' + st.edif;
    } else {
      /* varios edificios: el selector muestra SOLO los suyos */
      const pedido = new URLSearchParams(location.search).get('e'), previo = leer('edif_' + token);
      st.edif = ACC.eds.find(e => e === pedido) || ACC.eds.find(e => e === previo) || ACC.eds[0];
      $('#edif').innerHTML = ACC.eds.map(e => `<option value="${esc(e)}">${esc(e)}</option>`).join('');
      $('#edif').value = st.edif;
      $('#edif').addEventListener('change', () => guardar('edif_' + token, $('#edif').value));
      document.title = 'Osiris · Monitoreo';
    }
  } else {
    if(!(await accesoSupervision())) return;
    $('#bnav').hidden = false;
    try{ await cargarEdificios(); }
    catch(e){
      $('#dot').classList.add('off'); $('#liveTxt').textContent = 'Sin conexión';
      $('#list').innerHTML = `<div class="err">No se pudo conectar con la nube (${esc(e.message)}).<br>Toca ↻ para reintentar.</div>`;
      $('#refresh').addEventListener('click', () => location.reload(), {once:true});
      return;
    }
  }
  await refrescar();
  st.timer = setInterval(() => {
    if(document.hidden || vistaActual !== 'mov') return;
    if(ACC.modo === 'admin'){
      /* si desactivan el link, deja de mostrar datos */
      Promise.all([leerLink(token), dispositivosLink(token)]).then(([d, devs]) => {
        if(!d){ clearInterval(st.timer); pantallaBloqueo('<h2>Link desactivado</h2><p style="color:var(--mute)">Este link ya no tiene acceso.</p>'); return; }
        const yo = devs.get(ACC.dev);
        if(!yo || yo.estado !== 'ok'){ clearInterval(st.timer); esperarAutorizacion(token, ACC.dev, 'bloqueado'); return; }
        /* si supervisión cambió sus edificios, se recarga con la lista nueva */
        if(edsDeLink(d).join('|') !== ACC.eds.join('|')) location.reload();
      }).catch(() => {});
    }
    refrescar();
  }, REFRESCO_MS);
})();

</script>
