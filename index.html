/* Carga jsPDF solo cuando se necesita (CDN principal y, si falla, el alternativo) */
function cargarScript(src){
  return new Promise((ok, mal) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => mal(new Error('no cargó ' + src)); document.head.appendChild(s); });
}
async function cargarJsPDF(){
  if(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API.autoTable) return window.jspdf.jsPDF;
  const fuentes = [
    ['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'],
    ['https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js', 'https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js'],
  ];
  let err;
  for(const [a, b] of fuentes){
    try{
      if(!(window.jspdf && window.jspdf.jsPDF)) await cargarScript(a);
      if(!window.jspdf.jsPDF.API.autoTable) await cargarScript(b);
      if(window.jspdf.jsPDF.API.autoTable) return window.jspdf.jsPDF;
    }catch(x){ err = x; }
  }
  throw err || new Error('no se pudo cargar el generador de PDF');
}

/* Texto apto para la fuente del PDF (Latin-1) */
function pdfTxt(v){
  return String(v ?? '').replace(/[→⇒]/g, '->').replace(/[–—]/g, '-').replace(/[“”]/g, '"').replace(/[‘’]/g, "'")
    .replace(/…/g, '...').replace(/•/g, '-').replace(/[^\x00-\xFF]/g, '').trim();
}
const fDia = t => String(t.getDate()).padStart(2,'0') + '/' + String(t.getMonth()+1).padStart(2,'0') + '/' + t.getFullYear();
const fHora = t => String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
const fDiaHora = t => t ? String(t.getDate()).padStart(2,'0') + '/' + String(t.getMonth()+1).padStart(2,'0') + ' ' + fHora(t) : '';
const normal = s => String(s ?? '').trim().toLowerCase().replace(/\s+/g, ' ');

/* Une cada llegada (visita, encomienda, hospedaje) con su salida/entrega: por ref; si no hay ref (registros
   anteriores a la v12.5), con la última llegada anterior de la misma persona y depto que no tenga salida */
function emparejar(entradas, salidas, clave){
  const porRef = new Map(); entradas.forEach(x => { if(x.d.ref) porRef.set(String(x.d.ref), x); });
  const ordenadas = [...salidas].sort((a,b) => a.t - b.t);
  for(const s of ordenadas){
    let e = s.d.ref ? porRef.get(String(s.d.ref)) : null;
    if(e && e.salida) e = null;
    if(!e){
      const k = clave(s.d);
      const cand = entradas.filter(x => !x.salida && x.t <= s.t && clave(x.d) === k && (!s.d.ref || !x.d.ref));
      e = cand.length ? cand[cand.length - 1] : null;
    }
    if(e) e.salida = s;
  }
}


async function generarInforme(){
  const ed = st.edif, mes = mesActual(), P = prefInforme();
  const res = $('#iRes'), btn = $('#iGen');
  const paso = t => res.innerHTML = `<div class="msg">${esc(t)}</div>`;
  if(!SECC_INF.some(s => P.secc[s.k])){ res.innerHTML = '<div class="msg bad">Marca al menos una sección.</div>'; return; }
  btn.disabled = true;
  try{
    paso('Cargando el generador de PDF…');
    const JsPDF = await cargarJsPDF();
    paso('Leyendo los movimientos del mes…');
    const desde = new Date(mes.y, mes.m, 1), hasta = new Date(mes.y, mes.m + 1, 1);
    const hastaQ = new Date(mes.y, mes.m + 1, 4);   // salidas y subidas tardías de los últimos días
    const filas = await paginas('eventos?select=*&edificio=eq.' + enc(ed) + '&created_at=gte.' + enc(desde.toISOString())
      + '&created_at=lt.' + enc(hastaQ.toISOString()) + '&tipo=' + enc(inList(OPERATIVOS)) + '&order=created_at.asc,id.asc');
    /* sin duplicados (mismo uid) y con su hora real */
    const vistos = new Set(), ev = [];
    for(const e of filas){
      const d = detalleDe(e), u = d.uid || ('id' + e.id);
      if(vistos.has(u)) continue; vistos.add(u);
      ev.push({e, d, t: horaReal(e), g: e.guardia || ''});
    }
    ev.sort((a,b) => a.t - b.t);
    const delMes = x => x.t >= desde && x.t < hasta;
    const de = (...tipos) => ev.filter(x => tipos.includes(x.e.tipo));
    const base = x => ({fecha: fDia(x.t), hora: fHora(x.t)});

    /* ---- filas de cada sección (objetos por columna) ---- */
    const datos = {};
    const visEnt = de('Visita').filter(x => normal(x.d.tipo) !== 'recurrente salida');
    if(P.secc.visitas){
      const sal = [...de('Salida de visita'), ...de('Visita').filter(x => normal(x.d.tipo) === 'recurrente salida')];
      emparejar(visEnt, sal, d => normal(d.nombre) + '|' + normal(d.depto));
      datos.visitas = visEnt.filter(delMes).map((x, i) => {
        const d = x.d, s = x.salida;
        return {...base(x), n: String(i + 1), visitante: d.nombre, ci: d.ci, depto: d.depto, autoriza: d.autoriza,
          motivo: [d.motivo, normal(d.tipo).startsWith('recurrente') ? 'recurrente' : ''].filter(Boolean).join(' - '),
          placa: d.placa, tarjeta: d.tarjeta || (s && s.d.tarjeta) || '', salida: s ? fDiaHora(s.t) : '',
          devolvio: s && s.d.tarjeta_devuelta === true ? 'Sí' : (s && s.d.tarjeta_devuelta === false ? 'NO' : ''),
          registro: x.g, registroSal: s ? s.g : ''};
      });
    }
    if(P.secc.encom){
      const ent = de('Encomienda');
      emparejar(ent, de('Entrega de encomienda'), d => normal(d.depto) + '|' + normal(d.destinatario));
      const hayEntregas = ent.some(x => x.salida);
      datos.encom = ent.filter(delMes).map(x => ({...base(x), depto: x.d.depto, dest: x.d.destinatario, empresa: x.d.empresa, recibio: x.g,
        entregada: x.salida ? fDiaHora(x.salida.t) : (hayEntregas ? 'Pendiente' : ''), entrego: x.salida ? x.salida.g : ''}));
    }
    const TIPO_ADV = {tarde:'Ingreso tarde', tarjeta:'Tarjeta no devuelta', tarjeta_turno:'Tarjetas sin devolver', uniforme:'Sin uniforme'};
    if(P.secc.incid){
      datos.incid = de('Incidente').filter(delMes).map(x => ({...base(x), tipo: x.d.tipo || 'Incidente', lugar: x.d.lugar,
        detalle: x.d.descripcion || x.d.observaciones || x.d.motivo, bloque: x.d.bloque, registro: x.g}));
    }
    if(P.secc.advert){
      datos.advert = de('Advertencia','Guardia sin uniforme').filter(delMes).map(x => x.e.tipo === 'Advertencia'
        ? {...base(x), tipo: TIPO_ADV[x.d.tipo] || x.d.tipo || 'Advertencia', detalle: x.d.motivo || x.d.mensaje, bloque: x.d.bloque, registro: x.g}
        : {...base(x), tipo: 'Sin uniforme', detalle: 'Inició turno sin uniforme', bloque: x.d.bloque, registro: x.g});
    }
    if(P.secc.turnos){
      datos.turnos = de('Ingreso de turno','Salida de turno','Doblar turno').filter(delMes).map(x => ({...base(x),
        mov: x.e.tipo === 'Doblar turno' ? 'Dobla turno' : x.e.tipo.replace(' de turno', ''), guardia: x.g, ci: x.d.guard_ci,
        bloque: x.d.bloque, turno: x.d.nivel ? x.d.nivel + ' h' : '', obs: x.d.observaciones}));
    }
    if(P.secc.rondas){
      datos.rondas = de('Ronda').filter(delMes).map(x => ({...base(x), guardia: x.g, bloque: x.d.bloque, puntos: x.d.puntos,
        fotos: x.d.fotos != null ? String(x.d.fotos) : '', obs: x.d.observaciones}));
    }
    if(P.secc.hosp){
      const ent = de('Hospedaje');
      emparejar(ent, de('Salida de hospedaje'), d => normal(d.huesped) + '|' + normal(d.depto));
      datos.hosp = ent.filter(delMes).map(x => ({...base(x), depto: x.d.depto, huesped: x.d.huesped, documento: x.d.documento,
        plataforma: x.d.plataforma, noches: String(x.d.noches ?? ''), huespedes: String(x.d.huespedes ?? ''),
        salida: x.salida ? fDiaHora(x.salida.t) : '', registro: x.g}));
    }
    let cfg = null;
    if(P.secc.horas){
      paso('Calculando horas del personal…');
      const [regG, c] = await Promise.all([leerRegistro(ed), leerConfig(ed)]); cfg = c;
      const horas = await horasDelMes(ed, mes.y, mes.m, regG, cfg);
      datos.horas = [...horas.entries()].map(([k, r]) => { const g = regG.get(k); return {
        guardia: g ? g.nombre : r.guardia, ci: g ? g.ci : k, turno: g ? (TURNO_TXT[g.turno] || g.turno) : '',
        dias: String(r.dias), n12: String(r.n12), n24: String(r.n24), n36: String(r.n36),
        horas: Turnos.duracion(Math.round(r.horas * 60)), aFavor: Turnos.saldo(r.aFavor),
        enContra: Math.round(r.enContra * 60) ? '-' + Turnos.duracion(Math.round(r.enContra * 60)) : '0 h',
        saldo: g && g.turno === 'FRANQUERO' ? 'No aplica' : Turnos.saldo(r.saldo), tarde: String(r.vecesTarde), incompletos: String(r.incompletos)}; })
        .sort((a, b) => a.guardia.localeCompare(b.guardia, 'es'));
    }

    paso('Armando el PDF…');
    const doc = new JsPDF({orientation:'landscape', unit:'mm', format: PAPELES[P.papel].f});
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    const M = 12, TOPE = 32;                          // margen lateral y alto de la franja superior
    const gris = [95, 105, 112], claro = [239, 243, 245], linea = [214, 222, 227];
    let y = TOPE + 4;
    const nuevaPagina = () => { doc.addPage(); y = TOPE + 4; };

    /* Resumen en recuadros */
    /* Los totales salen de las MISMAS filas que las tablas: nunca pueden no coincidir */
    const resumenItems = [];
    const nT = m => (datos.turnos || []).filter(r => r.mov === m).length;
    for(const [k, t] of [['visitas','Visitas'],['encom','Encomiendas'],['incid','Incidentes'],['advert','Advertencias'],['rondas','Rondas'],['turnos',''],['hosp','Hospedajes']]){
      if(!P.secc[k]) continue;
      if(k === 'turnos'){ resumenItems.push(['Ingresos de turno', nT('Ingreso')], ['Salidas de turno', nT('Salida')]); }
      else resumenItems.push([t, (datos[k] || []).length]);
    }
    if(resumenItems.length){
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12.5); doc.setTextColor(...COLOR_TITULO);
    doc.text('Resumen del mes', M, y); y += 3;
    const nb = Math.max(resumenItems.length, 6), bw = (W - 2 * M - (nb - 1) * 3) / nb;
    resumenItems.forEach(([t, n], i) => {
      const x = M + i * (bw + 3);
      doc.setFillColor(...claro); doc.setDrawColor(...linea); doc.roundedRect(x, y, bw, 17, 2, 2, 'FD');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(...COLOR_TITULO); doc.text(String(n), x + bw / 2, y + 8.5, {align:'center'});
      doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(55, 65, 72); doc.text(pdfTxt(t), x + bw / 2, y + 13.8, {align:'center'});
    });
    y += 27;
    }

    /* Tablas */
    const notas = [];
    for(const s of SECC_INF){
      if(!P.secc[s.k]) continue;
      const rows = datos[s.k] || [];
      let cols = s.cols.filter(([c]) => !P.ocultas[s.k].includes(c));
      if(P.vacias && rows.length) cols = cols.filter(([c]) => rows.some(r => String(r[c] ?? '').trim() !== ''));
      if(y > H - 45) nuevaPagina();
      doc.setFont('helvetica', 'bold'); doc.setFontSize(12.5); doc.setTextColor(...COLOR_TITULO);
      doc.text(pdfTxt(s.t), M, y);
      if(rows.length){ const tw = doc.getTextWidth(pdfTxt(s.t)); doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...gris); doc.text(`(${rows.length})`, M + tw + 2, y); }
      doc.setDrawColor(...COLOR_MARCA); doc.setLineWidth(0.4); doc.line(M, y + 1.8, W - M, y + 1.8); doc.setLineWidth(0.2);
      if(!rows.length){ doc.setFont('helvetica', 'italic'); doc.setFontSize(9); doc.setTextColor(...gris); doc.text('Sin registros en el mes.', M, y + 8); y += 17; continue; }
      const estilos = {};
      cols.forEach(([c]) => { if(ANCHOS[c]) estilos[c] = {cellWidth: ANCHOS[c]}; });
      if(s.k === 'horas') ['dias','n12','n24','n36','tarde','incompletos'].forEach(c => estilos[c] = {...(estilos[c] || {}), halign:'center'});
      doc.autoTable({
        startY: y + 4, margin:{left:M, right:M, top:TOPE + 4, bottom:14},
        columns: cols.map(([c, t]) => ({header: pdfTxt(t), dataKey: c})),
        body: rows.map(r => { const o = {}; cols.forEach(([c]) => o[c] = pdfTxt(r[c])); return o; }),
        theme:'grid',
        styles:{font:'helvetica', fontSize:8.5, cellPadding:{top:2, bottom:2, left:2.2, right:2.2}, overflow:'linebreak', valign:'middle',
          lineColor: linea, lineWidth: 0.15, textColor:[40, 48, 54]},
        headStyles:{fillColor: COLOR_MARCA, textColor:255, fontStyle:'bold', fontSize:8.5, valign:'middle'},
        alternateRowStyles:{fillColor: claro},
        columnStyles: estilos,
        didParseCell: c => { if(c.section === 'body' && s.k === 'visitas' && c.column.dataKey === 'devolvio' && c.cell.raw === 'NO'){ c.cell.styles.textColor = [200, 30, 30]; c.cell.styles.fontStyle = 'bold'; } },
      });
      y = doc.lastAutoTable.finalY + 11;
      if(s.k === 'horas' && cfg) notas.push(cfg.unGuardia ? `Edificio de un solo guardia: las horas extras se cuentan contra su propio horario de relevo (quedarse después suma; llegar tarde o irse antes resta). Turno de 36 h: cuenta como día extra trabajado. Tolerancia ${cfg.tolerancia} min: pasado el margen se cuentan los minutos completos.` : `Horas extras solo entre los guardias fijos (diurno y nocturno), en espejo: lo que uno tiene a favor el otro lo tiene en contra (relevos con atraso o salida anticipada). Los franqueros no suman ni restan. Turno de 24 h: sale a la misma hora del día siguiente; turno de 36 h: cuenta como día extra trabajado, no como horas extras. El mes empieza con el diurno del día 1 y termina con el nocturno del último día. Tolerancia ${cfg.tolerancia} min: pasado el margen se cuentan los minutos completos.`);
    }
    if(notas.length){
      if(y > H - 25) nuevaPagina();
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...gris);
      doc.text(doc.splitTextToSize(pdfTxt(notas.join(' ')), W - 2 * M), M, y);
    }

    /* Franja con logo en cada página y pie */
    const n = doc.internal.getNumberOfPages(), ahora = new Date();
    for(let i = 1; i <= n; i++){
      doc.setPage(i);
      doc.setFillColor(...COLOR_MARCA); doc.rect(0, 0, W, 24, 'F');
      try{ doc.addImage(LOGO_OSIRIS, 'PNG', M, 3.2, 37, 17.4); }catch(_){}
      doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
      doc.text('Informe mensual de movimientos', W - M, 11, {align:'right'});
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5);
      doc.text(pdfTxt(`${ed}  |  ${mesTxt(mes)}`), W - M, 17.5, {align:'right'});
      doc.setDrawColor(...linea); doc.line(M, H - 10, W - M, H - 10);
      doc.setFontSize(7.5); doc.setTextColor(...gris);
      doc.text(pdfTxt(`OSIRIS Security  -  Generado el ${fDia(ahora)} a las ${fHora(ahora)}`), M, H - 6);
      doc.text(`Página ${i} de ${n}`, W - M, H - 6, {align:'right'});
    }
    doc.setTextColor(0);
    INF.nombre = pdfTxt(`Informe ${ed} ${mesTxt(mes)}.pdf`).replace(/[\\/:*?"<>|]/g, '-');
    INF.blob = doc.output('blob');
    if(INF.url) URL.revokeObjectURL(INF.url);
    INF.url = URL.createObjectURL(INF.blob);
    res.innerHTML = `<div class="msg ok">Informe listo: ${n} página${n === 1 ? '' : 's'}, hoja ${esc(PAPELES[P.papel].t.toLowerCase())} horizontal.</div>
      <div class="acts"><a class="btn prim" style="text-align:center;text-decoration:none" href="${INF.url}" download="${esc(INF.nombre)}" target="_blank" rel="noopener">Abrir / descargar</a>
      <button class="btn prim" id="iShare">Compartir</button></div>`;
  }catch(e){
    res.innerHTML = `<div class="msg bad">No se pudo generar el informe (${esc(e.message)}). Revisa tu conexión e inténtalo de nuevo.</div>`;
  }finally{ btn.disabled = false; }
}

/* ---------------- Ajustes del edificio (módulos) ---------------- */
async function leerModulos(ed){
  const r = await api('eventos?select=detalle,created_at&tipo=eq.Config&edificio=eq.' + enc(ed) + '&order=created_at.desc&limit=1');
  let m = r.length ? detalleDe(r[0]).modulos : null;
  if(typeof m === 'string'){ try{ m = JSON.parse(m); }catch(_){ m = null; } }
  return {mod: (m && typeof m === 'object' && !Array.isArray(m)) ? m : {}, existe: r.length > 0};
}
async function cargarAjustesEd(){
  const mio = ++ED.gen, ed = st.edif, c = $('#edCuerpo');
  try{
    const {mod, existe} = await leerModulos(ed);
    if(mio !== ED.gen) return;
    /* Sin configuración en la nube: se parte de todos los módulos encendidos (como viene la app) */
    if(!existe) MODULOS.forEach(([k]) => { if(!(k in mod)) mod[k] = true; });
    ED.cfg = {ed, mod: JSON.parse(JSON.stringify(mod))};
    const M = ED.cfg.mod;
    const torres = Array.isArray(M.torres) ? M.torres.map(String) : [];
    const sw = (k, t, porDefecto) => `<label class="chk"><input type="checkbox" data-mod="${k}" ${(porDefecto ? M[k] !== false : M[k] === true) ? 'checked' : ''}> ${esc(t)}</label>`;
    const dig = Number.isInteger(+M.tarjeta_digitos) && +M.tarjeta_digitos ? +M.tarjeta_digitos : 10;
    const rel = relevosDe(M), nMod = MODULOS.filter(([k]) => M[k] === true).length;
    c.innerHTML = `
      <div class="fab"><button class="btn" id="aNuevoEd">${icono('mas1', 16)} Nuevo edificio</button></div>
      ${existe ? '' : '<div class="msg">Sin configuración de la app todavía.</div>'}
      ${acc('modulos', 'Módulos de la app', `${nMod} de ${MODULOS.length} activos`, MODULOS.map(([k,t]) => sw(k, t, false)).join(''))}
      ${acc('visita', 'Campos de visita', `Tarjeta de ${dig} dígitos`, CAMPOS_VISITA.map(([k,t]) => sw(k, t, true)).join('')
        + `<label class="field"><span>Dígitos de la tarjeta</span><input id="aDig" type="number" min="3" max="16" value="${dig}" inputmode="numeric"></label>`)}
      ${acc('reloj', 'Turnos y avisos', `Relevos ${esc(rel[0] || '08:00')} y ${esc(rel[1] || '20:00')} · rondas cada ${+M.ronda_cada || 2} h`, `
        <div class="dos"><label class="field"><span>Relevo 1</span><input id="aR1" type="time" value="${esc(rel[0] || '08:00')}"></label>
          <label class="field"><span>Relevo 2</span><input id="aR2" type="time" value="${esc(rel[1] || '20:00')}"></label></div>
        <div class="dos"><label class="field"><span>Rondas cada (h)</span><input id="aRonda" type="number" min="1" max="12" value="${+M.ronda_cada || 2}" inputmode="numeric"></label>
          <label class="field"><span>Tolerancia (min)</span><input id="aTol" type="number" min="0" max="60" step="5" value="${Turnos.toleranciaDe(M)}" inputmode="numeric"></label></div>
        <label class="chk"><input type="checkbox" data-mod="alertas" ${M.alertas !== false ? 'checked' : ''}> Correo si el guardia no entra</label>
        <label class="chk"><input type="checkbox" data-mod="alertas_ronda" ${M.alertas_ronda === true ? 'checked' : ''}> Correo si falta una ronda</label>
        <label class="chk"><input type="checkbox" data-mod="un_guardia" ${M.un_guardia === true ? 'checked' : ''}> Un solo guardia (sin relevo)</label>
        ${info('Al cambiar el relevo 1, el 2 se pone 12 h después. Los celulares con horario propio lo mantienen. La tolerancia es el margen que no cuenta; pasado el margen se cuentan todos los minutos. Los correos llegan 30 minutos después del relevo o de la ronda que faltó. "Un solo guardia": sus horas extras se cuentan contra su propio horario.')}`)}
      ${acc('edificio', 'Bloques / torres', torres.length ? esc(torres.join(' · ')) : 'Sin bloques', `
        <div id="aTorres" style="display:flex;flex-wrap:wrap;gap:6px">${torres.map((t,i) => `<button class="tab on" data-torre="${i}">${esc(t)} ✕</button>`).join('') || '<span style="color:var(--mute);font-size:14px">Edificio sin bloques</span>'}</div>
        <div class="row"><input id="aTorreN" class="inp" style="flex:1" placeholder="Nuevo bloque"><button class="btn" id="aTorreAdd" style="height:46px">Agregar</button></div>`)}
      <div id="aMsg"></div>
      <button class="btn prim" id="aGuardar" style="margin-top:6px">Guardar y enviar</button>
      ${info('Los celulares del edificio aplican los cambios en 1 a 2 minutos (con internet).', 'Cuándo se aplica')}`;
    ED.cfg.torres = torres;
  }catch(e){ if(mio === ED.gen) c.innerHTML = `<div class="err">No se pudo leer la nube (${esc(e.message)}).</div>`; }
}

  const torres = [];
  $('#panel').innerHTML = `<button class="btn close" id="cerrar">Cerrar</button>
    <h2>Nuevo edificio</h2><div class="sub">Aparecerá en la app de todos los celulares</div>
    <label class="field"><span>Nombre del edificio</span><input id="nNom" autocomplete="off" autocapitalize="words"></label>

    <div class="field"><span>Módulos</span><div class="card" style="margin:0">${MODULOS.map(([k, t]) => `<label class="chk"><input type="checkbox" data-nm="${k}" ${k === 'hospedajes' || k === 'mantenimiento' ? '' : 'checked'}> ${esc(t)}</label>`).join('')}</div></div>
    <div id="nMsg"></div><button class="btn prim" id="nOk">Crear edificio</button>`;
  $('#sheet').classList.add('on');
  const pintarT = () => $('#nTor').innerHTML = torres.map((t, i) => `<button class="tab on" data-nt="${i}">${esc(t)} ✕</button>`).join('');
  $('#nTor').onclick = ev => { const b = ev.target.closest('[data-nt]'); if(b){ torres.splice(+b.dataset.nt, 1); pintarT(); } };
  $('#nTorAdd').onclick = () => { const v = $('#nTorN').value.trim(); if(v && !torres.includes(v)) torres.push(v); $('#nTorN').value = ''; pintarT(); };
  $('#nOk').onclick = async () => {
    const nombre = $('#nNom').value.trim().replace(/\s+/g, ' ');
    const existentes = [...$('#edif').options].map(o => o.value.toLowerCase());
    if(!nombre) return $('#nMsg').innerHTML = '<div class="msg bad">Escribe el nombre.</div>';
    if(nombre.startsWith('_') || nombre === '*') return $('#nMsg').innerHTML = '<div class="msg bad">Nombre no válido.</div>';
    if(existentes.includes(nombre.toLowerCase())) return $('#nMsg').innerHTML = '<div class="msg bad">Ya existe un edificio con ese nombre.</div>';
    const mod = {torres: [...torres], tolerancia_min: 15, tarjeta_digitos: 10};
    document.querySelectorAll('[data-nm]').forEach(i => mod[i.dataset.nm] = i.checked);
    $('#nOk').disabled = true;
    try{
      await apiEscribir('POST', 'eventos', nuevoEvento('Config', nombre, 'Supervisión', {modulos: JSON.stringify(mod)}));
      const sel = $('#edif'); const o = document.createElement('option'); o.value = o.textContent = nombre; sel.appendChild(o);
      [...sel.options].sort((a, b) => a.value.localeCompare(b.value, 'es')).forEach(x => sel.appendChild(x));
      sel.value = nombre; sel.dispatchEvent(new Event('change'));
      $('#sheet').classList.remove('on');
    }catch(x){ $('#nMsg').innerHTML = `<div class="msg bad">No se pudo crear (${esc(x.message)}).</div>`; $('#nOk').disabled = false; }
  };
}
$('#v-edi').addEventListener('click', async e => {
  if(!ED.cfg) return;
  const t = e.target;
  if(t.dataset && t.dataset.torre !== undefined){ ED.cfg.torres.splice(+t.dataset.torre, 1); return redibujarTorres(); }
  if(t.id === 'aTorreAdd'){ const v = $('#aTorreN').value.trim(); if(v && !ED.cfg.torres.includes(v)) ED.cfg.torres.push(v); $('#aTorreN').value = ''; return redibujarTorres(); }
  if(t.id === 'aGuardar'){
    const M = {...ED.cfg.mod};
    document.querySelectorAll('#edCuerpo [data-mod]').forEach(i => M[i.dataset.mod] = i.checked);
    const dig = parseInt($('#aDig').value, 10), tol = parseInt($('#aTol').value, 10);
    if(!(dig >= 3 && dig <= 16)) return $('#aMsg').innerHTML = '<div class="msg bad">Los dígitos de la tarjeta van de 3 a 16.</div>';
    if(!(tol >= 0 && tol <= 60)) return $('#aMsg').innerHTML = '<div class="msg bad">La tolerancia va de 0 a 60 minutos.</div>';
    const r1 = $('#aR1').value, r2 = $('#aR2').value, cada = parseInt($('#aRonda').value, 10);
    if(!/^\d\d:\d\d$/.test(r1) || !/^\d\d:\d\d$/.test(r2) || r1 === r2) return $('#aMsg').innerHTML = '<div class="msg bad">Revisa los dos horarios de relevo.</div>';
    if(!(cada >= 1 && cada <= 12)) return $('#aMsg').innerHTML = '<div class="msg bad">Las rondas van cada 1 a 12 horas.</div>';
    M.tarjeta_digitos = dig; M.tolerancia_min = tol; M.torres = [...ED.cfg.torres];
    M.relevos = [r1, r2].sort().join(','); M.ronda_cada = cada;
    t.disabled = true;
    try{
      await apiEscribir('POST', 'eventos', nuevoEvento('Config', ED.cfg.ed, 'Supervisión', {modulos: JSON.stringify(M)}));
      ED.cfg.mod = M; $('#aMsg').innerHTML = '<div class="msg ok">Guardado. Los celulares lo aplican en 1 a 2 minutos.</div>';
      GU.datos = null;
    }catch(x){ $('#aMsg').innerHTML = `<div class="msg bad">No se pudo guardar (${esc(x.message)}).</div>`; }
    t.disabled = false;
  }
});
function redibujarTorres(){

}

/* ---------------- Celulares (ajustes por dispositivo) ---------------- */
const AJ_DEF = {bloque:'', ronda_fotos:10, ronda_horas:2, notif_rondas:true, alarma_candados:true, control_uniforme:true,
  turno_ingreso:'', turno_salida:'', retencion_dias:90, camara_nativa:false, notif_metodo:'whatsapp', admin_whatsapp:'', admin_email:''};
async function cargarCelulares(){
  const mio = ++ED.gen, ed = st.edif, c = $('#edCuerpo');
  try{
    const [rep, ord, pres, cfg] = await Promise.all([
      api('eventos?select=created_at,detalle&tipo=eq.Equipo&edificio=eq.' + enc(ed) + '&order=created_at.desc&limit=300'),
      api('eventos?select=created_at,detalle&tipo=eq.AjustesEquipo&edificio=eq.' + enc(ed) + '&order=created_at.desc&limit=300'),
      api('presencia?select=device_id,guardia,last_seen,en_turno&edificio=eq.' + enc(ed) + '&limit=100').catch(() => []),
      leerConfig(ed),
    ]);
    if(mio !== ED.gen) return;
    const eq = new Map();
    for(const r of rep){ const d = detalleDe(r); if(d.device_id && !eq.has(d.device_id)) eq.set(d.device_id, {rep:d, t:fecha(r.created_at)}); }
    for(const r of ord){ const d = detalleDe(r); const x = eq.get(d.device_id); if(x && !x.orden) x.orden = {d, t:fecha(r.created_at)}; }
    const viejos = pres.filter(p => p.device_id && !eq.has(p.device_id));
    ED.equipos = eq; ED.torres = cfg.torres;
    const tarjeta = ([id, x]) => {
      const a = {...AJ_DEF, ...(x.rep.ajustes || {})};
      const p = pres.find(q => q.device_id === id);
      const visto = p && p.last_seen ? fecha(p.last_seen) : x.t;
      const pend = x.orden && x.orden.t > x.t;
      const hor = a.turno_ingreso && a.turno_salida ? `${a.turno_ingreso} / ${a.turno_salida}` : 'normal 08:00 / 20:00';
      return `<div class="card gcard" data-dev="${esc(id)}">
        <div class="gtop"><div class="gname">${esc(a.bloque || 'Sin bloque')}</div>${pend ? '<span class="badge" style="background:var(--warn)">PENDIENTE</span>' : ''}</div>
        <div class="gid">${esc(x.rep.modelo || 'Celular')} · app ${esc(x.rep.version || '')} · visto ${esc(hace(visto))}${p && p.guardia && p.guardia !== 'Sin turno' ? ' · ' + esc(p.guardia) : ''}</div>
        <div class="stats">
          <div class="stat"><b>${a.ronda_fotos}</b><small>Fotos por ronda</small></div>
          <div class="stat"><b>${a.notif_rondas ? a.ronda_horas + ' h' : 'No'}</b><small>Aviso de ronda</small></div>
          <div class="stat"><b style="font-size:13px">${esc(hor)}</b><small>Relevo</small></div>
          <div class="stat"><b>${Math.round(a.retencion_dias / 30)}</b><small>Meses de datos</small></div>
        </div>
        ${pend ? '<div class="msg" style="margin-bottom:0">Cambios enviados: el celular los aplica apenas se conecte (≈1 min).</div>' : ''}
      </div>`;
    };
    c.innerHTML = `
      ${eq.size ? [...eq.entries()].sort((a,b) => String((a[1].rep.ajustes||{}).bloque||'').localeCompare(String((b[1].rep.ajustes||{}).bloque||''))).map(tarjeta).join('')
        : '<div class="empty">Ningún celular de este edificio reportó todavía sus ajustes.</div>'}
      ${viejos.length ? `<div class="msg">${viejos.length} celular(es) de este edificio todavía tienen una versión anterior de la app; cuando la actualicen aparecerán aquí para configurarlos.</div>` : ''}
      ${info('Toca un celular para cambiar sus ajustes: fotos por ronda, cada cuántas horas avisar la ronda, horario de relevo, bloque, uniforme, alarma de candados, aviso de incidentes y más.')}`;
  }catch(e){ if(mio === ED.gen) c.innerHTML = `<div class="err">No se pudo leer la nube (${esc(e.message)}).</div>`; }
}
$('#v-edi').addEventListener('click', e => { const c = e.target.closest('[data-dev]'); if(c && ED.sub === 'celulares') formCelular(c.dataset.dev); });
function formCelular(id){

/* ---------------- Listas: propietarios, residentes, vehículos, contactos, reglamentos, puntos ---------------- */
async function cargarLista(clase){

      const r = await api('eventos?select=created_at,detalle&tipo=eq.Datos&edificio=eq.' + enc(ed) + '&detalle->>clase=eq.' + clase + '&order=created_at.desc&limit=1');
      if(mio !== ED.gen) return;
      const d = r.length ? detalleDe(r[0]) : null;
      ED.datos[clase] = {ed, filas: d && Array.isArray(d.filas) ? d.filas.map(f => ({...f})) : [], existe: !!d, t: r.length ? fecha(r[0].created_at) : null, origen: d ? d.origen : ''};

/* Sube un PDF o foto al almacenamiento de la nube (carpeta del edificio) */
async function subirDocumento(ed, archivo){
  const ext = (archivo.name.split('.').pop() || 'pdf').toLowerCase().replace(/[^a-z0-9]/g, '') || 'pdf';
  const tipo = archivo.type || (ext === 'pdf' ? 'application/pdf' : 'image/jpeg');
  const ruta = edSeguro(ed) + '/docs/' + Date.now() + '_web.' + ext;
  const r = await fetch(SB_URL + '/storage/v1/object/osiris/' + ruta, {method:'POST', headers:{apikey:SB_KEY, 'Content-Type':tipo, 'x-upsert':'true'}, body:archivo});
  if(!r.ok){ let t = ''; try{ t = await r.text(); }catch(_){}; throw new Error('HTTP ' + r.status + (t ? ': ' + t.slice(0, 120) : '')); }
  return SB_URL + '/storage/v1/object/public/osiris/' + ruta;
}

/* ---------- Excel ---------- */
async function cargarXLSX(){
  if(window.XLSX) return window.XLSX;
  for(const src of ['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js']){
    try{ await cargarScript(src); if(window.XLSX) return window.XLSX; }catch(_){}
  }
  throw new Error('no se pudo cargar el lector de Excel');
}
async function importarExcel(clase, archivo){
  const L = LISTAS[clase], D = ED.datos[clase];
  try{
    const X = await cargarXLSX();
    const wb = X.read(await archivo.arrayBuffer(), {type:'array'});
    const nuevas = [];
    for(const nombre of wb.SheetNames){
      const filas = X.utils.sheet_to_json(wb.Sheets[nombre], {header:1, raw:false, defval:''});
      /* la fila de encabezados: la primera (de las 10 primeras) donde se reconocen más columnas */
      let mejor = -1, mapa = null, puntos = 0;
      for(let h = 0; h < Math.min(10, filas.length); h++){
        const cab = filas[h].map(sinTildes), m = {}, usadas = new Set();
        /* primero las claves más específicas (ej. "telefono inquilino" antes que "telefono") */
        const orden = [...L.cols].sort((a, b) => Math.max(...b[2].map(x => x.length), 0) - Math.max(...a[2].map(x => x.length), 0));
        for(const [k, , pal] of orden){
          const j = cab.findIndex((c, n) => !usadas.has(n) && c && pal.some(p => c.includes(p)));
          if(j >= 0){ m[k] = j; usadas.add(j); }
        }
        const n = Object.keys(m).length;
        if(n > puntos){ puntos = n; mejor = h; mapa = m; }
      }
      if(!mapa || !L.principal.some(k => k in mapa)) continue;
      for(const fila of filas.slice(mejor + 1)){
        const o = {};
        for(const [k, j] of Object.entries(mapa)){ let v = String(fila[j] ?? '').trim(); if(/^\d+\.0$/.test(v)) v = v.slice(0, -2); if(v) o[k] = v; }
        if(!L.principal.some(k => o[k])) continue;
        if(clase === 'propietarios') o.id = edSeguro(D.ed) + '-' + (o.depto || 'x') + '-' + Date.now() + '-' + nuevas.length;
        nuevas.push(o);
      }
    }
    if(!nuevas.length) return alert('No encontré datos en ese archivo. La primera fila debe tener los títulos de las columnas (por ejemplo: Depto, Propietario, Teléfono).');
    const reemplazar = D.filas.length ? confirm(`Encontré ${nuevas.length} registros.\n\nAceptar = REEMPLAZAR la lista actual (${D.filas.length}).\nCancelar = AGREGARLOS a la lista actual.`) : true;
    D.filas = reemplazar ? nuevas : [...D.filas, ...nuevas];
    marcarSucio(clase); pintarEdificio();
  }catch(e){ alert('No se pudo leer el archivo: ' + e.message); }
  finally{ const i = $('#lArch'); if(i) i.value = ''; }
}
async function exportarExcel(clase){
  const L = LISTAS[clase], D = ED.datos[clase];
  try{
    const X = await cargarXLSX();
    const filas = [L.cols.map(c => c[1]), ...D.filas.map(f => L.cols.map(([k]) => f[k] || ''))];
    const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(filas), L.t.slice(0, 30));
    X.writeFile(wb, `${L.t} ${D.ed}.xlsx`);
  }catch(e){ alert('No se pudo crear el Excel: ' + e.message); }
}

/* Foto → JPEG reducido (para que el PDF no pese demasiado) */
async function fotoParaPdf(url){
  const r = await fetch(url, {cache:'force-cache'}); if(!r.ok) throw new Error('HTTP ' + r.status);
  const blob = await r.blob();
  const src = URL.createObjectURL(blob);
  try{
    const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => mal(new Error('imagen inválida')); i.src = src; });
    const k = Math.min(1, 1100 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return {data: c.toDataURL('image/jpeg', 0.82), w: c.width, h: c.height, bytes: blob.size};
  } finally { URL.revokeObjectURL(src); }
}
/* Ruta y hora de carga de una foto, a partir de su nombre en el servidor (empieza con la hora en milisegundos) */
function infoArchivo(url){
  const m = /\/object\/public\/([^?]+)/.exec(url), ruta = m ? decodeURIComponent(m[1]) : url;
  const n = /\/(\d{12,14})_[^/]*$/.exec(ruta);
  return {ruta, subida: n ? new Date(+n[1]) : null};
}
const fCompleta = t => t ? t.toLocaleString('es', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false}) : '-';
function huellaTexto(e){
  const d = detalleDe(e), orden = {};
  Object.keys(d).sort().forEach(k => orden[k] = d[k]);
  return JSON.stringify({id: e.id, tipo: e.tipo, edificio: e.edificio, guardia: e.guardia, created_at: e.created_at, device_id: e.device_id, detalle: orden});
}

/* SHA-256 (con respaldo en JS por si el navegador no trae crypto.subtle) */
async function sha256(txt){
  const data = new TextEncoder().encode(txt);
  if(window.crypto && crypto.subtle){
    try{ const b = await crypto.subtle.digest('SHA-256', data); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join(''); }catch(_){}
  }
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l = data.length, n = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(n); m.set(data); m[l] = 0x80;
  const dv = new DataView(m.buffer); dv.setUint32(n - 4, l * 8); dv.setUint32(n - 8, Math.floor(l / 0x20000000));
  const w = new Uint32Array(64), r = (x, k) => (x >>> k) | (x << (32 - k));
  for(let o = 0; o < n; o += 64){
    for(let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
    for(let i = 16; i < 64; i++){ const a = w[i-15], b = w[i-2]; w[i] = (w[i-16] + (r(a,7) ^ r(a,18) ^ (a >>> 3)) + w[i-7] + (r(b,17) ^ r(b,19) ^ (b >>> 10))) | 0; }
    let [a,b,c,d,e,f,g,h] = H;
    for(let i = 0; i < 64; i++){
      const t1 = (h + (r(e,6) ^ r(e,11) ^ r(e,25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((r(a,2) ^ r(a,13) ^ r(a,22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0; H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}
function azar(n){
  const abc = 'abcdefghijkmnpqrstuvwxyz23456789', b = new Uint8Array(n);
  (window.crypto || {getRandomValues: a => a.map(() => Math.floor(Math.random() * 256))}).getRandomValues(b);
  return [...b].map(x => abc[x % abc.length]).join('');
}

async function leerPin(){

async function guardarPin(pin){
  const salt = azar(16), hash = await sha256(salt + ':' + pin);

}

function pantallaBloqueo(html){ $('#lockBox').innerHTML = html; $('#lock').hidden = false; ocultarSplash(); }
function quitarBloqueo(){ $('#lock').hidden = true; }

/* Supervisión: pide el PIN una vez por celular (o lo crea la primera vez) */
async function accesoSupervision(){
  let pin;
  try{ pin = await leerPin(); }
  catch(e){
    pantallaBloqueo(`<h2>Sin conexión</h2><p style="color:var(--mute)">No se pudo conectar con la nube (${esc(e.message)}).</p><button class="btn prim" onclick="location.reload()">Reintentar</button>`);
    return false;
  }
  ACC.pin = pin;
  if(pin && leer('sup') === pin.hash) return true;
  return new Promise(listo => {
    if(!pin){
      pantallaBloqueo(`<h2>Crea tu PIN de supervisión</h2>
        <p style="color:var(--mute);font-size:14px">Protege la gestión de guardias, los informes y los links. Se pide una sola vez en cada celular.</p>
        <label class="field"><span>PIN nuevo (4 a 8 números)</span><input id="p1" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></label>
        <label class="field"><span>Repite el PIN</span><input id="p2" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></label>
        <div id="pMsg"></div><button class="btn prim" id="pOk">Guardar PIN</button>`);
      $('#pOk').onclick = async () => {
        const a = $('#p1').value.trim(), b = $('#p2').value.trim();
        if(!/^\d{4,8}$/.test(a)) return $('#pMsg').innerHTML = '<div class="msg bad">El PIN debe tener de 4 a 8 números.</div>';
        if(a !== b) return $('#pMsg').innerHTML = '<div class="msg bad">Los PIN no coinciden.</div>';
        $('#pOk').disabled = true;
        try{ await guardarPin(a); quitarBloqueo(); listo(true); }
        catch(e){ $('#pMsg').innerHTML = `<div class="msg bad">No se pudo guardar (${esc(e.message)}).</div>`; $('#pOk').disabled = false; }
      };
    } else {
      pantallaBloqueo(`<h2>Osiris · Supervisión</h2>
        <label class="field"><span>Ingresa tu PIN</span><input id="p1" type="password" inputmode="numeric" maxlength="8" autocomplete="current-password"></label>
        <div id="pMsg"></div><button class="btn prim" id="pOk">Entrar</button>`);
      const entrar = async () => {
        const h = await sha256(pin.salt + ':' + $('#p1').value.trim());
        if(h !== pin.hash){ $('#pMsg').innerHTML = '<div class="msg bad">PIN incorrecto.</div>'; $('#p1').value = ''; return; }
        guardar('sup', h); quitarBloqueo(); listo(true);
      };
      $('#pOk').onclick = entrar;
      $('#p1').addEventListener('keydown', e => { if(e.key === 'Enter') entrar(); });
    }
    setTimeout(() => { const i = $('#p1'); if(i) i.focus(); }, 50);
  });
}

}

/* ---------- Dispositivos autorizados por link ----------
   El primer/los primeros dispositivos que abren el link quedan autorizados (hasta los "cupos" del link).
   Cualquier otro queda esperando hasta que supervisión lo permita. */
function miDispositivo(token){
  try{
    const k = 'osiris_dev_' + token;
    let id = localStorage.getItem(k);
    if(!id){ id = azar(16); localStorage.setItem(k, id); if(localStorage.getItem(k) !== id) return null; }
    return id;
  }catch(_){ return null; }
}
function nombreEquipo(){
  const u = navigator.userAgent || '';
  const so = /iPhone/.test(u) ? 'iPhone' : /iPad/.test(u) ? 'iPad' : /Android/.test(u) ? 'Android' : /Windows/.test(u) ? 'Computadora Windows' : /Macintosh|Mac OS/.test(u) ? 'Mac' : 'Equipo';
  const nav = /Edg/.test(u) ? 'Edge' : /CriOS|Chrome/.test(u) ? 'Chrome' : /FxiOS|Firefox/.test(u) ? 'Firefox' : /Safari/.test(u) ? 'Safari' : 'navegador';
  let app = '';
  try{ if(navigator.standalone || matchMedia('(display-mode: standalone)').matches) app = ' (ícono en inicio)'; }catch(_){}
  return so + ' · ' + nav + app;
}
async function dispositivosLink(token){
  const r = await api('eventos?select=detalle,created_at&tipo=eq.Config&edificio=eq.' + MON + '&detalle->>clase=eq.linkdev&detalle->>token=eq.' + enc(token) + '&order=created_at.desc&limit=500');
  const ult = new Map();
  for(const x of r){ const d = detalleDe(x); if(d.dev && !ult.has(d.dev)) ult.set(d.dev, {...d, t: fecha(x.created_at)}); }
  return ult;
}
/* Nuevo estado de un dispositivo (ok / pendiente / bloqueado); las versiones viejas se borran */
async function estadoDev(token, dev, estado, equipo){
  const ev = nuevoEvento('Config', MON, 'Link', {clase:'linkdev', token, dev, estado, equipo});
  await apiEscribir('POST', 'eventos', ev);
  try{ await apiEscribir('DELETE', 'eventos?tipo=eq.Config&edificio=eq.' + MON + '&detalle->>clase=eq.linkdev&detalle->>token=eq.' + enc(token)
    + '&detalle->>dev=eq.' + enc(dev) + '&detalle->>uid=neq.' + enc(ev.detalle.uid)); }catch(_){}
}
async function autorizarDispositivo(token){
  const dev = miDispositivo(token);
  if(!dev){
    pantallaBloqueo('<h2>Abre el link en el navegador normal</h2><p style="color:var(--mute)">Este navegador no deja recordar el dispositivo (modo privado o datos bloqueados). Ábrelo en Safari o Chrome normal.</p>');
    return false;
  }
  ACC.dev = dev;
  let devs;
  try{ devs = await dispositivosLink(token); }
  catch(e){ pantallaBloqueo(`<h2>Sin conexión</h2><p style="color:var(--mute)">${esc(e.message)}</p><button class="btn prim" onclick="location.reload()">Reintentar</button>`); return false; }
  const mio = devs.get(dev);
  if(mio && mio.estado === 'ok') return true;
  if(!mio){
    const cupos = Math.max(1, parseInt(ACC.link.cupos, 10) || 2);
    const usados = [...devs.values()].filter(d => d.estado === 'ok').length;
    try{
      if(usados < cupos){ await estadoDev(token, dev, 'ok', nombreEquipo()); return true; }
      await estadoDev(token, dev, 'pendiente', nombreEquipo());
    }catch(e){ pantallaBloqueo(`<h2>Sin conexión</h2><p style="color:var(--mute)">${esc(e.message)}</p><button class="btn prim" onclick="location.reload()">Reintentar</button>`); return false; }
  }
  esperarAutorizacion(token, dev, mio ? mio.estado : 'pendiente');
  return false;
}
function esperarAutorizacion(token, dev, estado){
  const pintar = est => pantallaBloqueo(est === 'bloqueado'
    ? `<h2>Sin acceso en este dispositivo</h2><p style="color:var(--mute)">Este link ya no está autorizado en este ${esc(nombreEquipo())}.</p><button class="btn prim" id="pedirAcc">Pedir acceso</button>`
    : `<h2>Esperando autorización</h2><p style="color:var(--mute)">Este link ya se abrió en otro dispositivo. Avísale a quien te lo compartió para que autorice este <b>${esc(nombreEquipo())}</b>. La pantalla se abre sola cuando lo haga.</p>`);
  pintar(estado);
  document.addEventListener('click', async e => {
    if(e.target.id !== 'pedirAcc') return;
    e.target.disabled = true;
    try{ await estadoDev(token, dev, 'pendiente', nombreEquipo()); pintar('pendiente'); }catch(_){ e.target.disabled = false; }
  });
  setInterval(async () => {
    try{ const d = (await dispositivosLink(token)).get(dev); if(d && d.estado === 'ok') location.reload(); else if(d && d.estado !== estado){ estado = d.estado; pintar(estado); } }catch(_){}
  }, 10000);
}

/* ---------- Opciones del link de guardia: qué módulos y campos ve el guardia ---------- */
const G_MODS = [['visitas','Visitas'],['visitas_recu','Visitas recurrentes'],['rondas','Rondas'],['incidentes','Incidentes'],['encomiendas','Encomiendas'],['hospedajes','Hospedajes'],['consultas','Consultas (propietarios, vehículos…)']];
const G_CAMPOS = [['v_tarjeta','Tarjeta de acceso (foto + número)'],['v_carnet','Fotos del carnet (anverso y reverso, con lectura)'],['v_vehiculo','Placa del vehículo'],['v_motivo','Motivo de la visita']];
/* lo que trae el edificio por defecto (si no hay configuración en la nube, todo encendido como la app) */
async function opcionesDeEdificio(ed){
  const {mod, existe} = await leerModulos(ed);
  const on = k => existe ? mod[k] === true : true;
  const m = {}, c = {};
  for(const [k] of G_MODS) m[k] = k === 'consultas' ? (on('propietarios') || on('vehiculos') || on('normativas')) : on(k);
  for(const [k] of G_CAMPOS) c[k] = mod[k] !== false;
  return {mod: m, campos: c};
}
function htmlOpciones(o){

    <div style="font-size:13px;font-weight:700;color:var(--mute);margin:12px 0 2px">CAMPOS AL REGISTRAR VISITAS</div>${G_CAMPOS.map(([k, t]) => ck('campos', k, t)).join('')}`;
}
function leerOpcionesDe(box){

async function presetOpciones(){

/* Modo claro / oscuro (automático sigue al teléfono) */
function temaActual(){ const t = leer('tema'); return t === 'light' || t === 'dark' ? t : 'auto'; }
function aplicarTema(t){
  if(t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const oscuro = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.content = oscuro ? '#0B0D11' : '#F5F6F8';
}
aplicarTema(temaActual());
$('#v-cfg').addEventListener('click', async ev => {

    t.disabled = true;

    }catch(e){ $('#gMsg').innerHTML = `<div class="msg bad">No se pudo crear (${esc(e.message)}).</div>`; t.disabled = false; }

  }
  if(t.id === 'cSalir'){ guardar('sup', ''); location.reload(); return; }
  if(t.id === 'cPin'){
    const a = prompt('PIN nuevo (4 a 8 números):'); if(a === null) return;
    if(!/^\d{4,8}$/.test(a.trim())) return alert('El PIN debe tener de 4 a 8 números.');
    if(prompt('Repite el PIN nuevo:') !== a) return alert('Los PIN no coinciden.');
    try{ await guardarPin(a.trim()); alert('PIN cambiado. Los demás celulares lo pedirán de nuevo.'); }catch(e){ alert('No se pudo cambiar: ' + e.message); }
    return;
  }
  const fila = t.closest('.lnk'); if(!fila || !t.dataset.a) return;
  const url = fila.dataset.url;
  if(t.dataset.a === 'copiar'){
    try{ await navigator.clipboard.writeText(url); t.textContent = 'Copiado ✓'; }catch(_){ prompt('Copia el link:', url); }
  } else if(t.dataset.a === 'compartir'){
    const texto = fila.dataset.clase === 'glink' ? `Osiris · App del guardia (${fila.dataset.ed}): ${url}` : `Osiris · Monitoreo en vivo de ${fila.dataset.ed.split('|').join(', ')}: ${url}`;
    if(navigator.share){ try{ await navigator.share({title:'Osiris · Monitoreo', text:texto}); }catch(_){} }
    else location.href = 'https://wa.me/?text=' + enc(texto);
  } else if(t.dataset.a === 'geditar'){
    const d = unicosPorToken(GLINKS).find(x => x.token === fila.dataset.tok); if(d) editarGlink(d);
  } else if(t.dataset.a === 'editar'){

  } else if(t.dataset.a === 'permitir' || t.dataset.a === 'quitar'){

      pintarAjustes();
    }
    catch(e){ alert('No se pudo desactivar: ' + e.message); }
  }
});

/* Un link editado deja varias versiones: se muestra la más nueva de cada uno */
function unicosPorToken(rows){
  const vistos = new Set(), out = [];
  for(const x of rows){ const d = detalleDe(x); if(!d.token || vistos.has(d.token)) continue; vistos.add(d.token); out.push(d); }
  return out;
}

/* ---------- Navegación ---------- */
/* ---------- Volver atrás (historial) ----------
   Cada ventana emergente, foto y sección queda en el historial: "atrás" (gesto
   del iPhone, botón de Android, o deslizar desde el borde izquierdo en la app
   de la pantalla de inicio) cierra lo que está abierto o vuelve a la sección
   anterior. En la primera pantalla no saca de la app. */
const NAV = {pila:[], ignorar:0, desdeAtras:false};
function navPush(e){ NAV.pila.push(e); try{ history.pushState({osiris: NAV.pila.length}, ''); }catch(_){} }
/* cerrado desde la pantalla (botón Cerrar, tocar fuera): se descuenta su entrada */
function navQuitar(tipo){
  if(NAV.desdeAtras) return;
  const i = NAV.pila.lastIndexOf(tipo); if(i < 0) return;
  NAV.pila.splice(i, 1); NAV.ignorar++; try{ history.back(); }catch(_){ NAV.ignorar--; }
}
window.addEventListener('popstate', () => {
  if(NAV.ignorar > 0){ NAV.ignorar--; return; }
  const e = NAV.pila.pop(); if(!e) return;
  NAV.desdeAtras = true;
  try{
    if(e === 'lb') $('#lb').classList.remove('on');
    else if(e === 'sheet') $('#sheet').classList.remove('on');
    else if(e.vista) irA(e.vista, true);
  } finally { setTimeout(() => { NAV.desdeAtras = false; }, 0); }
});
(function(){
  for(const [id, tipo] of [['#sheet','sheet'], ['#lb','lb']]){
    let abierto = $(id).classList.contains('on');
    new MutationObserver(() => {
      const ahora = $(id).classList.contains('on');
      if(ahora === abierto) return;
      abierto = ahora;
      if(ahora){ if(!NAV.desdeAtras) navPush(tipo); }
      else navQuitar(tipo);
    }).observe($(id), {attributes:true, attributeFilter:['class']});
  }
})();
/* Cada sección guarda lo que ya pintó (edificio y mes): al volver se muestra tal cual,
   sin volver a cargar. Solo "En vivo" trae lo último al entrar (sin pantalla de carga),
   y el botón ↻ actualiza todo. */
const VIS = {};
let COB_SUCIO = false;
const claveVista = v => ['cob','cfg','sol'].includes(v) ? 'g' : st.edif + '|' + (v === 'edi' ? '' : (m => m.y + '-' + m.m)(mesActual()));
function irA(v, desdeAtras){
  if(!desdeAtras && v !== vistaActual) navPush({vista: vistaActual});
  vistaActual = v;
  for(const x of ['mov','gua','sol','bus','inf','edi','cfg','cob']) $('#v-' + x).hidden = x !== v;
  [...$('#bnav').children].forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('#cfgBtn').classList.toggle('on', v === 'cfg' || v === 'edi');
  /* Cobros, Peticiones y Ajustes son de todos los edificios: sin selector arriba */
  $('header .row').hidden = v === 'cob' || v === 'cfg' || v === 'sol';
  $('#hBus').hidden = ACC.modo === 'admin' || !['mov','gua','inf','bus'].includes(v);
  $('#hQ').value = v === 'bus' ? BUS.q : '';
  $('#tabs').style.display = v === 'mov' ? '' : 'none';
  $('#online').style.display = v === 'mov' ? '' : 'none';
  $('#periodo').hidden = v !== 'mov';
  $('#mesSel').hidden = !(v === 'gua' || v === 'inf' || v === 'bus');
  scrollTo({top:0});
  if(v === 'mov'){ refrescar(); return; }
  if(v === 'sol'){ pintarSolicitudes(); return; }
  if(v === 'cob' && COB_SUCIO){ COB_SUCIO = false; VIS.cob = 'g'; Cobros.pintar($('#v-cob'), true); return; }
  const k = claveVista(v);
  if(VIS[v] === k && $('#v-' + v).innerHTML.trim()) return;
  VIS[v] = k;
  if(v === 'gua'){ if(GU.datos && GU.datos.ed === st.edif && GU.datos.mes.y === mesActual().y && GU.datos.mes.m === mesActual().m) pintarGuardias(); else cargarGuardias(); }
  if(v === 'inf') pintarInforme();
  if(v === 'edi') pintarEdificio();
  if(v === 'bus') pintarBuscar();
  if(v === 'cfg') pintarAjustes();
  if(v === 'cob') Cobros.pintar($('#v-cob'));
}
$('#cfgBtn').innerHTML = icono('engranaje', 20);
$('#cfgBtn').addEventListener('click', () => irA('cfg'));
$('#hLupa').innerHTML = icono('buscar', 18);
$('#hBus').addEventListener('submit', e => {
  e.preventDefault();
  BUS.q = $('#hQ').value.trim(); $('#hQ').blur();
  if(vistaActual !== 'bus') irA('bus');
  buscar();
});
function refrescarVista(){
  for(const k in VIS) delete VIS[k];
  if(ACC.modo === 'admin') return refrescar(true);
  const v = vistaActual, t = [refrescar(true), cargarSolicitudes(), cargarGuardias()];
  VIS.gua = claveVista('gua');
  if(v === 'cob'){ VIS.cob = 'g'; t.push(Cobros.pintar($('#v-cob'), true)); } else COB_SUCIO = true;
  if(v === 'cfg'){ VIS.cfg = 'g'; t.push(pintarAjustes()); }
  if(v === 'bus'){ VIS.bus = claveVista('bus'); if(BUS.res.length) t.push(buscar()); }
  if(v === 'inf'){ VIS.inf = claveVista('inf'); }
  if(v === 'edi'){
    VIS.edi = claveVista('edi');
    /* con cambios sin guardar no se recarga (se perderían): se avisa */
    if(ED.sucio[ED.sub]) alert('Tienes cambios sin guardar en esta sección. Guárdalos antes de recargar.');
    else { delete ED.datos[ED.sub]; t.push(pintarEdificio()); }
  }
  return Promise.all(t.map(p => Promise.resolve(p).catch(() => {})));
}
function alCambiarEdificio(){
  BUS.res = []; BUS.sel = new Set(); ED.datos = {}; ED.sucio = {}; ED.cfg = null;
  if(ACC.modo === 'admin') return;
  /* Guardias se prepara por detrás para que al entrar ya esté */
  VIS.gua = claveVista('gua'); cargarGuardias();
  const v = vistaActual;
  if(['bus','edi','inf'].includes(v)){ VIS[v] = claveVista(v); ({bus:pintarBuscar, edi:pintarEdificio, inf:pintarInforme})[v](); }
}
$('#bnav').addEventListener('click', e => { const b = e.target.closest('button'); if(b) irA(b.dataset.v); });
$('#mesSel').addEventListener('change', () => {
  const v = vistaActual;
  if(v === 'bus'){ BUS.res = []; VIS.bus = claveVista('bus'); pintarBuscar(); }
  if(v === 'gua' || v === 'bus' || v === 'inf'){ VIS.gua = claveVista('gua'); cargarGuardias(); }
  if(v === 'inf'){ VIS.inf = claveVista('inf'); pintarInforme(); }
});

/* ---------- Arranque ---------- */
(async function(){
  document.querySelectorAll('.nico').forEach(n => n.innerHTML = icono(n.dataset.ico, 22));
  const p = leer('periodo'); if(p && [...$('#periodo').options].some(o => o.value === p)){ st.periodo = p; $('#periodo').value = p; }
  llenarMeses();
  pintarTabs();
  $('#list').innerHTML = '<div class="carga" role="status" aria-label="Cargando"></div>';
  const token = new URLSearchParams(location.search).get('a');
  if(token){
    ACC.modo = 'admin';
    document.body.classList.add('admin');
    if(!(await accesoAdmin(token))) return;
    if(!(await autorizarDispositivo(token))) return;
    if(ACC.eds.length === 1){
      st.edif = ACC.eds[0];
      $('#edif').hidden = true;
      $('#edifFijo').hidden = false; $('#edifFijo').textContent = st.edif;
      document.title = 'Osiris · ' + st.edif;
    } else {
      /* varios edificios: el selector muestra SOLO los suyos */
      const pedido = new URLSearchParams(location.search).get('e'), previo = leer('edif_' + token);
      st.edif = ACC.eds.find(e => e === pedido) || ACC.eds.find(e => e === previo) || ACC.eds[0];
      $('#edif').innerHTML = ACC.eds.map(e => `<option value="${esc(e)}">${esc(e)}</option>`).join('');
      $('#edif').value = st.edif;
      $('#edif').addEventListener('change', () => guardar('edif_' + token, $('#edif').value));
      document.title = 'Osiris · Monitoreo';
    }
  } else {
    if(!(await accesoSupervision())) return;
    $('#bnav').hidden = false; $('#cfgBtn').hidden = false; $('#hBus').hidden = false;
    try{ await cargarEdificios(); }
    catch(e){
      $('#dot').classList.add('off'); $('#liveTxt').textContent = 'Sin conexión';
      $('#list').innerHTML = `<div class="err">No se pudo conectar con la nube (${esc(e.message)}).<br>Toca ↻ para reintentar.</div>`;
      $('#refresh').addEventListener('click', () => location.reload(), {once:true});
      return;
    }
  }
  await refrescar();
  ocultarSplash();
  /* abrir directo en una sección (ej. ?v=cob para Cobros) */
  const vIni = new URLSearchParams(location.search).get('v');
  if(ACC.modo !== 'admin' && ['gua','sol','cob','inf','bus','edi','cfg'].includes(vIni)) irA(vIni, true);
  /* pedidos de adelanto / día libre: número en "Guardias" (solo supervisión) */
  if(ACC.modo !== 'admin'){
    cargarSolicitudes(); setInterval(() => { if(!document.hidden) cargarSolicitudes(); }, 120000);
    /* Guardias se prepara por detrás: al tocarlo ya está listo */
    if(!VIS.gua){ VIS.gua = claveVista('gua'); cargarGuardias(); }
  }
  st.timer = setInterval(() => {
    if(document.hidden || vistaActual !== 'mov') return;
    if(ACC.modo === 'admin'){
      /* si desactivan el link, deja de mostrar datos */
      Promise.all([leerLink(token), dispositivosLink(token)]).then(([d, devs]) => {
        if(!d){ clearInterval(st.timer); pantallaBloqueo('<h2>Link desactivado</h2><p style="color:var(--mute)">Este link ya no tiene acceso.</p>'); return; }
        const yo = devs.get(ACC.dev);
        if(!yo || yo.estado !== 'ok'){ clearInterval(st.timer); esperarAutorizacion(token, ACC.dev, 'bloqueado'); return; }
        /* si supervisión cambió sus edificios, se recarga con la lista nueva */
        if(edsDeLink(d).join('|') !== ACC.eds.join('|')) location.reload();
      }).catch(() => {});
    }
    refrescar();
  }, REFRESCO_MS);
})();

/* ---------- Deslizar desde el borde izquierdo para volver ----------
   Con el monitoreo guardado en la pantalla de inicio, el iPhone no tiene gesto
   de volver: se hace aquí (aparece una flecha; al soltar con la flecha azul, vuelve). */
(function(){
  const app = (navigator.standalone === true) || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if(!app) return;
  const f = document.createElement('div'); f.className = 'volverG'; f.innerHTML = icono('atras', 22);
  document.body.appendChild(f);
  let x0 = null, y0 = 0, dx = 0;
  addEventListener('touchstart', e => { const t = e.touches[0]; if(e.touches.length === 1 && t.clientX < 24 && NAV.pila.length){ x0 = t.clientX; y0 = t.clientY; dx = 0; } else x0 = null; }, {passive:true});
  addEventListener('touchmove', e => {
    if(x0 === null) return; const t = e.touches[0];
    dx = t.clientX - x0; if(Math.abs(t.clientY - y0) > 60 && dx < 30){ x0 = null; f.style.opacity = 0; return; }
    const p = Math.max(0, Math.min(dx, 120));
    f.style.opacity = Math.min(1, p / 60); f.style.transform = 'translateX(' + (p * 0.6 - 50) + 'px)'; f.classList.toggle('listo', p >= 80);
  }, {passive:true});
  const fin = () => { if(x0 !== null && dx >= 80) history.back(); x0 = null; f.style.opacity = 0; f.style.transform = ''; f.classList.remove('listo'); };
  addEventListener('touchend', fin, {passive:true}); addEventListener('touchcancel', () => { dx = 0; fin(); }, {passive:true});
})();
